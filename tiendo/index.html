<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Immortal Ascent · Tiên Đồ</title>
<meta name="description" content="Game nhập vai tu tiên pixel chơi online trên trình duyệt: tu luyện, đột phá cảnh giới, phi kiếm diệt yêu ma cùng bạn bè.">
<meta name="theme-color" content="#1A1226">
<meta property="og:title" content="Immortal Ascent · Tiên Đồ, tu tiên pixel chơi cùng bạn bè">
<meta property="og:description" content="Luyện Khí, Trúc Cơ, Kim Đan… phi kiếm diệt ma, chat với đạo hữu ngay trên trình duyệt.">
<link rel="icon" type="image/png" href="icon-32.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Immortal Ascent">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:image" content="https://tien2201.github.io/dau-hu-thui-game/tiendo/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
/* Canvas pixel phủ màn hình + canvas chữ nét cao phía trên; HUD: góc trên trái (nhân vật), trên phải (menu), dưới trái (cần gạt), dưới phải (chiêu thức) */
:root{
  --ink:#F5EEDC; --ink2:#B9AEC9; --bg:#1A1226; --panel:#241A33; --panel2:#2E2342; --line:#4A3A63;
  --gold:#F2C14E; --gold2:#C9912A; --red:#E0453A; --blue:#3E8EDE; --jade:#3FB58A; --purple:#9B6BE0;
  --px:"Pixelify Sans","Be Vietnam Pro",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#gc{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#oc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[disabled]{opacity:.4;cursor:default}
.hidden{display:none!important}
.hud{position:fixed;z-index:5}
/* khung nhân vật */
#me{top:calc(6px + env(safe-area-inset-top,0px));left:max(6px,env(safe-area-inset-left));display:flex;gap:6px;align-items:flex-start;background:rgba(20,13,30,.72);border:1px solid var(--line);border-radius:12px;padding:5px 8px 6px 5px;max-width:250px}
#me canvas{width:44px;height:44px;border-radius:9px;background:#3A2C52;image-rendering:pixelated;flex:0 0 44px}
#me .g{min-width:0;flex:1;width:170px}
#me .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.2}
#me .rl{font-family:var(--px);font-size:12px;color:var(--gold);display:block;line-height:1.2;margin-bottom:3px}
.bar{position:relative;height:9px;border-radius:5px;background:#120C1C;overflow:hidden;margin-top:2px;border:1px solid #000}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .15s}
.bar b{position:absolute;inset:0;font-size:8px;line-height:8px;text-align:center;font-weight:700;color:#fff;text-shadow:0 1px 0 #000}
#hpb i{background:linear-gradient(#FF6B5E,#C8302A)}#mpb i{background:linear-gradient(#69B7FF,#2A6FC8)}#shb{position:absolute;left:0;top:0;bottom:0;background:rgba(242,193,78,.75)}
#track{top:calc(68px + env(safe-area-inset-top,0px));left:max(6px,env(safe-area-inset-left));font-size:11.5px;line-height:1.35;background:rgba(20,13,30,.6);border-radius:9px;padding:5px 8px;max-width:220px;pointer-events:auto}
#track b{color:var(--gold);font-weight:700}
#buffs{display:flex;gap:4px;margin-top:3px}#buffs span{font-size:10px;background:#5A3A8A;border-radius:6px;padding:0 5px;font-weight:700}
/* nút góc phải */
#tr{top:calc(6px + env(safe-area-inset-top,0px));right:max(6px,env(safe-area-inset-right));display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.ib{width:40px;height:40px;border-radius:11px;background:rgba(36,26,51,.88);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.ib svg{width:22px;height:22px}
.ib .dt{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
#mapname{top:calc(54px + env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right));font-family:var(--px);font-size:13px;color:var(--ink2);text-shadow:0 1px 0 #000;pointer-events:none}
/* thanh kinh nghiệm */
#expw{left:0;right:0;bottom:0;height:12px;background:rgba(10,6,16,.85)}
#expw i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8E5BE0,#C9A0FF)}
#expw b{position:absolute;inset:0;font-size:9px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 1px 0 #000}
/* cần gạt */
#joy{left:max(18px,env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(245,238,220,.1);border:2px solid rgba(245,238,220,.28);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(245,238,220,.75);box-shadow:0 3px 0 rgba(0,0,0,.35)}
/* thanh máu boss */
#bossbar{top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(52vw,420px);pointer-events:none;text-align:center}
#bossbar .bbh{display:flex;justify-content:center;align-items:baseline;gap:8px;font-family:var(--px);text-shadow:0 2px 0 #000}
#bossbar b{font-size:17px;color:#FF9C8A}#bossbar small{font-size:11px;color:var(--ink2)}
#bossbar .bb{position:relative;height:12px;margin-top:3px;background:#120C1C;border:1px solid #000;border-radius:3px;box-shadow:0 0 0 1px #8A2A2A,0 0 12px rgba(255,40,40,.35);overflow:hidden}
#bossbar .bb i{position:absolute;left:0;top:0;bottom:0}#bbW{background:#F5EEDC;transition:width .6s .25s}#bbI{background:linear-gradient(#FF5A4A,#A81A1A)}
#bossbar .bb u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,231,168,.85);box-shadow:0 0 4px #000;z-index:2}#bossbar .bb .pm1{left:33.33%}#bossbar .bb .pm2{left:66.66%}
#bossbar.mini .bb u{display:none}#bossbar.mini b{color:#FFD25A}#bossbar.mini .bb{height:9px}
#bossbar.p3 .bb{animation:bbp3 .35s infinite alternate}@keyframes bbp3{to{box-shadow:0 0 0 1px #B04AFF,0 0 22px rgba(176,74,255,.9)}}#bossbar.p3 b{color:#D9B8FF}
#bossbar.p2 .bb{animation:bbp .5s infinite alternate}@keyframes bbp{to{box-shadow:0 0 0 1px #FF5A4A,0 0 18px rgba(255,60,40,.8)}}
#bbP{position:absolute;inset:0;font-size:9px;line-height:11px;font-weight:800;color:#fff;text-shadow:0 1px 0 #000}
.bossban{position:fixed;left:0;right:0;top:34%;z-index:20;text-align:center;pointer-events:none;animation:bban 3s forwards}
.bossban .ln{height:2px;width:70%;margin:6px auto;background:linear-gradient(90deg,transparent,#FF5A4A,transparent)}
.bossban b{display:block;font-family:var(--px);font-size:38px;color:#FF7A6A;letter-spacing:3px;text-shadow:0 3px 0 #000,0 0 24px rgba(255,40,40,.8)}
.bossban small{display:block;font-size:14px;color:var(--ink);letter-spacing:4px;text-transform:uppercase;text-shadow:0 2px 0 #000}
@keyframes bban{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@media (orientation:portrait){#bossbar{top:calc(108px + env(safe-area-inset-top,0px));width:70vw}}
/* chiêu thức */
#acts{right:max(14px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:200px;height:170px}
.sk{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4A3A6E,#2A1E40);border:2px solid #6A5390;display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.sk svg{width:60%;height:60%}
.sk .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;pointer-events:none}
.sk .lb{position:absolute;bottom:2px;left:0;right:0;font-size:9px;font-weight:800;text-align:center;text-shadow:0 1px 0 #000;pointer-events:none}
.sk .ct{position:absolute;top:1px;right:6px;font-size:10px;font-weight:800;text-shadow:0 1px 0 #000}
.sk.lock{filter:grayscale(1);opacity:.45}
.sk.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.4)}
.sk:active{transform:scale(.94)}
#bAtk{right:0;bottom:0;width:84px;height:84px;background:radial-gradient(circle at 40% 35%,#E0453A,#8A1E1A);border-color:#F2C14E}
#bS1{right:92px;bottom:0;width:54px;height:54px}#bS2{right:80px;bottom:62px;width:54px;height:54px}#bS3{right:20px;bottom:92px;width:54px;height:54px}
#bPot{right:150px;bottom:0;width:44px;height:44px}#bAuto{right:142px;bottom:110px;width:44px;height:44px}#bMed{right:84px;bottom:124px;width:44px;height:44px}
/* chat */
#chatlog{left:max(8px,env(safe-area-inset-left));bottom:calc(160px + env(safe-area-inset-bottom,0px));width:min(46vw,300px);font-size:11.5px;line-height:1.4;pointer-events:none}
#chatlog div{background:rgba(10,6,16,.55);border-radius:6px;padding:1px 6px;margin-top:2px;width:fit-content;max-width:100%;animation:cf 12s forwards}
#chatlog b{color:var(--gold)}
@keyframes cf{0%,80%{opacity:1}100%{opacity:0}}
/* bảng */
.sbg{position:fixed;inset:0;z-index:30;background:rgba(8,4,14,.55);display:flex;align-items:center;justify-content:center;padding:12px;touch-action:auto}
.sheet{width:100%;max-width:440px;max-height:calc(100% - 8px);overflow:auto;background:linear-gradient(180deg,#2E2342,#221832);border:2px solid #5A4680;border-radius:16px;padding:16px;box-shadow:0 0 0 3px #120C1C,0 18px 40px rgba(0,0,0,.6);animation:pop .18s ease-out;touch-action:pan-y;position:relative}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet h2{font-family:var(--px);font-weight:700;font-size:24px;margin:0 0 6px;color:var(--gold);letter-spacing:.5px}
.sheet h3{font-family:var(--px);font-size:16px;margin:12px 0 6px;color:var(--gold)}
.sub{color:var(--ink2);font-size:13px;line-height:1.5;margin:0 0 10px}
.x{position:absolute;z-index:3;top:10px;right:10px;width:34px;height:34px;border-radius:9px;background:#3A2C52;border:1px solid var(--line);font-size:18px;font-weight:800}
.btn{display:block;width:100%;border-radius:11px;padding:11px;font-weight:800;font-size:15px;background:linear-gradient(#5E8BFF,#3A5FD0);box-shadow:0 3px 0 #22378A;margin-top:8px;color:#fff}
.btn.gold{background:linear-gradient(#FFD66B,#E0A52E);color:#3A2200;box-shadow:0 3px 0 #8A5A10}
.btn.red{background:linear-gradient(#FF6B5E,#C8302A);box-shadow:0 3px 0 #7A1A14}
.btn.jade{background:linear-gradient(#5ED3A4,#2E9A70);box-shadow:0 3px 0 #1A5E44}
.btn.alt{background:#3A2C52;box-shadow:0 3px 0 #1A1226;border:1px solid var(--line)}
.btn small{display:block;font-weight:600;font-size:11px;opacity:.85}
.btn:active{transform:translateY(2px);box-shadow:none}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.inp{width:100%;background:#120C1C;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);font-family:var(--body);outline:none;margin-top:6px}
.inp:focus{border-color:var(--gold)}
.lab{font-size:12px;font-weight:700;color:var(--ink2);margin-top:10px;display:block}
.msg{font-size:13px;color:#FF9C8A;min-height:18px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.it{position:relative;aspect-ratio:1;background:#1A1226;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:4px}
.it canvas{width:36px;height:36px;image-rendering:pixelated}
.it .q{position:absolute;bottom:2px;right:4px;font-size:10px;font-weight:800;text-shadow:0 1px 0 #000}
.it .pl{position:absolute;top:2px;left:4px;font-size:10px;font-weight:800;color:var(--gold)}
.it.eq{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.t1{border-color:#6A6A7A}.t2{border-color:#5ED37A;background:radial-gradient(#1F3A2A,#1A1226)}.t3{border-color:#4FA8FF;background:radial-gradient(#1C2E4A,#1A1226)}.t4{border-color:#B07CFF;background:radial-gradient(#33204F,#1A1226)}
.t5{border-color:#FFC83D;background:radial-gradient(#4A3510,#1A1226);animation:gl5 2s ease-in-out infinite}.t6{border-color:#FF5A4A;background:radial-gradient(#4A1414,#1A1226);animation:gl6 1.6s ease-in-out infinite}
@keyframes gl5{50%{box-shadow:0 0 10px 1px rgba(255,200,61,.55)}}@keyframes gl6{50%{box-shadow:0 0 12px 2px rgba(255,90,74,.6)}}
.it .nm2{position:absolute;left:2px;right:2px;bottom:-1px;font-size:8.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
.icard{border:2px solid;border-radius:14px;padding:12px;margin:30px 0 8px;position:relative;overflow:hidden}
.icard .top{display:flex;gap:12px;align-items:center}.icard .big{width:72px;height:72px;border-radius:12px;display:grid;place-items:center;flex:0 0 72px;border:1px solid rgba(255,255,255,.15)}
.icard b{font-family:var(--px);font-size:20px;display:block;line-height:1.1}.icard .rr{font-size:12px;font-weight:800;letter-spacing:.5px}
.icard .fl{font-style:italic;color:var(--ink2);font-size:12.5px;margin-top:8px;line-height:1.45}
.icard ul{margin:8px 0 0;padding:0;list-style:none;font-size:13px}.icard li{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.12);padding:3px 0}.icard li b{font-family:var(--body);font-size:13px;color:#7FE0A8;display:inline}
.doll{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center;margin:4px 0 6px}
.slot{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;background:#1A1226;display:grid;place-items:center;position:relative;padding:4px}
.slot small{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink2);font-weight:700}
.slot .pl{position:absolute;top:2px;left:5px;font-size:10px;font-weight:800;color:var(--gold)}
.slotcol{display:flex;flex-direction:column;gap:22px}
.line{display:flex;gap:10px;align-items:center;background:#1A1226;border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:6px}
.line canvas{width:40px;height:40px;image-rendering:pixelated;flex:0 0 40px;background:#2A1E40;border-radius:8px}
.line .g{flex:1;min-width:0}.line b{display:block;font-size:14px}.line small{color:var(--ink2);font-size:12px;line-height:1.35;display:block}
.line button.s{border-radius:9px;padding:7px 11px;font-weight:800;font-size:13px;background:linear-gradient(#FFD66B,#E0A52E);color:#3A2200;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin:6px 0}
.stats span{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}.stats span b{color:var(--gold)}
.tabs{display:flex;gap:5px;margin:4px 0 10px;flex-wrap:wrap}
.tabs button{background:#1A1226;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px}
.tabs button.on{background:var(--gold);color:#3A2200;border-color:var(--gold)}
.chatbox{height:44vh;overflow:auto;background:#120C1C;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;line-height:1.5}
.chatbox div{margin-bottom:3px;word-break:break-word}.chatbox b{color:var(--gold)}.chatbox em{color:var(--ink2);font-style:normal;font-size:11px}
.sw2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw2 button{width:34px;height:34px;border-radius:9px;border:2px solid transparent}
.sw2 button.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.seg{display:flex;background:#120C1C;border-radius:10px;padding:3px;gap:3px;margin-top:6px}
.seg button{flex:1;border-radius:8px;padding:8px;font-weight:700;font-size:13px}
.seg button.on{background:#3A2C52;color:var(--gold)}
.prev{display:block;margin:6px auto;width:96px;height:120px;image-rendering:pixelated;background:radial-gradient(#3A2C52,#1A1226);border-radius:12px}
.logo{text-align:center;font-family:var(--px);font-weight:700;line-height:1;margin:0 0 12px}
.logo img{width:104px;height:104px;image-rendering:pixelated;display:block;margin:-4px auto 4px;filter:drop-shadow(0 0 14px rgba(155,107,224,.55));animation:emb 4s ease-in-out infinite}
@keyframes emb{50%{transform:translateY(-4px)}}
.logo b{display:block;font-size:40px;letter-spacing:2px;background:linear-gradient(180deg,#FFF4C2 0%,#F2C14E 45%,#C9761A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5A1A0A) drop-shadow(0 0 1px #1A1226)}
.logo span{display:block;font-size:13px;letter-spacing:3px;color:#C9A0FF;margin-top:6px}
@media (max-height:420px){.logo img{width:64px;height:64px}.logo b{font-size:30px}}
.qr{display:block;width:min(60vw,230px);margin:6px auto;border-radius:12px;border:3px solid #D82D8B}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:rgba(20,13,30,.95);border:1px solid var(--gold);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;max-width:86vw;text-align:center;pointer-events:none;animation:pop .2s}
.banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:20;font-family:var(--px);font-weight:700;font-size:30px;color:var(--gold);text-shadow:0 3px 0 #000,0 0 20px rgba(242,193,78,.6);text-align:center;pointer-events:none;animation:bn 2.6s forwards;white-space:nowrap}
.banner small{display:block;font-size:15px;color:var(--ink)}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-40%) scale(.9)}12%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
.fade{position:fixed;inset:0;background:#000;z-index:25;pointer-events:none;opacity:0;transition:opacity .35s}
.fade.on{opacity:1}
.tgl{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#1A1226;width:100%;text-align:left;font-size:14px;font-weight:700;margin-top:6px}
.tgl .g{flex:1}.tgl small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.swt{width:46px;height:26px;border-radius:13px;background:#4A3A63;position:relative;flex:0 0 46px}.swt::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tgl[aria-pressed=true] .swt{background:var(--jade)}.tgl[aria-pressed=true] .swt::after{left:23px}
input[type=range]{width:100%;accent-color:var(--gold)}
.rot{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.rot svg{width:90px;height:90px;animation:tilt 1.8s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.rot b{font-family:var(--px);font-size:24px;color:var(--gold)}.rot p{margin:0;font-size:14px;color:var(--ink2);max-width:300px;line-height:1.5}
@media (orientation:portrait){ body.ingame:not(.portraitOK) .rot{display:flex} }
@media (orientation:portrait){
  #acts{transform:scale(.92);transform-origin:bottom right}

/* ===== GIAO DIỆN KIỂU THUỶ MẶC ===== */
:root{--paper:#E9E4D8;--paper2:#A8A398;--gl:#D9B97A;--edge:rgba(217,185,122,.32);--serif:"Cormorant Garamond","Be Vietnam Pro",serif}
.sbg{background:rgba(5,7,10,.62);backdrop-filter:blur(2px)}
.sheet{background:linear-gradient(180deg,rgba(26,29,37,.97),rgba(12,14,19,.97));border:1px solid var(--edge);border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.7);position:relative}
.sheet::before,.sheet::after{content:'';position:absolute;width:0;height:0;border-style:solid;pointer-events:none}
.sheet::before{left:0;top:0;border-width:14px 14px 0 0;border-color:var(--paper) transparent transparent transparent;opacity:.85}
.sheet::after{right:0;bottom:0;border-width:0 0 14px 14px;border-color:transparent transparent var(--paper) transparent;opacity:.85}
.sheet h2{font-family:var(--serif);font-size:27px;font-weight:700;color:#EBD6A6;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.sheet h3{font-family:var(--serif);font-size:19px;color:var(--gl);border-bottom:1px solid var(--edge);padding-bottom:3px}
.sub{color:var(--paper2)}
.btn{border-radius:3px;background:rgba(255,255,255,.06);border:1px solid rgba(233,228,216,.28);box-shadow:none;color:var(--paper);font-weight:700;letter-spacing:.3px}
.btn.gold{background:linear-gradient(180deg,#EAD7A8,#C9A464);border-color:#F2E2B8;color:#1C1408;box-shadow:0 0 18px rgba(217,185,122,.25)}
.btn.red{background:rgba(160,40,40,.35);border-color:rgba(255,120,110,.5);box-shadow:none}
.btn.alt{background:rgba(255,255,255,.04);border:1px solid rgba(233,228,216,.2);box-shadow:none}
.btn:active{transform:translateY(1px)}
.line{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.08);border-radius:3px}
.line button.s{border-radius:3px;background:linear-gradient(180deg,#EAD7A8,#C9A464);color:#1C1408}
.it{background:rgba(255,255,255,.04);border-radius:4px;border-color:rgba(255,255,255,.1)}
.x{border-radius:3px!important;background:rgba(255,255,255,.06)!important;border:1px solid rgba(233,228,216,.25)!important}
.inp{border-radius:3px!important;background:rgba(0,0,0,.35)!important;border:1px solid rgba(233,228,216,.25)!important}
.toast{background:rgba(10,12,16,.82)!important;border:1px solid var(--edge)!important;border-radius:3px!important;font-family:var(--body)}
.banner{font-family:var(--serif)!important;letter-spacing:2px}

#bbI{background:linear-gradient(90deg,#8A1A1A,#E0453A)}
/* MÀN TOÀN CẢNH (kiểu Where Winds Meet) */
.fsbg{padding:0;background:#07090C}
.fs{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(230px,29%) 1fr minmax(230px,31%);grid-template-rows:auto 1fr auto;background:radial-gradient(ellipse at 50% 45%,#2C3341 0%,#161A22 52%,#07090C 100%);color:var(--paper);overflow:hidden;animation:fsin .3s ease-out}
@keyframes fsin{from{opacity:0}}
.fs::before{content:'';position:absolute;left:0;top:0;border-style:solid;border-width:22px 22px 0 0;border-color:var(--paper) transparent transparent transparent;opacity:.9;z-index:2}
.fs::after{content:'';position:absolute;right:0;bottom:0;border-style:solid;border-width:0 0 22px 22px;border-color:transparent transparent var(--paper) transparent;opacity:.9;z-index:2}
.fsh{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) max(30px,env(safe-area-inset-right)) 4px max(34px,env(safe-area-inset-left));position:relative}
.fst{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--paper2)}.fst span{cursor:default}.fst span.on{color:#EBD6A6;font-family:var(--serif);font-size:20px;font-weight:700;border-bottom:1px solid var(--gl)}.fst span.done{color:var(--paper)}.fst em{font-style:normal;opacity:.4}
.fst button{font-size:15px;color:var(--paper2);padding:2px 4px}.fst button.on{color:#EBD6A6;font-family:var(--serif);font-size:20px;font-weight:700;border-bottom:1px solid var(--gl)}
.fsT{font-family:var(--serif);letter-spacing:1.5px;font-size:13px;color:var(--paper2);font-weight:600}
.fsh .x{position:static!important}
.fsl,.fsr{overflow:auto;padding:6px 10px 10px;min-height:0}
.fsl{padding-left:max(18px,env(safe-area-inset-left))}.fsr{padding-right:max(18px,env(safe-area-inset-right))}
.fsc{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0;overflow:hidden}
.fsc img{height:min(92%,520px);width:auto;max-width:100%;image-rendering:pixelated;position:relative;z-index:1;animation:fsbr 3.5s ease-in-out infinite;filter:drop-shadow(0 10px 20px rgba(0,0,0,.55))}
@keyframes fsbr{50%{transform:translateY(-1.2%)}}
.fsfloor{position:absolute;left:10%;right:10%;bottom:2%;height:22%;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--cc) 30%,transparent),transparent 70%)}
.fsb{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:6px max(34px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom,0px)) max(34px,env(safe-area-inset-left));gap:10px}
.fbtn{padding:9px 18px;border:1px solid rgba(233,228,216,.3);background:rgba(255,255,255,.05);color:var(--paper);font-weight:700;font-size:14px;border-radius:2px;letter-spacing:.5px}
.fbtn.gold{background:linear-gradient(180deg,#EAD7A8,#C9A464);color:#1C1408;border-color:#F2E2B8;min-width:150px}
.fcard{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:8px 10px;margin-bottom:5px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.07);border-left:2px solid transparent;border-radius:2px;color:var(--paper)}
.fcard.on{border-left-color:var(--cc);background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 22%,transparent),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent)}
.fcard .fi{font-size:20px;width:28px;text-align:center;flex:none}.fcard .fn{flex:1;min-width:0}.fcard .fn b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:700}.fcard .fn small{display:block;font-size:11px;color:var(--paper2);line-height:1.3}
.fcard .lv{font-size:11px;color:var(--paper2);white-space:nowrap}
.fcard img{width:40px;height:40px;image-rendering:pixelated;flex:none}
.fsname{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.05;margin-top:2px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.fsrole{font-size:12px;color:var(--paper2);margin:3px 0 6px}
.lore{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.4;color:#D8D0BE;margin:4px 0 6px}
.fsec{display:flex;justify-content:space-between;font-family:var(--serif);font-size:15px;font-weight:700;color:var(--gl);border-bottom:1px solid var(--edge);margin:9px 0 4px;padding-bottom:1px}.fsec span{font-family:var(--body);font-size:11px;color:var(--paper2);font-weight:600}
.fp{font-size:12.5px;line-height:1.45;color:var(--paper);margin:2px 0}
.atr{display:grid;grid-template-columns:76px 1fr 22px;gap:7px;align-items:center;font-size:12px;margin:2px 0}.atr span{color:var(--paper2)}.atr i{height:4px;background:rgba(255,255,255,.08);display:block}.atr u{display:block;height:100%;background:linear-gradient(90deg,#A8A398,#EAD7A8)}.atr b{text-align:right;font-weight:700}
.drv{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px}.drv span{display:flex;justify-content:space-between;color:var(--paper2);border-bottom:1px dotted rgba(255,255,255,.1);padding:1px 0}.drv b{color:var(--paper)}
.fspow{font-family:var(--serif);font-size:40px;font-weight:700;color:#EBD6A6;line-height:1}.fspow small{font-family:var(--body);font-size:11px;color:var(--paper2);display:block;letter-spacing:1px}
.fsx{height:4px;background:rgba(255,255,255,.08);margin:4px 0 2px}.fsx i{display:block;height:100%;background:linear-gradient(90deg,#8E7AB8,#D9B97A)}
.fs .seg{border-radius:2px}.fs .sw2 button{border-radius:2px}
@media (max-width:760px),(max-height:330px){.fs{grid-template-columns:minmax(190px,34%) 1fr minmax(200px,36%)}.fsname{font-size:24px}.fsc img{height:84%}}
@media (orientation:portrait){.fs{grid-template-columns:1fr;grid-template-rows:auto 34vh auto 1fr auto}.fsc{grid-row:2}.fsl{grid-row:3;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.fsl .fcard{min-width:150px;margin:0}.fsr{grid-row:4}}
/* ===== ĐIỆN ẢNH ===== */
.lbx{position:fixed;left:0;right:0;height:0;background:#000;z-index:40;pointer-events:none;transition:height .7s cubic-bezier(.7,0,.2,1)}
.lbx.t{top:0}.lbx.b{bottom:0}body.cine .lbx{height:9vh}
#mmw,#track,#tr,#me,#expw,#chatlog,#buffs{transition:opacity .6s}body.cine #mmw,body.cine #track,body.cine #tr,body.cine #me,body.cine #expw,body.cine #chatlog{opacity:0}
#gc,#oc{transform-origin:50% 50%}
.sheet{animation:shin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes shin{from{opacity:0;transform:translateY(10px) scale(.97);filter:blur(3px)}}
.fs .fsp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.fs>*{position:relative;z-index:1}
.fsc::before,.fsc::after{content:'';position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 40% 22% at 30% 70%,rgba(200,210,230,.07),transparent 70%),radial-gradient(ellipse 35% 18% at 72% 62%,rgba(200,210,230,.06),transparent 70%);animation:fog 18s linear infinite alternate}
.fsc::after{animation-duration:26s;animation-direction:alternate-reverse;opacity:.8;transform:scaleX(-1)}
@keyframes fog{to{translate:12% -3%}}
.fsc img{filter:blur(0) brightness(1) drop-shadow(0 10px 20px rgba(0,0,0,.55))}
.fs.enter .fsh{animation:fdown .7s .05s cubic-bezier(.2,.8,.2,1) both}
.fs.enter .fsl>*{animation:fleft .6s calc(.15s + var(--i,0) * .05s) cubic-bezier(.2,.8,.2,1) both}
.fs.enter .fsr>*{animation:fright .6s calc(.3s + var(--i,0) * .04s) cubic-bezier(.2,.8,.2,1) both}
.fs.enter .fsb{animation:fup .6s .5s cubic-bezier(.2,.8,.2,1) both}

let unlT = 0, unlCur = null;
function unlTick(dt){
  if(!P || !me || !running || DLG || unlCur || document.querySelector('.sbg,.intro') || document.body.classList.contains('cine')) return;
  unlT += dt; if(unlT < 1.2) return; unlT = 0; P.tips = P.tips || {};
  const u = UNL.find(x => !P.tips[x.id] && x.c()); if(u) showUnl(u);
}
function showUnl(u){
  P.tips[u.id] = 1; saveSoon(); unlCur = u; sfx.lv();
  const tt = typeof u.t === 'function' ? u.t() : u.t, sel = u.el && u.el(), tg = sel && $(sel);
  const e = document.createElement('div'); e.className = 'unl'; e.innerHTML = `<i>${u.ic}</i><div><small>${Lx("MỚI MỞ KHOÁ")}</small><b>${tt}</b><p>${u.b()}</p></div><button>${Lx("Đã hiểu")}</button>`;
  document.body.appendChild(e); if(tg) tg.classList.add('hl');
  const done = () => { if(!e.isConnected) return; e.classList.add('out'); setTimeout(() => e.remove(), 300); if(tg) tg.classList.remove('hl'); unlCur = null; };
  e.querySelector('button').onclick = done; setTimeout(done, 9000);
}

    if(best >= 6){ const r = out.find(x => x.t >= 6); Net.chat(Lx("tầm bảo được {0} [{1}]!", RAR[6][0], r.txt), true); } };
