<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tỷ Phú Việt</title>
<meta name="description" content="Cờ tỷ phú 3D chủ đề Việt Nam, chơi online cùng bạn bè hoặc với máy.">
<meta name="theme-color" content="#173F86">
<meta property="og:title" content="Tỷ Phú Việt · Cờ tỷ phú 3D chơi cùng bạn bè">
<meta property="og:description" content="Tạo phòng, gửi link, đổ xúc xắc mua đất khắp Việt Nam!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%23fff' stroke='%23173F86' stroke-width='5'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23E8413C'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23173F86'/%3E%3Ccircle cx='44' cy='44' r='5' fill='%23173F86'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@500;600;700&display=swap">
<style>
/* Bàn cờ 3D phủ màn hình; thanh người chơi trên cùng; bảng điều khiển dưới cùng; các bảng (trang chủ, phòng chờ, mua đất) nổi lên giữa */
:root{
  --ink:#16233F; --ink2:#5A6785; --paper:#FFFDF6; --line:#E3DCCB;
  --blue:#173F86; --blue2:#2457B8; --sun:#FFC83D; --sund:#C9921A; --red:#E8413C; --green:#2FA35A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#9ED8FF 0%,#D9F1FF 55%,#F3FBFF 100%);color:var(--ink);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.hidden{display:none!important}

/* ---- thanh người chơi ---- */
#bar{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:6px;align-items:flex-start;z-index:5;pointer-events:none}
#bar>*{pointer-events:auto}
#plist{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;min-width:0}
.pc{position:relative;background:rgba(255,253,246,.95);border-radius:14px;padding:5px 6px 5px 5px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 rgba(23,63,134,.25);border:2.5px solid transparent;min-width:0;transition:transform .2s}
.pc img{width:34px;height:34px;border-radius:10px;flex:0 0 34px;background:#E8F2FF}
.pc .g{min-width:0;flex:1;line-height:1.1}
.pc .nm{font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pc .mn{font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc .clr{position:absolute;left:5px;right:5px;bottom:-2.5px;height:4px;border-radius:3px}
.pc.on{border-color:var(--sun);transform:translateY(2px);box-shadow:0 0 0 3px rgba(255,200,61,.45),0 3px 0 rgba(23,63,134,.25)}
.pc.out{filter:grayscale(1);opacity:.55}
.pc .tg{position:absolute;top:-6px;right:-4px;font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:7px;padding:1px 5px}
.fl{position:fixed;z-index:9;font-family:var(--display);font-weight:800;font-size:19px;pointer-events:none;text-shadow:0 2px 0 #fff,0 0 6px #fff;animation:flup 1.5s ease-out forwards}
@keyframes flup{to{transform:translateY(-34px);opacity:0}}
.tbtn{width:40px;height:40px;border-radius:13px;background:rgba(255,253,246,.95);box-shadow:0 3px 0 rgba(23,63,134,.25);display:grid;place-items:center;padding:0;flex:0 0 40px}
.tbtn svg{width:22px;height:22px}
#ticker{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));transition:top .2s;z-index:4;background:rgba(22,35,63,.82);color:#fff;font-weight:600;font-size:12.5px;padding:5px 12px;border-radius:999px;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* ---- điều khiển dưới ---- */
#ctrl{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;pointer-events:none}
#ctrl>*{pointer-events:auto}
.panel{width:100%;max-width:440px;background:var(--paper);border-radius:22px;padding:12px;box-shadow:0 6px 0 rgba(23,63,134,.28),0 10px 30px rgba(23,63,134,.18);animation:pup .22s ease-out}
@keyframes pup{from{transform:translateY(20px);opacity:0}}
.wait{background:rgba(255,253,246,.94);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(23,63,134,.25);display:flex;align-items:center;gap:8px}
.wait img{width:28px;height:28px;border-radius:8px}
.rollbtn{min-width:220px;height:74px;border-radius:24px;background:linear-gradient(180deg,#FFD866,#FFB81F);color:#5A3300;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.5px;box-shadow:0 6px 0 var(--sund),0 10px 24px rgba(201,146,26,.4);display:flex;align-items:center;justify-content:center;gap:10px;animation:bob 1.6s ease-in-out infinite}
.rollbtn svg{width:34px;height:34px}
.rollbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sund)}
@keyframes bob{50%{transform:translateY(-3px)}}
.row2{display:flex;gap:8px}
.btn{flex:1;border-radius:16px;padding:12px 10px;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;background:var(--green);color:#fff;box-shadow:0 4px 0 #1D7A40}
.btn small{display:block;font-family:var(--body);font-weight:600;font-size:11.5px;opacity:.9;margin-top:1px}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 #A82A26}
.btn.blue{background:var(--blue2);box-shadow:0 4px 0 var(--blue)}
.btn.gold{background:var(--sun);color:#5A3300;box-shadow:0 4px 0 var(--sund)}
.btn:active{transform:translateY(3px);box-shadow:none}
.tcard{display:flex;gap:10px;align-items:stretch;margin-bottom:10px}
.tcard .band{width:10px;border-radius:6px;flex:0 0 10px}
.tcard .g{flex:1;min-width:0}
.tcard b{font-family:var(--display);font-size:22px;line-height:1.05;display:block}
.tcard small{color:var(--ink2);font-size:12.5px;font-weight:600}
.rents{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.rents span{background:#F1ECDD;border-radius:8px;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink2);padding:3px 0;line-height:1.25}
.rents span b{display:block;font-family:var(--display);font-size:14px;color:var(--ink)}
.rents span.on{background:var(--sun);color:#5A3300}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 10px;font-weight:700;font-size:13px}

/* ---- bảng nổi (sheet) ---- */
.sbg{position:fixed;inset:0;z-index:30;background:rgba(14,26,52,.45);display:flex;align-items:center;justify-content:center;padding:16px;touch-action:auto}
.sbg.soft{background:rgba(14,26,52,.18)}
.sbg.clear{background:transparent;pointer-events:none}.sbg.clear .sheet{pointer-events:auto}
.sheet{width:100%;max-width:420px;max-height:calc(100% - 10px);overflow:auto;background:var(--paper);border-radius:26px;padding:18px 18px 20px;box-shadow:0 8px 0 rgba(23,63,134,.35),0 20px 50px rgba(0,0,0,.25);animation:pop .22s cubic-bezier(.2,1.4,.5,1);touch-action:pan-y;position:relative}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.sheet h2{font-family:var(--display);font-size:26px;margin:0 0 4px;line-height:1.1}
.sub{color:var(--ink2);font-size:13.5px;line-height:1.5;margin:0 0 12px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:800;line-height:1}
.stack{display:flex;flex-direction:column;gap:10px}
.inp{width:100%;border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;font-family:var(--display);font-weight:700;background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--blue2)}
.lab{font-weight:700;font-size:12.5px;color:var(--ink2);margin:2px 0 -4px}
.pawns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pawns button{background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:3px;aspect-ratio:1}
.pawns button img{width:100%;height:100%;display:block}
.pawns button.on{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(36,87,184,.25)}
.logo{font-family:var(--display);font-weight:800;text-align:center;line-height:.9;margin:4px 0 8px;color:var(--blue)}
.logo .a{display:block;font-size:20px;letter-spacing:4px;color:var(--red)}
.logo .b{display:block;font-size:52px;text-shadow:0 4px 0 var(--sun)}
.code{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:8px;text-align:center;background:#fff;border:3px dashed var(--blue2);border-radius:18px;color:var(--blue);padding:4px 0}
.plr{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 10px}
.plr img{width:40px;height:40px;border-radius:10px;background:#E8F2FF}
.plr .g{flex:1;min-width:0}.plr b{display:block;font-size:14.5px}.plr small{color:var(--ink2);font-size:12px}
.plr .dotc{width:14px;height:14px;border-radius:50%}
.plr button{background:#F1ECDD;border-radius:10px;padding:6px 9px;font-weight:700;font-size:12px}
.seg{display:flex;background:#F1ECDD;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.err{background:#FDE4E2;color:#A82A26;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.45}
.cardpop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:20;width:min(78vw,300px);border-radius:22px;padding:18px 16px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2),0 20px 40px rgba(0,0,0,.25);animation:flip .45s cubic-bezier(.2,1.3,.5,1);pointer-events:none}
.cardpop b{font-family:var(--display);font-size:24px;display:block;margin-bottom:6px}
.cardpop p{margin:0;font-weight:600;font-size:15px;line-height:1.45}
@keyframes flip{from{transform:translate(-50%,-50%) rotateY(90deg) scale(.8)}}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid var(--line);margin-bottom:6px}
.rank .n{font-family:var(--display);font-weight:800;font-size:22px;width:26px;text-align:center}
.rank img{width:40px;height:40px;border-radius:10px}
.rank .g{flex:1}.rank b{display:block}.rank small{color:var(--ink2);font-size:12px}
.rank.w{background:linear-gradient(90deg,#FFF3C4,#fff);border-color:var(--sun)}
.logs{max-height:42vh;overflow:auto;font-size:13px;line-height:1.5;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.logs div{padding:3px 0;border-bottom:1px dashed var(--line)}
.qr{display:block;width:min(64vw,240px);margin:6px auto;border-radius:16px;border:3px solid #D82D8B}
.tgl{display:flex;align-items:center;gap:12px;padding:11px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;width:100%;text-align:left;font-size:15px;font-weight:700}
.tgl .g{flex:1}.tgl small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.sw{width:48px;height:28px;border-radius:14px;background:#C9C4B5;position:relative;flex:0 0 48px;transition:background .2s}.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.tgl[aria-pressed=true] .sw{background:var(--green)}.tgl[aria-pressed=true] .sw::after{left:23px}
input[type=range]{width:100%;accent-color:var(--blue2)}
.toast{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;padding:9px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:88vw;text-align:center;animation:pup .2s ease-out;pointer-events:none}
.load{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:#173F86;color:#fff;font-family:var(--display);font-size:22px;text-align:center;padding:20px}
.foot{display:flex;gap:8px;justify-content:center;margin-top:12px}
.foot button{background:transparent;font-weight:700;font-size:13px;color:var(--blue2);padding:6px 8px}
.foot button.cafe{background:#FFE7A8;color:#6B3E12;border-radius:999px;padding:6px 12px}
#plist.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (orientation:landscape) and (max-height:560px){
  #plist.two{grid-template-columns:repeat(4,minmax(0,170px))}
  #plist{grid-template-columns:repeat(4,minmax(0,170px));justify-content:center}
  #ticker{top:auto!important;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;transform:none;max-width:34vw}
  #ctrl{justify-content:flex-end;padding-right:max(14px,env(safe-area-inset-right))}
  .panel{max-width:340px}
  .sheet{max-height:calc(100% - 4px);padding:14px 16px}
  .logo .b{font-size:40px}
}
@media (prefers-reduced-motion:reduce){.rollbtn{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar" class="hidden">
  <div id="plist"></div>
  <button class="tbtn" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="#16233F" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="ticker" class="hidden"></div>
<div id="ctrl"></div>
<div class="load" id="load">Đang dựng bàn cờ…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const K = n => Math.round(n).toLocaleString('vi-VN') + 'k';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
if(!window.THREE){ $('#load').textContent = 'Không tải được bộ vẽ 3D. Kiểm tra mạng rồi tải lại trang nha.'; return; }
const T = THREE;

/* ======================= DỮ LIỆU BÀN CỜ ======================= */
const GROUPS = [
  { n:'Tây Bắc',      c:'#9A6A3F', h:50 },
  { n:'Đông Bắc',     c:'#3FB0E8', h:50 },
  { n:'Miền Trung',   c:'#E05BA6', h:100 },
  { n:'Nam Trung Bộ', c:'#F28C28', h:100 },
  { n:'Nam Bộ',       c:'#E8413C', h:150 },
  { n:'Biển đảo & Sài Gòn', c:'#2FA35A', h:200 },
];
const TILES = [
  { t:'start', n:'Xuất phát' },
  { t:'prop', n:'Hà Giang', g:0, p:60 },
  { t:'chest', n:'Khí vận' },
  { t:'prop', n:'Sa Pa', g:0, p:60 },
  { t:'prop', n:'Mộc Châu', g:0, p:80 },
  { t:'air', n:'Sân bay Nội Bài', p:200 },
  { t:'prop', n:'Ninh Bình', g:1, p:100 },
  { t:'prop', n:'Hạ Long', g:1, p:100 },
  { t:'jail', n:'Nhà tù' },
  { t:'prop', n:'Hải Phòng', g:1, p:120 },
  { t:'prop', n:'Huế', g:2, p:140 },
  { t:'chance', n:'Cơ hội' },
  { t:'prop', n:'Hội An', g:2, p:140 },
  { t:'prop', n:'Đà Nẵng', g:2, p:160 },
  { t:'tax', n:'Thuế thu nhập', p:100 },
  { t:'air', n:'Sân bay Đà Nẵng', p:200 },
  { t:'fest', n:'Lễ hội' },
  { t:'prop', n:'Quy Nhơn', g:3, p:180 },
  { t:'chest', n:'Khí vận' },
  { t:'prop', n:'Nha Trang', g:3, p:180 },
  { t:'prop', n:'Đà Lạt', g:3, p:200 },
  { t:'air', n:'Sân bay Cam Ranh', p:200 },
  { t:'prop', n:'Phan Thiết', g:4, p:220 },
  { t:'prop', n:'Vũng Tàu', g:4, p:220 },
  { t:'gojail', n:'Vào tù' },
  { t:'prop', n:'Cần Thơ', g:4, p:240 },
  { t:'chance', n:'Cơ hội' },
  { t:'prop', n:'Phú Quốc', g:5, p:300 },
  { t:'air', n:'Sân bay Tân Sơn Nhất', p:200 },
  { t:'prop', n:'Côn Đảo', g:5, p:320 },
  { t:'tax', n:'Thuế xa xỉ', p:150 },
  { t:'prop', n:'TP. Hồ Chí Minh', g:5, p:400 },
];
const N = TILES.length, AIRS = [5, 15, 21, 28], JAIL = 8;
const START_MONEY = 1500, PASS_GO = 200, JAIL_FINE = 50;
const LV_NAME = ['Đất trống', '1 nhà', '2 nhà', '3 nhà', 'Toà nhà'];
const RENT_MUL = [1, 3, 8, 18, 30];
const COLORS = ['#E8413C', '#2F7BE0', '#2FA35A', '#F2A818'];
const PAWNS = [ { k:'meo', n:'Mèo Cam' }, { k:'cun', n:'Cún Vàng' }, { k:'gau', n:'Gấu Trúc' }, { k:'ech', n:'Ếch Xanh' }, { k:'tho', n:'Thỏ Bông' }, { k:'heo', n:'Heo Hồng' } ];
const BOT_NAMES = ['Máy Bé Bi', 'Máy Su Su', 'Máy Mít', 'Máy Đậu'];
const upCost = (i, lv) => GROUPS[TILES[i].g].h * (lv >= 3 ? 2 : 1); // lên toà nhà tốn gấp đôi
const baseRent = i => Math.round(TILES[i].p / 10);

const CHANCE = [
  { x:'Trúng vé số cào! Nhận 150k.', f:(s, p) => gain(s, p, 150) },
  { x:'Tiến về ô Xuất phát, nhận 200k.', f:(s, p) => { teleport(s, p, 0); return 1; } },
  { x:'Bay tới sân bay gần nhất.', f:(s, p) => { teleport(s, p, AIRS.find(i => i > p.pos) ?? AIRS[0]); return 1; } },
  { x:'Vượt đèn đỏ, nộp phạt 50k.', f:(s, p) => pay(s, p, 50, -1) },
  { x:'Quên ví ở quán, lùi lại 3 ô.', f:(s, p) => { back(s, p, 3); return 1; } },
  { x:'Đua xe trái phép! Vào tù ngay.', f:(s, p) => goJail(s, p) },
  { x:'Thẻ ra tù miễn phí, giữ lại dùng sau.', f:(s, p) => { p.free = (p.free || 0) + 1; } },
  { x:'Bảo trì nhà cửa: mỗi căn nhà nộp 25k.', f:(s, p) => pay(s, p, 25 * houses(s, p.i), -1) },
  { x:'Vé du lịch Phú Quốc! Bay tới Phú Quốc.', f:(s, p) => { teleport(s, p, 27); return 1; } },
  { x:'Hôm nay sinh nhật bạn! Mỗi người tặng 30k.', f:(s, p) => s.players.forEach(o => { if(o !== p && !o.out) pay(s, o, 30, p.i); }) },
  { x:'Đi phượt Hà Giang, bay thẳng tới Hà Giang.', f:(s, p) => { teleport(s, p, 1); return 1; } },
  { x:'Livestream bán hàng nổ đơn! Nhận 100k.', f:(s, p) => gain(s, p, 100) },
];
const CHEST = [
  { x:'Bán đồ cũ trên chợ online, lời 100k.', f:(s, p) => gain(s, p, 100) },
  { x:'Lãi tiết kiệm ngân hàng: nhận 50k.', f:(s, p) => gain(s, p, 50) },
  { x:'Đóng học phí khoá tiếng Anh 100k.', f:(s, p) => pay(s, p, 100, -1) },
  { x:'Hoàn thuế cuối năm: nhận 20k.', f:(s, p) => gain(s, p, 20) },
  { x:'Thắng cuộc thi nấu ăn, nhận 80k.', f:(s, p) => gain(s, p, 80) },
  { x:'Tiền điện nước tháng này 40k.', f:(s, p) => pay(s, p, 40, -1) },
  { x:'Lì xì Tết từ ông bà: nhận 60k.', f:(s, p) => gain(s, p, 60) },
  { x:'Sửa xe máy hết 60k.', f:(s, p) => pay(s, p, 60, -1) },
  { x:'Về Xuất phát ăn Tết, nhận 200k.', f:(s, p) => { teleport(s, p, 0); return 1; } },
  { x:'Đi đám cưới bạn thân, mừng 50k.', f:(s, p) => pay(s, p, 50, -1) },
];

/* ======================= LUẬT CHƠI (hàm thuần trên trạng thái) ======================= */
function newState(o = {}){
  return { v:0, phase:'lobby', mode:o.mode || 'online', host:o.host || '', players:[], turn:0, round:1, maxRound:o.rounds ?? 20,
    own:{}, fest:-1, dice:[1, 1], dbl:0, dblNow:false, pend:null, log:[], anim:{ seq:0, pi:0, dice:null, steps:[] }, ts:Date.now(), rank:null };
}
const cur = s => s.players[s.turn];
const alive = s => s.players.filter(p => !p.out);
function log(s, t){ s.log.push(t); if(s.log.length > 40) s.log.shift(); }
function step(s, o){ s.anim.steps.push(o); }
function gain(s, p, m){ p.money += m; step(s, { k:'pay', a:-1, b:p.i, m }); }
function houses(s, pi){ return Object.values(s.own).filter(o => o.o === pi).reduce((a, o) => a + o.lv, 0); }
function ownsGroup(s, pi, g){ return TILES.every((t, i) => t.g !== g || t.t !== 'prop' || (s.own[i] && s.own[i].o === pi)); }
function rentOf(s, i){
  const t = TILES[i], o = s.own[i]; if(!o) return 0;
  let r;
  if(t.t === 'air'){ const n = AIRS.filter(a => s.own[a] && s.own[a].o === o.o).length; r = 25 * Math.pow(2, n - 1); }
  else { r = baseRent(i) * RENT_MUL[o.lv]; if(o.lv === 0 && ownsGroup(s, o.o, t.g)) r *= 2; }
  if(s.fest === i) r *= 2;
  return r;
}
function worth(s, pi){
  const p = s.players[pi]; if(p.out) return 0;
  let w = p.money;
  for(const [i, o] of Object.entries(s.own)) if(o.o === pi){ w += TILES[i].p; for(let l = 0; l < o.lv; l++) w += upCost(+i, l); }
  return w;
}
function raise(s, p, need){
  const mine = () => Object.entries(s.own).filter(([i, o]) => o.o === p.i).map(([i, o]) => [+i, o]);
  let sold = [];
  for(const [i, o] of mine().sort((a, b) => b[1].lv - a[1].lv)){
    while(o.lv > 0 && p.money < need){ o.lv--; p.money += Math.round(upCost(i, o.lv) / 2); sold.push(TILES[i].n); }
  }
  for(const [i] of mine().sort((a, b) => TILES[a[0]].p - TILES[b[0]].p)){
    if(p.money >= need) break;
    delete s.own[i]; if(s.fest === i) s.fest = -1; p.money += Math.round(TILES[i].p / 2); sold.push(TILES[i].n);
  }
  if(sold.length) log(s, `${p.name} phải bán bớt ${[...new Set(sold)].join(', ')} để trả nợ`);
}
function pay(s, p, amt, to){
  amt = Math.round(amt); if(amt <= 0 || p.out) return;
  if(p.money < amt) raise(s, p, amt);
  const paid = Math.min(amt, Math.max(0, p.money));
  p.money -= paid; if(to >= 0) s.players[to].money += paid;
  step(s, { k:'pay', a:p.i, b:to, m:paid });
  if(paid < amt) bankrupt(s, p, to);
}
function bankrupt(s, p, to){
  p.out = true; p.money = 0; p.jail = 0;
  for(const i of Object.keys(s.own)) if(s.own[i].o === p.i){ delete s.own[i]; if(s.fest === +i) s.fest = -1; }
  log(s, `${p.name} phá sản${to >= 0 ? ` vì nợ ${s.players[to].name}` : ''}!`);
  step(s, { k:'bk', pi:p.i });
}
function walkTo(s, p, n){
  const path = [];
  for(let k = 0; k < n; k++){ p.pos = (p.pos + 1) % N; path.push(p.pos); if(p.pos === 0){ p.money += PASS_GO; } }
  step(s, { k:'walk', pi:p.i, path });
  if(path.includes(0)){ step(s, { k:'pay', a:-1, b:p.i, m:PASS_GO }); log(s, `${p.name} đi qua Xuất phát, nhận ${K(PASS_GO)}`); }
}
function back(s, p, n){ const path = []; for(let k = 0; k < n; k++){ p.pos = (p.pos - 1 + N) % N; path.push(p.pos); } step(s, { k:'walk', pi:p.i, path }); }
function teleport(s, p, to){
  if(to <= p.pos && to !== p.pos || to === 0){ p.money += PASS_GO; step(s, { k:'pay', a:-1, b:p.i, m:PASS_GO }); }
  p.pos = to; step(s, { k:'jump', pi:p.i, to });
}
function goJail(s, p){ p.pos = JAIL; p.jail = 1; s.dbl = 0; s.dblNow = false; step(s, { k:'jump', pi:p.i, to:JAIL }); log(s, `${p.name} bị đưa vào tù!`); }
function resolve(s, p, depth = 0){
  const i = p.pos, t = TILES[i];
  if(t.t === 'prop' || t.t === 'air'){
    const o = s.own[i];
    if(!o){ if(p.money >= t.p) s.pend = { k:'buy', i }; else log(s, `${p.name} không đủ tiền mua ${t.n}`); }
    else if(o.o === p.i){ if(t.t === 'prop' && o.lv < 4 && p.money >= upCost(i, o.lv)) s.pend = { k:'up', i }; }
    else { const r = rentOf(s, i); log(s, `${p.name} trả ${K(r)} tiền thuê ${t.n} cho ${s.players[o.o].name}`); pay(s, p, r, o.o); }
  } else if(t.t === 'chance' || t.t === 'chest'){
    const c = pick(t.t === 'chance' ? CHANCE : CHEST);
    step(s, { k:'card', t:t.n, x:c.x, ch:t.t === 'chance' });
    log(s, `${p.name} rút ${t.n}: ${c.x}`);
    const moved = c.f(s, p);
    if(moved && !p.out && depth < 2 && p.jail === 0) resolve(s, p, depth + 1);
  } else if(t.t === 'tax'){ log(s, `${p.name} nộp ${t.n} ${K(t.p)}`); pay(s, p, t.p, -1); }
  else if(t.t === 'gojail') goJail(s, p);
  else if(t.t === 'fest'){ if(Object.values(s.own).some(o => o.o === p.i && true)) s.pend = { k:'fest' }; else log(s, `${p.name} dạo Lễ hội nhưng chưa có đất để tổ chức`); }
}
function finish(s){
  s.pend = null;
  const al = alive(s);
  if(al.length <= 1) return gameOver(s);
  const p = cur(s);
  if(s.dblNow && !p.out && p.jail === 0){ s.again = true; return s; }
  return nextTurn(s);
}
function nextTurn(s){
  s.dbl = 0; s.dblNow = false; s.again = false;
  let t = s.turn;
  do { t = (t + 1) % s.players.length; if(t === 0) s.round++; } while(s.players[t].out);
  if(s.maxRound && s.round > s.maxRound) return gameOver(s);
  s.turn = t; return s;
}
function gameOver(s){
  s.phase = 'over'; s.pend = null;
  s.rank = s.players.map(p => ({ i:p.i, w:worth(s, p.i), out:p.out })).sort((a, b) => (a.out - b.out) || (b.w - a.w)).map(r => r.i);
  log(s, `Ván đấu kết thúc! ${s.players[s.rank[0]].name} là Tỷ Phú Việt!`);
  return s;
}
function beginAnim(s, d){ s.anim = { seq:s.anim.seq + 1, pi:s.turn, dice:d, steps:[] }; }

// act: trả về trạng thái mới hoặc null nếu không hợp lệ. by = id người gửi
function act(s0, a){
  const s = clone(s0), by = a.by;
  s.players.forEach((p, i) => p.i = i);
  const P = s.players.find(p => p.id === by);
  s.ts = Date.now();
  switch(a.type){
    /* ---- phòng chờ ---- */
    case 'join': {
      if(P){ P.name = a.p.name || P.name; return s; }
      if(s.phase !== 'lobby' || s.players.length >= 4) return null;
      const used = s.players.map(p => p.pawn);
      const pawn = used.includes(a.p.pawn) ? PAWNS.find(x => !used.includes(x.k)).k : a.p.pawn;
      s.players.push({ id:a.p.id, name:(a.p.name || 'Người chơi').slice(0, 14), pawn, dev:a.p.dev, bot:false, money:START_MONEY, pos:0, jail:0, out:false, free:0, i:s.players.length });
      return s;
    }
    case 'leave': if(s.phase !== 'lobby' || !P) return null; s.players.splice(P.i, 1); if(s.host === by && s.players.length) s.host = s.players.find(p => !p.bot)?.id || ''; return s;
    case 'addbot': {
      if(s.phase !== 'lobby' || s.host !== by || s.players.length >= 4) return null;
      const used = s.players.map(p => p.pawn), pawn = PAWNS.find(x => !used.includes(x.k)).k;
      s.players.push({ id:'bot' + Math.random().toString(36).slice(2, 7), name:BOT_NAMES.find(n => !s.players.some(p => p.name === n)), pawn, dev:'', bot:true, money:START_MONEY, pos:0, jail:0, out:false, free:0, i:s.players.length });
      return s;
    }
    case 'kick': if(s.phase !== 'lobby' || s.host !== by || !s.players[a.pi] || s.players[a.pi].id === by) return null; s.players.splice(a.pi, 1); return s;
    case 'rounds': if(s.phase !== 'lobby' || s.host !== by) return null; s.maxRound = a.n; return s;
    case 'pawn': {
      if(s.phase !== 'lobby' || !P || s.players.some(p => p.pawn === a.pawn && p !== P)) return null; P.pawn = a.pawn; return s;
    }
    case 'start': {
      if(s.phase !== 'lobby' || s.host !== by || s.players.length < 2) return null;
      s.phase = 'play'; s.turn = 0; s.round = 1;
      s.players.forEach((p, i) => Object.assign(p, { i, money:START_MONEY, pos:0, jail:0, out:false, free:0 }));
      log(s, 'Ván đấu bắt đầu! Chúc mọi người phát tài 🎲'.replace(' 🎲', ''));
      return s;
    }
    case 'botify': {
      const p = s.players[a.pi]; if(!p || p.bot || p.out || s.phase !== 'play') return null;
      p.bot = true; log(s, `${p.name} vắng mặt, máy đánh thay`); return s;
    }
    case 'unbot': { if(!P || !P.bot || P.dev === '' ) return null; P.bot = false; log(s, `${P.name} đã quay lại`); return s; }
    case 'resign': {
      if(!P || P.out || s.phase !== 'play') return null;
      const wasTurn = cur(s) === P;
      beginAnim(s, null); bankrupt(s, P, -1); log(s, `${P.name} xin thua`);
      if(alive(s).length <= 1) return gameOver(s);
      if(wasTurn){ s.pend = null; return nextTurn(s); }
      return s;
    }
  }
  /* ---- trong ván: chỉ người tới lượt (hoặc máy) ---- */
  if(s.phase !== 'play') return null;
  const p = cur(s);
  if(p.id !== by || a.v0 !== undefined && a.v0 !== s0.v) return null;
  switch(a.type){
    case 'roll': {
      if(s.pend) return null;
      const d = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)], dbl = d[0] === d[1];
      beginAnim(s, d); s.dice = d; s.again = false;
      if(p.jail > 0){
        s.dblNow = false;
        if(dbl){ p.jail = 0; log(s, `${p.name} đổ được đôi, thoát tù!`); walkTo(s, p, d[0] + d[1]); resolve(s, p); return s.pend ? s : finish(s); }
        p.jail++;
        if(p.jail > 3){ log(s, `${p.name} ở tù đủ 3 lượt, nộp phạt ${K(JAIL_FINE)}`); pay(s, p, JAIL_FINE, -1); if(p.out) return finish(s); p.jail = 0; walkTo(s, p, d[0] + d[1]); resolve(s, p); return s.pend ? s : finish(s); }
        log(s, `${p.name} đổ ${d[0]}-${d[1]}, vẫn ngồi tù`); return finish(s);
      }
      s.dblNow = dbl;
      if(dbl){ s.dbl++; if(s.dbl >= 3){ log(s, `${p.name} đổ đôi 3 lần liền, bị nghi gian lận!`); goJail(s, p); return finish(s); } }
      log(s, `${p.name} đổ ${d[0]} + ${d[1]} = ${d[0] + d[1]}${dbl ? ' (đôi! được đổ tiếp)' : ''}`);
      walkTo(s, p, d[0] + d[1]); resolve(s, p);
      return s.pend ? s : finish(s);
    }
    case 'buy': {
      if(!s.pend || s.pend.k !== 'buy') return null;
      const i = s.pend.i, t = TILES[i]; if(p.money < t.p) return null;
      p.money -= t.p; s.own[i] = { o:p.i, lv:0 }; log(s, `${p.name} mua ${t.n} giá ${K(t.p)}`);
      if(t.t === 'prop' && ownsGroup(s, p.i, t.g)) log(s, `${p.name} sở hữu trọn vùng ${GROUPS[t.g].n}, tiền thuê x2!`);
      return finish(s);
    }
    case 'up': {
      if(!s.pend || s.pend.k !== 'up') return null;
      const i = s.pend.i, o = s.own[i], c = upCost(i, o.lv); if(p.money < c) return null;
      p.money -= c; o.lv++; log(s, `${p.name} xây ${LV_NAME[o.lv].toLowerCase()} ở ${TILES[i].n}`);
      return finish(s);
    }
    case 'fest': {
      if(!s.pend || s.pend.k !== 'fest' || !s.own[a.i] || s.own[a.i].o !== p.i) return null;
      s.fest = a.i; log(s, `${p.name} tổ chức Lễ hội ở ${TILES[a.i].n}, tiền thuê x2!`); return finish(s);
    }
    case 'skip': if(!s.pend) return null; return finish(s);
    case 'bail': {
      if(s.pend || p.jail <= 0) return null;
      if(a.card){ if(!p.free) return null; p.free--; log(s, `${p.name} dùng thẻ ra tù miễn phí`); }
      else { if(p.money < JAIL_FINE) return null; p.money -= JAIL_FINE; log(s, `${p.name} nộp ${K(JAIL_FINE)} ra tù`); }
      p.jail = 0; return s;
    }
  }
  return null;
}
// Máy chơi
function botAction(s){
  const p = cur(s);
  if(s.pend){
    const k = s.pend.k;
    if(k === 'buy') return { type:p.money - TILES[s.pend.i].p >= 120 ? 'buy' : 'skip' };
    if(k === 'up') return { type:p.money - upCost(s.pend.i, s.own[s.pend.i].lv) >= 180 ? 'up' : 'skip' };
    if(k === 'fest'){ const mine = Object.keys(s.own).filter(i => s.own[i].o === s.turn).map(Number).sort((a, b) => rentOf(s, b) - rentOf(s, a)); return { type:'fest', i:mine[0] }; }
  }
  if(p.jail > 0 && p.free) return { type:'bail', card:true };
  if(p.jail > 0 && p.money > 450) return { type:'bail' };
  return { type:'roll' };
}

const FIREBASE_CONFIG = {

  messagingSenderId: "960591114586",
  appId: "1:960591114586:web:e9d261b3d6ee865e5d4363",
};
const FB_VER = '10.12.2', ROOMS = 'typhu_rooms';
const QS = new URLSearchParams(location.search);
const TEST_BC = QS.has('bc'); // ?bc=1 : thử online bằng nhiều tab trên cùng máy
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const idStore = TEST_BC ? { get:k => sessionStorage.getItem(k), set:(k, v) => sessionStorage.setItem(k, v) } : store; // thử nhiều tab: mỗi tab 1 người
const DEV = idStore.get('typhu_dev') || (() => { const d = 'd' + Math.random().toString(36).slice(2, 10); idStore.set('typhu_dev', d); return d; })();
let FBX = null;
async function fb(){
  if(FBX) return FBX;
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [app, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
  const a = app.initializeApp(FIREBASE_CONFIG, 'typhu');
  FBX = { db:fs.getFirestore(a), F:fs };
  return FBX;
}
const Net = {
  kind:'solo', code:'', unsub:null, st:null,
  async open(kind, code, init){
    this.close(); this.kind = kind; this.code = code;
    if(kind === 'solo'){ this.st = init; setTimeout(() => onState(this.st), 0); return true; }
    if(kind === 'bc'){
      this.bc = new BroadcastChannel('typhu_' + code);
      this.bc.onmessage = () => { const t = store.get('typhu_room_' + code); if(t) onState(JSON.parse(t)); };
      if(init) store.set('typhu_room_' + code, JSON.stringify(init));
      const t = store.get('typhu_room_' + code); if(!t) return false;
      setTimeout(() => onState(JSON.parse(t)), 0); return true;
    }
    const { db, F } = await fb(), ref = F.doc(db, ROOMS, code);
    if(init) await F.setDoc(ref, { s:JSON.stringify(init), v:init.v, t:F.serverTimestamp() });
    else { const sn = await F.getDoc(ref); if(!sn.exists()) return false; }
    this.unsub = F.onSnapshot(ref, sn => { if(sn.exists()) onState(JSON.parse(sn.data().s)); else roomGone(); }, e => netErr(e));
    return true;
  },
  close(){ if(this.unsub){ this.unsub(); this.unsub = null; } if(this.bc){ this.bc.close(); this.bc = null; } },
  async commit(fn){
    if(this.kind === 'solo'){ const ns = fn(this.st); if(!ns) return false; ns.v = this.st.v + 1; this.st = ns; store.set('typhu_solo', JSON.stringify(ns)); onState(ns); return true; }
    if(this.kind === 'bc'){
      const key = 'typhu_room_' + this.code, st = JSON.parse(store.get(key)), ns = fn(st); if(!ns) return false;
      ns.v = st.v + 1; store.set(key, JSON.stringify(ns)); this.bc.postMessage(1); onState(ns); return true;
    }
    const { db, F } = await fb(), ref = F.doc(db, ROOMS, this.code);
    try{
      return await F.runTransaction(db, async tx => {
        const sn = await tx.get(ref); if(!sn.exists()) return false;
        const st = JSON.parse(sn.data().s), ns = fn(st); if(!ns) return false;
        ns.v = st.v + 1; tx.set(ref, { s:JSON.stringify(ns), v:ns.v, t:F.serverTimestamp() }); return true;
      });
    }catch(e){ netErr(e); return false; }
  },
};
function netErr(e){
  console.warn(e);
  const perm = String(e && (e.code || e.message)).includes('permission');
  sheet(`<h2>Không kết nối được phòng</h2>
    <p class="sub">${perm ? 'Máy chủ chưa cho phép tạo phòng chơi online. Chủ game cần mở quyền cho mục <b>typhu_rooms</b> trong Firebase (xem hướng dẫn kèm game).' : 'Mạng đang chập chờn. Kiểm tra kết nối rồi thử lại nha.'}</p>
    <div class="err">${esc(e && (e.code || e.message) || e)}</div>
    <div class="stack" style="margin-top:12px"><button class="btn blue" data-go="home">Về trang chủ</button></div>`);
}
function roomGone(){ toast('Phòng đã đóng'); goHome(); }
let doingAct = false;
async function send(a){
  if(doingAct) return; doingAct = true;
  a.by = a.by || me.id;
  try{ await Net.commit(s => act(s, a)); } finally { doingAct = false; }
}

/* ======================= ÂM THANH (nhạc chill tự tạo + hiệu ứng, có nút tắt hết) ======================= */
const SND = (() => { try{ return Object.assign({ music:true, sfx:true, vol:.7 }, JSON.parse(store.get('typhu_snd') || '{}')); }catch(e){ return { music:true, sfx:true, vol:.7 }; } })();
let AC = null, master, musicBus, sfxBus, noiseBuf, schedIv = null, nextT = 0, stepN = 0;
function audioInit(){
  if(AC) return true; if(!SND.music && !SND.sfx) return false;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = SND.vol; master.connect(AC.destination);
    const warm = AC.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 2800; warm.connect(master);

    let n = 0; gs.forEach(g => n += g.attributes.position.count);
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3); let off = 0;
    gs.forEach(g => { pos.set(g.attributes.position.array, off * 3); nor.set(g.attributes.normal.array, off * 3); off += g.attributes.position.count; g.dispose(); });
    const bg = new T.BufferGeometry(); bg.setAttribute('position', new T.BufferAttribute(pos, 3)); bg.setAttribute('normal', new T.BufferAttribute(nor, 3));

  }

function diceFace(v){
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 128, 128); x.strokeStyle = '#E3DCCB'; x.lineWidth = 6; x.strokeRect(3, 3, 122, 122);
  const P = { 1:[[64, 64]], 2:[[36, 36], [92, 92]], 3:[[34, 34], [64, 64], [94, 94]], 4:[[36, 36], [92, 36], [36, 92], [92, 92]], 5:[[34, 34], [94, 34], [64, 64], [34, 94], [94, 94]], 6:[[36, 30], [92, 30], [36, 64], [92, 64], [36, 98], [92, 98]] }[v];
  x.fillStyle = v === 1 || v === 4 ? '#E8413C' : '#16233F';
  P.forEach(([a, b]) => { x.beginPath(); x.arc(a, b, v === 1 ? 20 : 12, 0, 7); x.fill(); });
  return new T.MeshLambertMaterial({ map:new T.CanvasTexture(c) });
}
const FACE_ORDER = [3, 4, 1, 6, 2, 5]; // +x -x +y -y +z -z
const FACE_ROT = { 1:[0, 0, 0], 6:[Math.PI, 0, 0], 2:[-Math.PI / 2, 0, 0], 5:[Math.PI / 2, 0, 0], 3:[0, 0, Math.PI / 2], 4:[0, 0, -Math.PI / 2] };
const diceMats = FACE_ORDER.map(diceFace);
const dice = [0, 1].map(k => { const yaw = new T.Group(), cube = new T.Mesh(box(.42, .42, .42), diceMats); cube.castShadow = true; yaw.add(cube); yaw.position.set(.6 + k * .55, .3, -.2); scene.add(yaw); return { yaw, cube }; });
function setDiceStatic(d){ dice.forEach((D, k) => { const r = FACE_ROT[d[k]]; D.cube.rotation.set(...r); D.yaw.rotation.y = k * .5 - .2; D.yaw.position.set(.55 + k * .9, .3, .25); }); }
async function rollDice(d){
  sfx.dice();
  const dur = 950, t0 = performance.now();
  const from = dice.map((D, k) => new T.Vector3(-1.4 + k * .5, 2.6, 2.6)), to = dice.map((D, k) => new T.Vector3(.5 + k * .85, .3, .2 + k * .1));
  const spin = dice.map(() => [rnd(8, 14) * (Math.random() < .5 ? -1 : 1), rnd(6, 12), rnd(8, 14)]);
  const fin = d.map(v => FACE_ROT[v]), yaws = dice.map(() => rnd(-.5, .5));
  await new Promise(res => {
    const f = now => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      dice.forEach((D, k) => {
        D.yaw.position.lerpVectors(from[k], to[k], e);
        D.yaw.position.y = .3 + Math.abs(Math.sin(t * Math.PI * 2.6)) * (1 - t) * 1.8 + (1 - e) * 2.3;
        const w = Math.pow(1 - t, 2);
        D.cube.rotation.set(fin[k][0] + spin[k][0] * w, fin[k][1] + spin[k][1] * w, fin[k][2] + spin[k][2] * w);
        D.yaw.rotation.y = yaws[k];
      });
      if(t < 1) requestAnimationFrame(f); else res();
    };
    requestAnimationFrame(f);
  });
  beep(300, .05, 'triangle', .07);
  await sleep(380);
}

async function walkPawn(i, path, s){

  for(const pos of path){
    const from = o.m.position.clone(); dispPos[i] = pos;
    const [x, z] = pawnXZ(i, pos, s), to = new T.Vector3(x, .1, z);
    o.m.rotation.y = Math.atan2(to.x - from.x, to.z - from.z);
    view.follow = to.clone();

    await new Promise(res => { const f = now => { const t = Math.min(1, (now - t0) / dur); o.m.position.lerpVectors(from, to, t); o.m.position.y = .1 + Math.sin(t * Math.PI) * .42; if(t < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
    sfx.hop();
  }
  o.m.rotation.y = 0; o.busy = false; o.tx = o.m.position.x; o.tz = o.m.position.z;
}

let S = null, homeMode = true, busy = false, seenSeq = -1, animQ = Promise.resolve(), lastPhase = '';
const me = { id:idStore.get('typhu_pid') || ('p' + Math.random().toString(36).slice(2, 10)), name:store.get('typhu_name') || '', pawn:store.get('typhu_pawn') || pick(PAWNS).k };
idStore.set('typhu_pid', me.id);
let toastT;
function toast(t){ document.querySelectorAll('.toast').forEach(x => x.remove()); const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); clearTimeout(toastT); toastT = setTimeout(() => e.remove(), 2400); }
function sheet(html, opt = {}){
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sbg' + (opt.clear ? ' clear' : opt.soft ? ' soft' : ''); bg.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  bg.addEventListener('click', e => {
    if(e.target === bg && opt.dismiss !== false){ closeSheet(); opt.onClose && opt.onClose(); }
    const c = e.target.closest('[data-close]'); if(c){ closeSheet(); opt.onClose && opt.onClose(); }
    const g = e.target.closest('[data-go]'); if(g && g.dataset.go === 'home'){ closeSheet(); goHome(); }
  });
  document.body.appendChild(bg); return bg;
}
function closeSheet(){ document.querySelectorAll('.sbg').forEach(x => x.remove()); }
const isMine = p => p && !p.bot && p.dev === DEV;
const myPlayer = () => S && S.players.find(p => p.id === me.id);

/* ---- trang chủ ---- */
function goHome(){
  Net.close(); S = null; homeMode = true; busy = false; seenSeq = -1; lastPhase = ''; animPending = 0; lobbyKey = '';
  $('#bar').classList.add('hidden'); $('#ticker').classList.add('hidden'); $('#ctrl').innerHTML = '';
  while(pawnObjs.length) board.remove(pawnObjs.pop().m);
  for(let i = 0; i < N; i++) builtKey[i] = undefined; syncBuildings({ own:{}, fest:-1 });
  view.follow = null; view.zoom = 1; view.tilt = .92;
  history.replaceState(null, '', location.pathname + (TEST_BC ? '?bc=1' : ''));
  homeSheet();
}
function pawnPicker(sel){ return `<div class="pawns">${PAWNS.map(p => `<button data-pawn="${p.k}" class="${sel === p.k ? 'on' : ''}" aria-label="${p.n}"><img src="${portrait(p.k, COLORS[0])}" alt=""></button>`).join('')}</div>`; }
function homeSheet(prefill){
  const solo = store.get('typhu_solo'), lastRoom = store.get('typhu_room');
  let soloOk = null; try{ soloOk = solo && JSON.parse(solo); if(soloOk && soloOk.phase !== 'play') soloOk = null; }catch(e){}
  sheet(`<div class="logo"><span class="a">CỜ TỶ PHÚ 3D</span><span class="b">Tỷ Phú Việt</span></div>
    <div class="stack">
      <span class="lab">Tên của bạn</span>
      <input class="inp" id="nm" maxlength="14" placeholder="Nhập tên…" value="${esc(me.name)}">
      <span class="lab">Chọn quân cờ</span>
      ${pawnPicker(me.pawn)}
      ${prefill ? `<button class="btn gold" id="hJoinPre">Vào phòng ${esc(prefill)}<small>Bạn được mời chơi cùng</small></button>` : ''}
      <button class="btn blue" id="hCreate">Tạo phòng chơi với bạn bè<small>Gửi link cho bạn vào cùng, tối đa 4 người</small></button>
      <div class="row2"><input class="inp" id="code" maxlength="5" placeholder="Mã phòng" style="text-transform:uppercase;letter-spacing:3px;text-align:center"><button class="btn" id="hJoin" style="flex:0 0 110px">Vào phòng</button></div>
      ${lastRoom && !prefill ? `<button class="btn alt" id="hRe">Vào lại phòng ${esc(lastRoom)}</button>` : ''}
      <div class="row2"><button class="btn alt" id="hBot">Chơi với máy</button><button class="btn alt" id="hLocal">Chơi chung 1 máy</button></div>
      ${soloOk ? '<button class="btn gold" id="hCont">Chơi tiếp ván đang dở</button>' : ''}
    </div>
    <div class="foot"><button id="hRules">Luật chơi</button><button id="hSnd">Âm thanh</button><button class="cafe" id="hCafe">Mời cà phê</button></div>`, { dismiss:false, soft:true });
  const nm = $('#nm');
  const saveMe = () => { me.name = nm.value.trim().slice(0, 14) || me.name; store.set('typhu_name', me.name); store.set('typhu_pawn', me.pawn); };
  const need = () => { saveMe(); if(!me.name){ nm.focus(); toast('Nhập tên trước nha'); return false; } return true; };
  document.querySelectorAll('[data-pawn]').forEach(b => b.onclick = () => { me.pawn = b.dataset.pawn; document.querySelectorAll('[data-pawn]').forEach(x => x.classList.toggle('on', x === b)); sfx.tap(); });
  $('#hCreate').onclick = () => need() && createRoom();
  $('#hJoin').onclick = () => { if(!need()) return; const c = $('#code').value.trim().toUpperCase(); if(c.length < 4) return toast('Nhập mã phòng 5 ký tự'); joinRoom(c); };
  if(prefill) $('#hJoinPre').onclick = () => need() && joinRoom(prefill);
  const re = $('#hRe'); if(re) re.onclick = () => need() && joinRoom(lastRoom);
  $('#hBot').onclick = () => need() && botSetup();
  $('#hLocal').onclick = () => need() && localSetup();
  const ct = $('#hCont'); if(ct) ct.onclick = () => { homeMode = false; startView(); Net.open('solo', '', soloOk); };
  $('#hRules').onclick = () => rulesSheet(() => homeSheet(prefill));
  $('#hSnd').onclick = () => soundSheet(() => homeSheet(prefill));
  $('#hCafe').onclick = () => cafeSheet(() => homeSheet(prefill));
}
const CODE_CH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode = () => Array.from({ length:5 }, () => pick(CODE_CH.split(''))).join('');
const myJoin = () => ({ type:'join', p:{ id:me.id, name:me.name, pawn:me.pawn, dev:DEV } });
async function createRoom(){
  sheet('<h2>Đang tạo phòng…</h2><p class="sub">Chờ xíu nha.</p>', { dismiss:false });
  const code = newCode(), st = newState({ mode:'online', host:me.id });
  const s2 = act(st, Object.assign(myJoin(), { by:me.id })); s2.v = 1;
  try{
    const ok = await Net.open(TEST_BC ? 'bc' : 'fb', code, s2);
    if(!ok) throw new Error('Không tạo được phòng');
    store.set('typhu_room', code); homeMode = false; startView();
    history.replaceState(null, '', `?room=${code}${TEST_BC ? '&bc=1' : ''}`);
  }catch(e){ netErr(e); }
}
async function joinRoom(code){
  sheet(`<h2>Đang vào phòng ${esc(code)}…</h2>`, { dismiss:false });
  try{
    const ok = await Net.open(TEST_BC ? 'bc' : 'fb', code);
    if(!ok){ sheet(`<h2>Không thấy phòng</h2><p class="sub">Phòng <b>${esc(code)}</b> không tồn tại hoặc đã đóng. Kiểm tra lại mã nha.</p><button class="btn blue" data-go="home">Về trang chủ</button>`); store.del('typhu_room'); return; }
    store.set('typhu_room', code); homeMode = false; startView();
    history.replaceState(null, '', `?room=${code}${TEST_BC ? '&bc=1' : ''}`);
    const done = await Net.commit(s => act(s, Object.assign(myJoin(), { by:me.id })));
    if(!done && S && !myPlayer()) sheet(`<h2>Phòng đã đầy hoặc đang chơi</h2><p class="sub">Bạn có thể xem mọi người chơi, hoặc về trang chủ tạo phòng mới.</p><div class="stack"><button class="btn alt" data-close>Xem ván đấu</button><button class="btn blue" data-go="home">Về trang chủ</button></div>`);
  }catch(e){ netErr(e); }
}
function botSetup(){
  let n = 2, r = 20;
  const draw = () => sheet(`<button class="x" data-go="home" aria-label="Đóng">×</button><h2>Chơi với máy</h2><p class="sub">Đấu với máy, ván đang chơi được lưu lại để chơi tiếp sau.</p>
    <div class="stack"><span class="lab">Số máy</span><div class="seg" id="sgN">${[1, 2, 3].map(k => `<button data-n="${k}" class="${n === k ? 'on' : ''}">${k} máy</button>`).join('')}</div>
    <span class="lab">Số vòng tối đa</span><div class="seg" id="sgR">${[[15, '15 vòng'], [20, '20 vòng'], [30, '30 vòng'], [40, '40 vòng']].map(([k, l]) => `<button data-r="${k}" class="${r === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <button class="btn gold" id="bsGo">Bắt đầu</button></div>`);
  const bind = () => { document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { n = +b.dataset.n; draw(); bind(); }); document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { r = +b.dataset.r; draw(); bind(); }); $('#bsGo').onclick = () => {
    let st = newState({ mode:'solo', host:me.id, rounds:r }); st = act(st, Object.assign(myJoin(), { by:me.id }));
    for(let k = 0; k < n; k++) st = act(st, { type:'addbot', by:me.id });
    st = act(st, { type:'start', by:me.id }); st.v = 1;
    homeMode = false; startView(); Net.open('solo', '', st); store.set('typhu_solo', JSON.stringify(st));
  }; };
  draw(); bind();
}
function localSetup(){
  let n = 2, r = 20;
  const names = [me.name, 'Bạn 2', 'Bạn 3', 'Bạn 4'];
  const draw = () => { sheet(`<button class="x" data-go="home" aria-label="Đóng">×</button><h2>Chơi chung 1 máy</h2><p class="sub">Mọi người chuyền tay điện thoại, tới lượt ai người đó bấm.</p>
    <div class="stack"><span class="lab">Số người</span><div class="seg">${[2, 3, 4].map(k => `<button data-n="${k}" class="${n === k ? 'on' : ''}">${k} người</button>`).join('')}</div>
    ${names.slice(0, n).map((x, k) => `<input class="inp" data-nm="${k}" maxlength="14" value="${esc(x)}" style="border-color:${COLORS[k]}">`).join('')}
    <span class="lab">Số vòng tối đa</span><div class="seg">${[[10, '10'], [15, '15'], [20, '20'], [30, '30'], [40, '40']].map(([k, l]) => `<button data-r="${k}" class="${r === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <button class="btn gold" id="lsGo">Bắt đầu</button></div>`);
    document.querySelectorAll('[data-nm]').forEach(i => i.oninput = () => names[+i.dataset.nm] = i.value);
    document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { n = +b.dataset.n; draw(); });
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { r = +b.dataset.r; draw(); });
    $('#lsGo').onclick = () => {
      let st = newState({ mode:'local', host:me.id, rounds:r });
      const pawns = [me.pawn, ...PAWNS.map(p => p.k).filter(k => k !== me.pawn)];
      for(let k = 0; k < n; k++) st = act(st, { type:'join', by:'x', p:{ id:k ? 'loc' + k : me.id, name:(names[k] || `Bạn ${k + 1}`).trim().slice(0, 14) || `Bạn ${k + 1}`, pawn:pawns[k], dev:DEV } });
      st = act(st, { type:'start', by:me.id }); st.v = 1;
      homeMode = false; startView(); Net.open('solo', '', st); store.set('typhu_solo', JSON.stringify(st));
    };
  };
  draw();
}
function startView(){ closeSheet(); $('#bar').classList.remove('hidden'); view.yaw = 0; }

/* ---- nhận trạng thái mới ---- */
function onState(ns){
  if(!ns) return;
  if(S && ns.v < S.v) return;
  const first = !S || S.players.length !== ns.players.length || S.players.some((p, i) => p.pawn !== ns.players[i].pawn);
  const prev = S; if(prev && !busy) shownMoney = prev.players.map(p => p.money); S = ns;
  if(first || !dispPos.length || dispPos.length !== ns.players.length){ dispPos = ns.players.map(p => p.pos); syncPawns(ns); }
  if(ns.anim.seq !== seenSeq && seenSeq !== -1 && ns.phase !== 'lobby'){
    const A = clone(ns.anim), snap = ns; seenSeq = ns.anim.seq; animPending++;
    animQ = animQ.then(() => playAnim(A, snap)).catch(e => console.error(e)).then(() => { if(--animPending === 0){ busy = false; dispPos = S.players.map(p => p.pos); placePawns(S); syncBuildings(S, true); refresh(); } });
    busy = true; renderBar(true); renderCtrl();
    return;
  }
  seenSeq = ns.anim.seq;
  if(!busy){ dispPos = ns.players.map(p => p.pos); placePawns(ns); syncBuildings(ns, !!prev); }
  refresh();
}
async function playAnim(A, s){
  const mon = s.players.map(p => p.money);
  if(A.dice){ await rollDice(A.dice); }
  for(const st of A.steps){
    if(st.k === 'walk') await walkPawn(st.pi, st.path, s);
    else if(st.k === 'jump') await jumpPawn(st.pi, st.to, s);
    else if(st.k === 'card'){ sfx.card(); await showCard(st); }
    else if(st.k === 'pay'){ if(st.m > 0){ if(st.a >= 0) floatMoney(st.a, -st.m); if(st.b >= 0) floatMoney(st.b, st.m); st.b >= 0 && st.a >= 0 ? sfx.coin() : st.a >= 0 ? sfx.bad() : sfx.coin(); } await sleep(350); }
    else if(st.k === 'bk'){ sfx.bad(); toast(`${s.players[st.pi].name} phá sản!`); await sleep(900); }
  }
  view.follow = null;
  dispPos = s.players.map(p => p.pos); placePawns(s); syncBuildings(s, true);
  shownMoney = s.players.map(p => p.money); renderBar(true);
}
function showCard(st){
  return new Promise(res => {
    const e = document.createElement('div'); e.className = 'cardpop'; e.style.background = st.ch ? 'linear-gradient(160deg,#FFE3E1,#fff)' : 'linear-gradient(160deg,#E1F0FF,#fff)';
    e.style.border = `4px solid ${st.ch ? '#E8413C' : '#2F7BE0'}`;
    e.innerHTML = `<b style="color:${st.ch ? '#E8413C' : '#2F7BE0'}">${esc(st.t)}</b><p>${esc(st.x)}</p>`;
    document.body.appendChild(e); setTimeout(() => { e.remove(); res(); }, 2100);
  });
}
function floatMoney(pi, m){
  const el = document.querySelector(`.pc[data-pi="${pi}"]`); if(!el) return;
  const r = el.getBoundingClientRect(), f = document.createElement('div'); f.className = 'fl';
  f.textContent = (m > 0 ? '+' : '−') + K(Math.abs(m)); f.style.color = m > 0 ? '#1D8A48' : '#D0312D';
  f.style.left = (r.left + r.width / 2 - 30) + 'px'; f.style.top = (r.bottom + 2) + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1500);
}
function refresh(){
  if(!S) return;
  renderBar(); renderTicker(); renderCtrl();
  if(S.phase === 'lobby') lobbySheet();
  else if(lastPhase === 'lobby') closeSheet();
  if(S.phase === 'over' && !busy && lastPhase !== 'over'){ sfx.win(); overSheet(); }
  if(S.phase !== 'over' || !busy) lastPhase = S.phase;
  if(S.mode !== 'online' && S.phase === 'over') store.del('typhu_solo');
  botTick();
}
function renderBar(stale){
  if(!S || S.phase === 'lobby'){ $('#plist').innerHTML = ''; return; }
  if(!(stale && busy)) shownMoney = S.players.map(p => p.money);
  $('#plist').classList.toggle('two', S.players.length > 2);
  requestAnimationFrame(() => { const b = $('#bar').getBoundingClientRect(); $('#ticker').style.top = (b.bottom + 6) + 'px'; });
  $('#plist').innerHTML = S.players.map((p, i) => `<div class="pc${i === S.turn && S.phase === 'play' ? ' on' : ''}${p.out ? ' out' : ''}" data-pi="${i}">
    <img src="${portrait(p.pawn, COLORS[i])}" alt=""><div class="g"><span class="nm">${esc(p.name)}</span><span class="mn">${p.out && !(stale && busy) ? 'Phá sản' : K(stale && busy ? (shownMoney[i] ?? p.money) : p.money)}</span></div>
    <i class="clr" style="background:${COLORS[i]}"></i>${p.jail ? '<span class="tg">Trong tù</span>' : p.bot && !p.id.startsWith('bot') ? '<span class="tg">Máy thay</span>' : p.bot ? '<span class="tg">Máy</span>' : ''}</div>`).join('');
}
function renderTicker(){ const t = $('#ticker'); if(!S || S.phase === 'lobby' || !S.log.length){ t.classList.add('hidden'); return; } t.classList.remove('hidden'); t.textContent = (S.maxRound ? `Vòng ${Math.min(S.round, S.maxRound)}/${S.maxRound} · ` : `Vòng ${S.round} · `) + S.log[S.log.length - 1]; }
function renderCtrl(){
  const c = $('#ctrl');
  if(!S || S.phase !== 'play'){ c.innerHTML = ''; return; }
  const p = cur(S);
  if(busy){ c.innerHTML = ''; return; }
  const mine = isMine(p) && !p.bot;
  if(!mine){
    const idle = !p.bot && Date.now() - S.ts > 60000 && S.mode === 'online';
    c.innerHTML = `<div class="wait"><img src="${portrait(p.pawn, COLORS[S.turn])}" alt="">Lượt của ${esc(p.name)}${p.bot ? '' : '…'}${idle ? ' <button class="btn alt" id="cBotify" style="flex:0;padding:6px 10px;font-size:13px;margin-left:6px">Cho máy đánh thay</button>' : ''}</div>`;
    const bt = $('#cBotify'); if(bt) bt.onclick = () => send({ type:'botify', pi:S.turn });
    return;
  }
  const by = p.id, v0 = S.v;
  if(S.pend){
    const i = S.pend.i;
    if(S.pend.k === 'buy'){
      c.innerHTML = `<div class="panel">${tileCard(i)}<div class="row2"><button class="btn" id="cBuy">Mua<small>${K(TILES[i].p)} · còn ${K(p.money - TILES[i].p)}</small></button><button class="btn alt" id="cSkip">Bỏ qua</button></div></div>`;
      $('#cBuy').onclick = () => { sfx.buy(); send({ type:'buy', by, v0 }); };
    } else if(S.pend.k === 'up'){
      const o = S.own[i], cost = upCost(i, o.lv);
      c.innerHTML = `<div class="panel">${tileCard(i, o.lv + 1)}<div class="row2"><button class="btn" id="cUp">Xây ${LV_NAME[o.lv + 1].toLowerCase()}<small>${K(cost)} · thuê lên ${K(baseRent(i) * RENT_MUL[o.lv + 1])}</small></button><button class="btn alt" id="cSkip">Để sau</button></div></div>`;
      $('#cUp').onclick = () => { sfx.buy(); send({ type:'up', by, v0 }); };
    } else if(S.pend.k === 'fest'){
      const mine2 = Object.keys(S.own).filter(k => S.own[k].o === S.turn).map(Number);
      c.innerHTML = `<div class="panel"><div class="tcard"><span class="band" style="background:#E05BA6"></span><div class="g"><b>Tổ chức Lễ hội</b><small>Chọn một mảnh đất của bạn, tiền thuê ở đó nhân đôi tới khi có lễ hội mới.</small></div></div><div class="chips">${mine2.map(k => `<button data-fest="${k}">${esc(TILES[k].n)} · ${K(rentOf(S, k))}</button>`).join('')}</div><div class="row2" style="margin-top:8px"><button class="btn alt" id="cSkip">Thôi</button></div></div>`;
      document.querySelectorAll('[data-fest]').forEach(b => b.onclick = () => { sfx.buy(); send({ type:'fest', i:+b.dataset.fest, by, v0 }); });
    }
    const sk = $('#cSkip'); if(sk) sk.onclick = () => { sfx.tap(); send({ type:'skip', by, v0 }); };
    return;
  }
  if(p.jail > 0){
    c.innerHTML = `<div class="panel"><div class="tcard"><span class="band" style="background:#F28C28"></span><div class="g"><b>${esc(p.name)} đang ở tù</b><small>Đổ được đôi để ra tù, hoặc nộp phạt ${K(JAIL_FINE)}. Lần thử ${p.jail}/3.</small></div></div>
      <div class="row2"><button class="btn gold" id="cRoll">Đổ tìm đôi</button>${p.free ? '<button class="btn blue" id="cCard">Dùng thẻ ra tù</button>' : `<button class="btn alt" id="cBail" ${p.money < JAIL_FINE ? 'disabled' : ''}>Nộp ${K(JAIL_FINE)}</button>`}</div></div>`;
    $('#cRoll').onclick = () => send({ type:'roll', by, v0 });
    const bl = $('#cBail'); if(bl) bl.onclick = () => { sfx.coin(); send({ type:'bail', by, v0 }); };
    const cd = $('#cCard'); if(cd) cd.onclick = () => send({ type:'bail', card:true, by, v0 });
    return;
  }
  const who = S.mode === 'local' ? `<div class="wait" style="margin-bottom:8px;justify-content:center"><img src="${portrait(p.pawn, COLORS[S.turn])}" alt="">Lượt của ${esc(p.name)}</div>` : '';
  c.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center">${who}<button class="rollbtn" id="cRoll"><svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="8" fill="#fff" stroke="#5A3300" stroke-width="3"/><circle cx="13" cy="13" r="3.4" fill="#E8413C"/><circle cx="20" cy="20" r="3.4" fill="#5A3300"/><circle cx="27" cy="27" r="3.4" fill="#5A3300"/></svg>${S.again ? 'ĐỔ TIẾP' : 'ĐỔ XÚC XẮC'}</button></div>`;
  $('#cRoll').onclick = () => { $('#cRoll').disabled = true; send({ type:'roll', by, v0 }); };
}
function tileCard(i, hl){
  const t = TILES[i], o = S && S.own[i];
  if(t.t === 'air'){
    return `<div class="tcard"><span class="band" style="background:#2457B8"></span><div class="g"><b>${esc(t.n)}</b><small>Giá ${K(t.p)}${o ? ` · chủ: ${esc(S.players[o.o].name)}` : ''}</small><div class="rents">${[1, 2, 3, 4].map(n => `<span>${n} sân bay<b>${K(25 * Math.pow(2, n - 1))}</b></span>`).join('')}<span>Lễ hội<b>x2</b></span></div></div></div>`;
  }
  const g = GROUPS[t.g];
  return `<div class="tcard"><span class="band" style="background:${g.c}"></span><div class="g"><b>${esc(t.n)}</b><small>Vùng ${g.n} · giá ${K(t.p)} · xây nhà ${K(g.h)}${o ? ` · chủ: ${esc(S.players[o.o].name)}` : ''}</small>
    <div class="rents">${RENT_MUL.map((m, l) => `<span class="${(hl ?? (o ? o.lv : -1)) === l ? 'on' : ''}">${['Đất', '1 nhà', '2 nhà', '3 nhà', 'Toà nhà'][l]}<b>${K(baseRent(i) * m)}</b></span>`).join('')}</div></div></div>`;
}
function tileInfo(i){

function copy(t, msg){ try{ navigator.clipboard.writeText(t).then(() => toast(msg), () => toast(t)); }catch(e){ toast(t); } }

/* ---- máy chơi: mọi máy trong phòng đều có thể chạy, người đầu tiên chạy trước ---- */
let botTimer = null, botV = -1;
function botTick(){
  if(!S || S.phase !== 'play' || busy) return;
  const p = cur(S); if(!p.bot) return;
  if(botV === S.v && botTimer) return;
  clearTimeout(botTimer); botV = S.v;
  let delay = 900;
  if(S.mode === 'online'){
    const humans = S.players.filter(x => !x.bot && !x.out);
    const rank = humans.findIndex(x => x.dev === DEV);
    if(rank < 0) return; delay = 900 + rank * 3500;
  }
  const v = S.v;
  botTimer = setTimeout(() => {
    botTimer = null; if(!S || S.v !== v || busy) return;
    Net.commit(s => { if(s.v !== v || s.phase !== 'play') return null; const q = cur(s); if(!q.bot) return null; return act(s, Object.assign(botAction(s), { by:q.id })); });
  }, delay);
}
setInterval(() => { if(S && S.phase === 'play' && !busy && S.mode === 'online') renderCtrl(); }, 5000);
