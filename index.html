function hubClick(e){
  const b = e.target.closest('button, a');
  if(!b) return;
  const d = b.dataset;
  const re = () => renderHub(true);
  if(b.id === 'setBtn') return settingsModal();
  if(b.id === 'hubStars'){ hubTab = 'dg'; return re(); }
  if(b.id === 'renameBtn') return renameModal(false);
  if(b.id === 'guideBtn') return guideModal(0);
  if(b.id === 'donBtn' || b.id === 'donCard') return donateModal();
  if(b.id === 'rankBtn2') return rankModal(() => hideModal());
  if(b.id === 'accBtn') return accountModal();
  if(b.id === 'openBtn') return startDay();
  if(b.id === 'buyBtn') return buyCart();
  if(b.id === 'clearCart' || b.id === 'clearCart2'){ e.preventDefault(); cart = {}; return re(); }
  if(b.id === 'autoBtn'){ autoFill(); return re(); }
  if(b.id === 'hagBtn') return haggleModal();
  if(d.ht){ hubTab = d.ht; rvDraft = null; return renderHub(false), ($('#hscroll').scrollTop = $('.htabs').offsetTop - 8); }
  if(d.inc){ cart[d.inc] = (cart[d.inc] || 0) + packOf(d.inc); return re(); }
  if(d.dec){ cart[d.dec] = Math.max(0, (cart[d.dec] || 0) - packOf(d.dec)); if(!cart[d.dec]) delete cart[d.dec]; return re(); }
  if(d.pi || d.pd){
    const r = getR(d.pi || d.pd), p = priceOf(r) + (d.pi ? 1000 : -1000);
    S.prices[r.id] = clamp(p, Math.round(r.price * .5 / 1000) * 1000, Math.round(r.price * 2 / 1000) * 1000);
    if(S.prices[r.id] === r.price) delete S.prices[r.id];
    save(); return re();
  }
  if(d.u){
    const k = d.u, u = CFG.upgrades[k], nx = u.levels[(S.upg[k] || 0) + 1];
    if(!nx || bigMoney() < nx.cost || (nx.need || 0) > (S.earned || 0)) return;
    spendBig(nx.cost); S.upg[k] = (S.upg[k] || 0) + 1; led(`Nâng cấp: ${nx.n}`, -nx.cost, 'invest');
    SFX.pay(); save(); renderHud(); toast(`Đã nâng cấp: ${u.n} → ${nx.n} ✅`); re();
    burst($('#hpanel'), ['🎉','✨','🎊','⭐'], 16, 90); return;
  }
  if(d.hire){
    const role = d.role;
    if(S.staff.filter(s => s.role === role).length >= (CFG.roles[role].max || 1)) return;
    const list = candidates()[role], c = list.find(x => x.id === d.hire);
    if(!c) return;
    S.staff.push(c); S.cands.byRole[role] = list.filter(x => x !== c);
    SFX.pay(); save(); toast(`Đã thuê ${c.name} ${TRAITS[c.trait].e} ${TRAITS[c.trait].n}`); return re();
  }
  if(d.st){ staffSub = d.st; return re(); }
  if(b.id === 'hireAll'){
    const hired = [];
    for(const [role, rd] of Object.entries(CFG.roles)){
      while(S.staff.filter(s => s.role === role).length < (rd.max || 1)){
        const list = candidates()[role];
        const best = [...list].sort((a,b) => b.skill - a.skill || a.wage - b.wage)[0];
        S.staff.push(best); S.cands.byRole[role] = list.filter(x => x !== best); hired.push(best);
      }
    }
    SFX.pay(); save();
    toast(`Đã thuê ${hired.length} người · lương thêm ${fmtK(hired.reduce((a,s) => a + s.wage, 0))}/ngày`);
    return re();
  }
  if(d.fire){
    const s = S.staff.find(x => x.id === d.fire);
    if(!s || !confirm(`Cho ${s.name} nghỉ việc?`)) return;
    S.staff = S.staff.filter(x => x !== s); save(); return re();
  }
  if(d.awn){
    const a = CFG.awnings.find(x => x.id === d.awn);
    S.decor.awnOwned = S.decor.awnOwned || ['reu'];
    if((a.lv || 1) > S.level) return toast(`🔒 Mở ở cấp ${a.lv}`);
    if(!S.decor.awnOwned.includes(a.id)){
      if(!spendBig(a.cost)) return toast('Không đủ tiền');
      S.decor.awnOwned.push(a.id); led(`Trang trí: ${a.n}`, -a.cost, 'invest');
    }
    S.decor.awn = a.id; applyAwning(); SFX.pay(); save(); renderHud(); return re();
  }
  if(d.dbuy){
    const x = CFG.decor.find(y => y.id === d.dbuy);
    if(!x || S.decor.owned.includes(x.id) || bigMoney() < x.cost || x.lv > S.level) return;
    spendBig(x.cost); S.decor.owned.push(x.id); led(`Trang trí: ${x.n}`, -x.cost, 'invest');
    SFX.pay(); save(); renderHud(); toast(`Đã trang trí ${x.e} ${x.n} · thêm khách ghé quán!`); re();
    burst($('.decprev'), ['🌸','✨','❤️'], 14, 70); return;
  }
  if(b.id === 'giftBtn'){
    if(S.giftDay === S.day || S.money < CFG.nbGift) return;
    S.money -= CFG.nbGift; S.nb = clamp(S.nb + 12, 0, 100); S.giftDay = S.day; led('Biếu hàng xóm', -CFG.nbGift);
    SFX.pay(); save(); renderHud(); toast('Hàng xóm cảm ơn rối rít 🥰'); return re();
  }
}

const nbFill = (t, nb) => t.replace(/\{me\}/g, nb.me).replace(/\{call\}/g, nb.call).replace(/\{Call\}/g, nb.call[0].toUpperCase() + nb.call.slice(1));
const relBar = () => { const h = clamp(Math.round(S.nb / 20), 0, 5); return '❤️'.repeat(h) + '🤍'.repeat(5 - h) + ` ${Math.round(S.nb)}/100`; };
function nbRisk(){
  const live = R.cust.filter(c => c && !c.coin).length + R.queue.length + R.online.filter(o => !o.leaving).length;
  const crowd = live / (seats() + 2);
  const fry = (R.stats.batches || 0) / 8;
  const hood = [1, .5, .15][S.upg.hood || 0];
  return {
    xe:   crowd * (S.upg.parking ? .4 : 1),
    mui:  fry * hood * (R.ev.id === 'smell' ? 1.6 : 1),
    khoi: fry * .6 * hood,
    on:   (crowd * .5 + (R.ev.id === 'fest' ? .6 : 0)) * (S.upg.trash ? .5 : 1),
    rac:  (R.stats.served / 12) * (S.upg.trash ? .3 : 1),
  };
}
function nbCheck(){
  if(S.day < 3 || R.nbDone >= 1 || S.lastNbDay === S.day - 1) return;   // tối đa 1 vụ/ngày, không 2 ngày liền
  const w = nbRisk(), tot = Object.values(w).reduce((a,b) => a + b, 0);
  const p = clamp(tot * .035 * (1.4 - S.nb / 100), 0, .22);
  if(Math.random() >= p) return;
  let x = Math.random() * tot, type = 'xe';
  for(const [k,v] of Object.entries(w)){ x -= v; if(x <= 0){ type = k; break; } }
  R.nbDone++; S.lastNbDay = S.day;
  neighborEvent(type);
}
function neighborEvent(type){
  const t = NB[type], nb = pick(NEIGHBORS);
  R.paused = true;
  SFX.bad();
  showModal(`<h2>${t.e} Biến từ hàng xóm!</h2>
    <div class="nbbox"><span class="nbf">${nb.e}</span><div><b>${nb.n}</b><p>"${esc(nbFill(pick(t.say), nb))}"</p></div></div>
    <div class="stat"><span>🏘️ Quan hệ hàng xóm</span><span>${relBar()}</span></div>
    <p class="note">Xử lý khéo thì êm chuyện. Không khéo hàng xóm lên phường phản ánh là bị phạt đó!</p>
    <button class="big" data-nb="gift" ${S.money < CFG.nbGift ? 'disabled' : ''}>🎁 Xin lỗi, biếu 2 phần đậu (${fmt(CFG.nbGift)})</button>
    <button class="big alt" data-nb="promise">🙏 Xin lỗi, hứa sẽ khắc phục</button>
    <button class="big alt" data-nb="argue">😤 Cãi lại: "Buôn bán mà, thông cảm chút đi!"</button>`);
  $('#card').querySelectorAll('[data-nb]').forEach(b => b.onclick = () => nbChoose(type, nb, b.dataset.nb));
}
function neighborReview(type, nb){
  pushReview({ id:'r' + Date.now().toString(36) + Math.floor(Math.random()*1e5), day:curDay(), stars:1, text:NB[type].rv,
    dish:null, sub:null, name:nb.n, meta:'Hàng xóm sát vách', col:'#5F6368' }, true);
}
function nbChoose(type, nb, ch){
  const rel = S.nb;
  let ok, msg, mult = 1;
  if(ch === 'gift'){
    if(S.money < CFG.nbGift) return;
    S.money -= CFG.nbGift; R.stats.gifts = (R.stats.gifts || 0) + CFG.nbGift; led('Biếu hàng xóm', -CFG.nbGift);
    ok = Math.random() < .72 + rel / 300;
    S.nb = clamp(rel + 12, 0, 100);
    msg = ok ? `${nb.n} cầm phần đậu, cười xòa: "Thôi được, lần sau nhớ để ý nha ${nb.call}!"`
             : `${nb.n} nhận quà nhưng vẫn lắc đầu: "Quà là quà, chuyện là chuyện. ${nb.me[0].toUpperCase() + nb.me.slice(1)} lên phường phản ánh!"`;
  } else if(ch === 'promise'){
    ok = Math.random() < .45 + rel / 200;
    S.nb = clamp(rel + (ok ? 3 : -8), 0, 100);
    msg = ok ? `${nb.n}: "Ừ, ${nb.me} tin ${nb.call} lần này đó nha!"` : `${nb.n}: "Hứa hoài rồi! Lần này ${nb.me} lên phường luôn!"`;
  } else {
    ok = Math.random() < .15;
    S.nb = clamp(rel - 20, 0, 100);
    mult = 1.3;
    msg = ok ? `${nb.n} nghẹn họng, bỏ về… Lần này may mắn thoát.` : `"Được! Để coi phường nói sao!" ${nb.n} đùng đùng bỏ đi.`;
    if(Math.random() < .6) neighborReview(type, nb);
  }
  renderHud(); save();
  if(ok){
    showModal(`<h2>😮‍💨 Êm chuyện</h2><div class="nbbox"><span class="nbf">${nb.e}</span><div><p>${esc(msg)}</p></div></div>
      <div class="stat"><span>🏘️ Quan hệ hàng xóm</span><span>${relBar()}</span></div>
      <button class="big" id="nbGo">Bán tiếp 🏮</button>`);
    $('#nbGo').onclick = resume;
  } else officerModal(type, nb, msg, mult);
}
function officerModal(type, nb, msg, mult){
  const t = NB[type], times = S.fineCount || 0;
  if(!S.warned){                                         // lần đầu: chỉ nhắc nhở
    S.warned = true; save();
    showModal(`<h2>👮 Cán bộ phường nhắc nhở</h2>
      <div class="nbbox"><span class="nbf">${nb.e}</span><div><p>${esc(msg)}</p></div></div>
      <div class="nbbox off"><span class="nbf">👮</span><div><p>"Phường nhận được phản ánh về việc ${t.reason}. Lần này nhắc nhở, lần sau tái phạm sẽ lập biên bản."</p></div></div>
      <div class="msay"><img src="${IMG.m1}" alt=""><p>Hú hồn, lần đầu chỉ bị nhắc! Lần sau là bị phạt thật đó chủ quán 😅</p></div>
      <button class="big" id="nbGo">Bán tiếp 🏮</button>`);
    $('#nbGo').onclick = resume;
    return;
  }
  const cap = Math.max(50000, Math.round((S.money + Math.max(0, S.fund || 0)) * .12 / 10000) * 10000);   // không bao giờ phạt quá ~12% tiền đang có
  const fine = Math.min(cap, Math.round(t.fine * mult * Math.min(1.5, 1 + times * .1) / 10000) * 10000);
  showModal(`<h2>👮 Cán bộ phường tới làm việc</h2>
    <div class="nbbox"><span class="nbf">${nb.e}</span><div><p>${esc(msg)}</p></div></div>
    <div class="nbbox off"><span class="nbf">👮</span><div><p>"Phường nhận được phản ánh của người dân về việc ${t.reason}. Đề nghị chủ quán chấp hành."</p></div></div>
    <div class="stat"><span>Mức phạt</span><span>${fmt(fine)}</span></div>
    ${times ? `<p class="note">Đây là lần vi phạm thứ ${times + 1}, mức phạt tăng dần.</p>` : ''}
    <button class="big" data-of="pay">💸 Nộp phạt ${fmt(fine)}</button>
    <button class="big alt" data-of="plead">🗣️ Trình bày, xin giảm nhẹ</button>
    <button class="big alt" data-of="close">🚪 Đóng cửa sớm để khắc phục (phạt ${fmt(Math.round(fine / 20000) * 10000)})</button>`);
  $('#card').querySelectorAll('[data-of]').forEach(b => b.onclick = () => {
    const ch = b.dataset.of;
    let amt = fine, note;
    if(ch === 'plead'){
      if(Math.random() < .6 + S.nb / 400){ amt = Math.round(fine / 20000) * 10000; note = 'Cán bộ ghi nhận thái độ hợp tác, giảm một nửa mức phạt.'; }
      else note = 'Cán bộ lắng nghe nhưng vẫn giữ nguyên mức phạt.';
    } else if(ch === 'close'){
      amt = Math.round(fine / 20000) * 10000;
      R.t = Math.max(R.t, CFG.dayLength); R.queue = [];
      note = 'Quán đóng cửa sớm hôm nay. Khách đang ngồi vẫn được phục vụ cho xong.';
    } else note = 'Chủ quán nộp phạt đầy đủ.';
    S.money -= amt; R.stats.fines = (R.stats.fines || 0) + amt; S.fineCount = times + 1; led('Bị phường phạt', -amt);
    save(); renderHud();
    const tip = type === 'xe' ? 'thuê bảo vệ giữ xe' : (type === 'mui' || type === 'khoi') ? 'lắp máy hút mùi' : 'đặt thùng rác, dọn vệ sinh';
    showModal(`<h2>🧾 Biên bản</h2>
      <div class="msay"><img src="${IMG.m2}" alt=""><p>${esc(note)} Bị phạt ${fmt(amt)}. Chủ quán nên ${tip} ở mục Nâng cấp để đỡ bị phản ánh nha!</p></div>
      <button class="big" id="nbGo">${ch === 'close' ? 'Dọn quán' : 'Bán tiếp 🏮'}</button>`);
    $('#nbGo').onclick = resume;
  });
}

function genCandidate(role){
  const female = Math.random() < .5;
  const trait = pick(TRAIT_KEYS);
  const skill = Math.random() < .22 ? 3 : Math.random() < .55 ? 2 : 1;
  const wage = Math.round(CFG.roles[role].wage * [0, .8, 1, 1.3][skill] * (TRAITS[trait].wage || 1) / 5000) * 5000;
  const face = role === 'bep' ? (female ? '👩‍🍳' : '👨‍🍳') : pick(female ? ['👩','👧','👱‍♀️','👩‍🦱'] : ['👨','👦','👱','🧑‍🦱']);
  return { id:'s' + Date.now().toString(36) + Math.floor(Math.random()*1e5), role, name:pick(female ? TEN_F : TEN_M), face, trait, skill, wage };
}
function candidates(){
  if(!S.cands || S.cands.day !== S.day) S.cands = { day:S.day, byRole:{} };
  for(const r of Object.keys(CFG.roles)){
    if(!S.cands.byRole[r] || !S.cands.byRole[r].length) S.cands.byRole[r] = [genCandidate(r), genCandidate(r)];
  }
  return S.cands.byRole;
}

function fresh(pool){
  const rec = S.rvRecent || (S.rvRecent = []);
  let c = pool.filter(t => !rec.includes(t));
  if(!c.length) c = pool;
  const t = pick(c);
  rec.push(t); if(rec.length > 70) rec.shift();
  return t;
}

const rcTotal = () => [1,2,3,4,5].reduce((a,k) => a + (S.rc[k] || 0), 0);
const rcAvg = () => { const last = S.reviews.slice(0, 30); return last.length ? last.reduce((a,r) => a + r.stars, 0) / last.length : 0; };
const starStr = v => { const n = clamp(Math.round(v), 0, 5); return '★'.repeat(n) + '☆'.repeat(5 - n); };
const hudStars = () => { const n = rcTotal(); return n ? `★ ${rcAvg().toFixed(1).replace('.', ',')} (${n})` : '★ –'; };
function recalcRep(){                          // tính trên 30 đánh giá gần nhất
  const last = S.reviews.slice(0, 30), n = last.length, sum = last.reduce((a,r) => a + r.stars, 0);
  S.rep = (sum + 3.5*4) / (n + 4);
}

}

function detectTone(text, fallback){
  const t = ' ' + text.toLowerCase().replace(/[.,!?;:()"'\n]+/g, ' ').replace(/\s+/g, ' ') + ' ';
  const raw = text.toLowerCase();
  const has = w => /^[\p{L}\s]+$/u.test(w) ? t.includes(' ' + w + ' ') : raw.includes(w);
  const score = k => TONE_WORDS[k].reduce((a,w) => a + (has(w) ? 1 : 0), 0);
  if(score('rude') > 0 || (/[!]{3,}/.test(text) && /[A-ZĐ]{4,}/.test(text))) return 'rude';
  const order = ['sarc','funny','sorry','thanks'].map(k => [k, score(k)]).sort((a,b) => b[1] - a[1]);
  return order[0][1] > 0 ? order[0][0] : fallback;
}

  S.rc[r.stars]--; S.rc[ns] = (S.rc[ns] || 0) + 1;
  r.stars = ns; r.edited = true; recalcRep();
  return true;
}

    ['📰 Báo mạng đưa tin: chủ quán đậu hủ thúi đáp trả khách gây tranh cãi ({views} lượt xem)', '🎥 KOL ẩm thực tuyên bố tới tận quán {shop} kiểm chứng ({views} lượt xem)'],

function drama(){ S.drama = S.drama || { heat:0, views:0, q:50, k:50, title:'' }; return S.drama; }
const dramaStage = () => { const h = drama().heat; return h >= 9 ? 3 : h >= 5 ? 2 : h >= 2 ? 1 : h > 0 ? 0 : -1; };
function addHeat(n, sideQ){
  const d = drama();
  d.heat = Math.min(15, d.heat + n);
  d.views += Math.round(rnd(800, 2500) * n * (1 + d.heat / 3));
  const sw = rnd(2, 7) * n;
  d.q = clamp(d.q + (sideQ ? sw : -sw), 5, 95); d.k = 100 - d.q;
  const st = dramaStage();
  if(st >= 0) d.title = pick(DR.head[Math.min(2, Math.max(0, st - 1))]).replace('{shop}', S.shopName || 'Đậu Hủ Thúi').replace('{views}', fmtViews(d.views));
}
const fmtViews = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',') + 'tr' : v >= 1000 ? Math.round(v / 1000) + 'k' : String(v);
function dramaBanner(){
  const d = drama(), st = dramaStage();
  if(st < 0) return '';
  return `<div class="dban s${st}"><div class="dbh"><b>🔥 DRAMA · ${DR.stageN[st]}</b><span>👁 ${fmtViews(d.views)}</span></div>
    ${d.title ? `<div class="dbt">${esc(d.title)}</div>` : ''}
    <div class="dbar"><i style="width:${d.q}%"></i></div><div class="dbl"><span>🏮 Team quán ${Math.round(d.q)}%</span><span>Team khách ${Math.round(d.k)}% 😤</span></div>
    <small>Drama càng to, khách tò mò kéo tới càng đông, nhưng cũng nhiều người vào chấm 1★. Xin lỗi công khai để hạ nhiệt.</small></div>`;
}
function dramaDayStart(){
  const st = dramaStage();
  if(st < 0) return '';
  R.dramaSt = st;
  R.spawnMul *= [0.9, 0.8, 0.68, 0.55][st];         // khách tò mò kéo tới
  R.dramaRv = Math.round([1, 2, 4, 6][st] * rnd(.7, 1.3));
  if(st >= 3) R.forceVip = true;                     // KOL tới kiểm chứng
  return drama().title ? drama().title + '. ' : '';
}
function dramaTick(dt){
  if(!R.dramaRv) return;
  R.dramaT = (R.dramaT || rnd(8, 20)) - dt;
  if(R.dramaT > 0) return;
  R.dramaT = rnd(10, 25); R.dramaRv--;
  const good = Math.random() * 100 < drama().q * .8;
  netReview(good); renderHud();
  toast(good ? '📱 Có người vào bênh quán: 5★' : '📱 Dân mạng vào chấm 1★ vì drama');
}
function dramaDayEnd(){
  const d = drama();
  if(d.heat <= 0) return;
  d.heat = Math.max(0, d.heat * .5 - .3);
  if(d.heat < .5){ d.heat = 0; d.title = ''; d.views = 0; d.q = 50; d.k = 50; }
}
function netReview(good){
  const a = randAuthor();
  pushReview({ id:'r' + Date.now().toString(36) + Math.floor(Math.random()*1e5), day:curDay(), stars: good ? 5 : 1,
    text: fresh(good ? RV.netGood : RV.netBad), dish:null, sub:null, ...a, meta:'Đến từ bài drama trên mạng' }, false);
}
const curDay = () => R && R.running ? S.day : Math.max(1, S.day - 1);
function sendReply(r, text, tone){
  r.thread = r.thread || [];
  const lvl = r.thread.filter(m => m.w === 'o').length;
  r.thread.push({ w:'o', t:text, tone });
  const say = (pool, who) => r.thread.push(who ? { w:'x', n:who, t:fresh(pool), nw:1 } : { w:'c', t:fresh(pool), nw:1 });
  const neg = r.stars <= 3, old = r.stars;
  let note = '';
  const sayX = (pool, side) => { const a = randAuthor(); r.thread.push({ w:'x', n:a.name, t:fresh(pool), side, lk:Math.floor(rnd(0, 40 + drama().heat * 30)), nw:1 }); };
  const crowd = (n, bias) => { for(let i = 0; i < n; i++){ const x = Math.random(); if(x < .25) sayX(DR.popcorn, 'p'); else if(x < .25 + .75 * bias) sayX(DR.teamQ, 'q'); else sayX(DR.teamK, 'k'); } };
  if(tone === 'rude'){
    const prevSt = dramaStage();
    r.heat = (r.heat || 0) + 1;
    if(r.stars >= 4 && lvl === 0) say(REACT.rudePos);
    else {
      say(DR.fire[Math.min(lvl, 3)]);
      if(Math.random() < .55){ const q = text.length > 60 ? text.slice(0, 57) + '…' : text; r.thread.push({ w:'c', t:fresh(DR.quote).replace('{q}', q), nw:1 }); }
    }
    setStars(r, 1);
    addHeat(1 + Math.min(lvl, 3) * .6, Math.random() < .35);
    crowd(2 + Math.min(lvl, 3) + (Math.random() < .5 ? 1 : 0), drama().q / 100);
    S.buzz = (S.buzz || 0) + 1;
    r.drama = true;
    if(Math.random() < .5) netReview(false);
    if(Math.random() < .25) netReview(true);
    const st = dramaStage();
    note = st > prevSt ? `🔥 Drama ${DR.stageN[st].toLowerCase()}! ${drama().title}` : '🔥 Drama căng hơn! Khách tò mò sẽ kéo tới, nhưng nhiều người vào chấm 1★.';
  } else if(tone === 'sarc'){
    say(REACT.sarc);
    if(Math.random() < .5) setStars(r, r.stars - 1);
    if(r.drama || Math.random() < .45){ r.drama = true; addHeat(.6, Math.random() < .5); crowd(1 + (Math.random() < .5 ? 1 : 0), drama().q / 100); }
    S.buzz = (S.buzz || 0) + .4;
  } else if(r.drama && (tone === 'sorry' || tone === 'thanks')){
    if(Math.random() < .55 + (tone === 'sorry' ? .15 : 0) - (r.heat || 0) * .08){
      say(DR.calm); setStars(r, Math.max(r.stars, 3));
      drama().heat = Math.max(0, drama().heat - 2.5); drama().q = clamp(drama().q + 12, 5, 95); drama().k = 100 - drama().q;
      sayX(DR.teamQ, 'q');
      note = '🕊️ Drama hạ nhiệt! Dân mạng khen chủ quán biết cư xử.';
    } else {
      say(DR.calmNo); drama().heat = Math.max(0, drama().heat - .8);
      if(Math.random() < .6) sayX(DR.popcorn, 'p');
      note = '😬 Khách chưa chịu bỏ qua, nhưng drama có dịu bớt chút.';
    }
  } else if(tone === 'funny'){
    if(Math.random() < .75){ say(REACT.funnyOk); if(neg && Math.random() < .35) setStars(r, r.stars + 1); }
    else say(REACT.funnyBad);
  } else {
    if(neg){
      if(Math.random() < .55){ say(REACT.sorryOk); if(Math.random() < .55) setStars(r, r.stars + 1); }
      else if(Math.random() < .5) say(REACT.sorrySalty);
    } else if(Math.random() < .5) say(REACT.thanks);
  }
  if(r.stars !== old) toast(`${r.name} đã sửa đánh giá: ${old}★ → ${r.stars}★ ${r.stars > old ? '🙏' : '😬'}`);
  else if(note) toast(note);
  save(); renderHud();
}

function bindReviews(rerender, root){

    const r = S.reviews.find(x => x.id === b.dataset.ro); if(!r) return;

  });

  });
  card.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { rvDraft = null; rerender(); });
  card.querySelectorAll('[data-send]').forEach(b => b.onclick = () => {
    const r = S.reviews.find(x => x.id === b.dataset.send); if(!r || !rvDraft) return;

  if(staffSub !== 'all' && !CFG.roles[staffSub]) staffSub = 'all';

  const tabs = [['all', '👥 Tổng quan', `${S.staff.length}`], ...Object.entries(CFG.roles).map(([r,rd]) => [r, `${rd.e} ${rd.n}`, `${cnt(r)}/${rd.max || 1}`])];
  let h = `<div class="stabs">${tabs.map(([k,l,c]) => `<button data-st="${k}" class="${staffSub === k ? 'on' : ''}">${l}<small>${c}</small></button>`).join('')}</div>`;
  const wages = S.staff.reduce((a,s) => a + s.wage, 0);
  if(staffSub === 'all'){
    const vac = Object.entries(CFG.roles).reduce((a,[r,rd]) => a + Math.max(0, (rd.max || 1) - cnt(r)), 0);
    h += '<p class="note">Lương trả cuối mỗi ngày. Mỗi người một tính cách, ảnh hưởng tới cách làm việc và cả đánh giá của khách. Chọn từng tab công việc để xem ứng viên.</p>';
    if(vac) h += `<button class="big" id="hireAll">⚡ Thuê đủ người (còn ${vac} chỗ trống)</button><p class="note">Thuê đủ thì bạn chỉ việc ráp món: phụ bếp lo chiên và chuẩn bị nguyên liệu, phục vụ bưng món và rót trà cho khách, thu ngân tự thu tiền.</p>`;
    h += `<div class="sgrid">${Object.entries(CFG.roles).map(([r,rd]) => `<button class="sgc" data-st="${r}"><span>${rd.e}</span><b>${rd.n}</b><small>${cnt(r)}/${rd.max || 1} người</small></button>`).join('')}</div>`;
    h += S.staff.length ? `<h3>Đang làm ở quán</h3>${S.staff.map(s => staffCard(s, true)).join('')}` : '<p class="note" style="text-align:center">Chưa thuê ai. Chọn một tab công việc ở trên để xem ứng viên.</p>';
  } else {
    const rd = CFG.roles[staffSub], cur = S.staff.filter(s => s.role === staffSub), max = rd.max || 1;
    h += `<div class="srole"><span>${rd.e}</span><div><b>${rd.n}</b> <small>(${cur.length}/${max} người · lương gốc ${fmtK(rd.wage)}/ngày)</small><p>${rd.d}</p></div></div>`;
    if(cur.length) h += `<h3>Đang làm</h3>${cur.map(s => staffCard(s, true)).join('')}`;
    h += cur.length < max ? `<h3>Ứng viên</h3>${cands[staffSub].map(c => staffCard(c, false)).join('')}` : '<p class="note" style="text-align:center">Vị trí này đã đủ người.</p>';
  }
  h += `<div class="stat"><span>Tổng lương mỗi ngày</span><span>${fmt(wages)}</span></div>`;
  return h;
}

async function initFirebase(){
  if(!FIREBASE_CONFIG) return;
  try{
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [app, auth, fs] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
    ]);
    const a = app.initializeApp(FIREBASE_CONFIG);
    FB.auth = auth.getAuth(a);
    FB.db = fs.getFirestore(a);
    FB.m = { ...auth, ...fs };
    FB.ready = true;
    auth.onAuthStateChanged(FB.auth, async u => {
      FB.user = u;
      if(!u){ hideModal(); showGate(); return; }
      gateMsg('Đang tải tiến trình…');
      const ok = await Promise.race([pullCloud(u).then(() => true), new Promise(r => setTimeout(() => r(false), 3500))]);
      if(!ok) toast('☁️ Mạng chậm, tiến trình sẽ đồng bộ sau');
      submitScore();
      hideGate(); fillUserBox();
      if(!R || !R.running) renderHub(true);
      if(!S.named) renameModal(true);
    });
  }catch(e){
    console.warn('Firebase init lỗi', e);
    FB.failed = true;
    showGate();
  }
  fillUserBox();
}

let cloudT = null;
function queueCloud(){
  if(!FB.ready || !FB.user) return;
  clearTimeout(cloudT);
  cloudT = setTimeout(pushCloud, 800);
}
async function pushCloud(){
  const u = FB.user;
  if(!FB.ready || !u) return;
  try{
    S.owner = u.uid;
    await FB.m.setDoc(FB.m.doc(FB.db, 'dht_saves', u.uid), {
      s: JSON.stringify(S), day: S.day, earned: Math.floor(S.earned || 0),
      updatedAt: FB.m.serverTimestamp(),
    });
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
  }catch(e){ console.warn('Lưu cloud lỗi', e); }
}
async function pullCloud(u){
  if(R && R.running) return;
  try{
    const snap = await FB.m.getDoc(FB.m.doc(FB.db, 'dht_saves', u.uid));
    let cloud = null;
    if(snap.exists()){ try{ cloud = JSON.parse(snap.data().s); }catch(e){} }
    const localIsOther = S.owner && S.owner !== u.uid;
    let use = null;
    if(cloud && cloud.day){
      const better = cloud.day > S.day || (cloud.day === S.day && (cloud.earned || 0) >= (S.earned || 0));
      if(localIsOther || better) use = cloud;
    } else if(localIsOther){
      use = newGame();
    }
    if(use){
      S = fixSave(use);
      S.owner = u.uid;
      try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
      renderHud();
      if(cloud && use === cloud) toast(`☁️ Đã tải tiến trình: Ngày ${S.day}, ${fmt(S.money)}`);
      if(!R || !R.running) openHub();
    }
    pushCloud();
  }catch(e){ console.warn('Tải cloud lỗi', e); }
}

function fillUserBox(){
  const box = $('#ubox');
  if(!box) return;
  if(FB.failed){ box.innerHTML = '<div class="warn">Không kết nối được máy chủ xếp hạng.</div>'; return; }
  if(!FB.ready){ box.innerHTML = '<p class="note" style="text-align:center">Đang kết nối máy chủ xếp hạng…</p>'; return; }
  const u = FB.user;
  if(u){
    box.innerHTML = `<div class="ubox">${u.photoURL ? `<img src="${esc(u.photoURL)}" referrerpolicy="no-referrer" alt="">` : '<span class="noav">👤</span>'}

    box.innerHTML = accFormHtml();

    box.querySelectorAll('[data-acc]').forEach(b => b.onclick = e => { e.preventDefault(); accMode = b.dataset.acc; fillUserBox(); const f = $('#accU'); if(f) f.focus(); });

async function submitScore(){
  const u = FB.user;
  if(!FB.ready || !u) return;
  const score = Math.floor(S.earned || 0);
  if(score <= 0) return;
  if(S.submittedUid === u.uid && score <= (S.submitted || 0)) return;
  try{
    const ref = FB.m.doc(FB.db, 'dht_leaderboard', u.uid);
    const snap = await FB.m.getDoc(ref);
    if(!snap.exists() || snap.data().score < score){
      await FB.m.setDoc(ref, {
        name: uname(u).slice(0, 40),
        photo: (u.photoURL || '').slice(0, 500),
        score, day: S.day, shop: (S.shopName || '').slice(0, 40),
        updatedAt: FB.m.serverTimestamp(),
      });
    }
    S.submitted = score; S.submittedUid = u.uid; save();
  }catch(e){ console.warn('Gửi điểm lỗi', e); }
}

const EMOJIS = ['🍢','🌶️','🔥','🥬','🧀','🥚','🍱','🍜','🥟','🍤','🥓','🌭','🍄','🧅','🥒','🥜','🧄','🌿','🥫','🟫','🍯','🧂','🍹','🧋','🍵','🥤','🧊','🍋'];
let mgTab = 'dish';
const ingOf = k => CFG.ingredients[k] || { e:'❓', n:k, unlock:1 };
const hasDay1Food = list => list.some(r => r.type === 'food' && r.unlock <= 1);
const emoRow = id => `<div class="emos">${EMOJIS.map(e => `<button type="button" class="emo" data-emo="${id}">${e}</button>`).join('')}</div>`;
function bindEmo(){

function menuModal(){
  const tabs = `<div class="tabs">${[['dish','🍢 Món'],['ing','🧂 Nguyên liệu'],['shop','🏮 Quán']]
    .map(([k,l]) => `<button data-tab="${k}" class="${mgTab===k?'on':''}">${l}</button>`).join('')}</div>`;
  let body = '';
  if(mgTab === 'dish'){
    body = [...CFG.recipes].sort((a,b) => a.unlock - b.unlock).map(r => `<div class="row"><span class="ri">${esc(r.e)}</span>
      <div><b>${esc(r.n)}</b><small>${fmt(r.price)} · Cấp ${r.unlock} · ${r.type==='drink'?'Đồ uống':'Món ăn'}</small><small>${r.items.map(k => ico(k)).join('')}</small></div>
      <span class="rb"><button data-ed="${r.id}">Sửa</button><button class="del" data-del="${r.id}">Xoá</button></span></div>`).join('')
      + '<button class="big alt" id="addDish">➕ Thêm món</button>';
  } else if(mgTab === 'ing'){
    body = Object.entries(CFG.ingredients).map(([k,v]) => {
      const used = CFG.recipes.filter(r => r.items.includes(k)).length;
      return `<div class="row"><span class="ri">${esc(v.e)}</span>
        <div><b>${esc(v.n)}</b><small>${(CATS.find(([c]) => c === catOf(v)) || CATS[2])[1]} · vốn ${fmt(v.cost || 0)} · Dùng trong ${used} món${v.fry?' · 🔥 chiên ở chảo':''}</small></div>
        <span class="rb"><button data-edi="${k}">Sửa</button>${k==='tofu' ? '' : `<button class="del" data-deli="${k}">Xoá</button>`}</span></div>`;
    }).join('') + '<button class="big alt" id="addIng">➕ Thêm nguyên liệu</button>';
  } else {
    body = `<label class="fl">Chữ Hán trên biển <small>(để trống nếu không dùng)</small><input class="fin" id="sH" maxlength="6" value="${esc(CFG.shopHan)}"></label>
      <label class="fl">Tên quán (biển hiệu)<input class="fin" id="sN" maxlength="24" value="${esc(CFG.shopName)}"></label>
      <label class="fl">Dòng phụ<input class="fin" id="sS" maxlength="40" value="${esc(CFG.shopSub)}"></label>
      <label class="fl">Slogan<input class="fin" id="sL" maxlength="60" value="${esc(CFG.slogan)}"></label>
      <button class="big alt" id="sSave">💾 Lưu thông tin quán</button>`;
  }
  showModal(`<h2>🛠️ Quản lý menu</h2>
    <p class="note">Chỉnh xong bấm <b>Xuất menu</b> để đưa lên bản game mọi người quét QR.</p>
    ${tabs}${body}
    <button class="big" id="mgExport">📤 Xuất menu</button>
    <button class="big alt" id="mgDone">Xong, về màn hình chính</button>
    <button class="big alt" id="mgReset">↩️ Khôi phục menu gốc</button>`);

  card.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { mgTab = b.dataset.tab; menuModal(); });
  card.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => dishEditor(b.dataset.ed));
  card.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const r = getR(b.dataset.del), rest = CFG.recipes.filter(x => x !== r);

    if(!confirm(`Xoá món "${r.n}"?`)) return;
    CFG.recipes = rest; saveMenu(); menuModal();

  card.querySelectorAll('[data-edi]').forEach(b => b.onclick = () => ingEditor(b.dataset.edi));
  card.querySelectorAll('[data-deli]').forEach(b => b.onclick = () => {

  };

function dishEditor(id){
  const src = id && getR(id);
  const r = src ? JSON.parse(JSON.stringify(src))
    : { id:'m' + Date.now().toString(36), e:'🍢', n:'', items:[], price:30000, unlock:1, type:'food' };
  const read = () => {
    r.e = $('#fE').value.trim();
    r.n = $('#fN').value.trim();
    r.price = Math.max(0, parseInt($('#fP').value, 10) || 0);
    r.unlock = clamp(parseInt($('#fU').value, 10) || 1, 1, 99);
  };
  const draw = (err = '', keep = true) => {
    const sc = $('#card').scrollTop;
    showModal(`<h2>${src ? '✏️ Sửa món' : '➕ Thêm món'}</h2>
      <label class="fl">Emoji<input class="fin" id="fE" maxlength="8" value="${esc(r.e)}"></label>${emoRow('fE')}
      <label class="fl">Tên món<input class="fin" id="fN" maxlength="40" value="${esc(r.n)}" placeholder="VD: Đậu hủ thúi phô mai"></label>
      <div class="frow">
        <label class="fl">Giá (đ)<input class="fin" id="fP" type="number" inputmode="numeric" min="0" step="1000" value="${r.price}"></label>
        <label class="fl">Mở ở cấp<input class="fin" id="fU" type="number" inputmode="numeric" min="1" max="99" value="${r.unlock}"></label>
      </div>
      <div class="seg">
        <button type="button" data-t="food" class="${r.type==='food'?'on':''}">🍢 Món ăn</button>
        <button type="button" data-t="drink" class="${r.type==='drink'?'on':''}">🥤 Đồ uống</button>
      </div>
      <div class="fl">Nguyên liệu (${r.items.length}/12) <small>chạm để bỏ bớt</small></div>
      <div class="bench">${r.items.length
        ? r.items.map((k,i) => `<button type="button" class="bchip" data-rm="${i}">${ico(k)} ${esc(ingOf(k).n)} ✕</button>`).join('')
        : '<span class="empty">Chưa chọn nguyên liệu nào</span>'}</div>
      <div class="fl">Chạm để thêm <small>(chạm 2 lần = 2 phần)</small></div>
      <div class="pickgrid">${Object.entries(CFG.ingredients).map(([k,v]) =>
        `<button type="button" class="pk" data-add="${k}"><span>${ico(k)}</span>${esc(v.n)}</button>`).join('')}</div>
      ${err ? `<div class="warn">${esc(err)}</div>` : ''}
      <button class="big" id="fSave">💾 Lưu món</button>
      <button class="big alt" id="fCancel">Huỷ</button>`);
    if(keep) $('#card').scrollTop = sc;
    bindEmo();
    const card = $('#card');
    card.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
      read();
      if(r.items.length >= 12){ draw('Tối đa 12 nguyên liệu mỗi món'); return; }
      r.items.push(b.dataset.add); draw();
    });
    card.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { read(); r.items.splice(+b.dataset.rm, 1); draw(); });
    card.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { read(); r.type = b.dataset.t; draw(); });
    $('#fCancel').onclick = menuModal;
    $('#fSave').onclick = () => {
      read();
      if(!r.e) return draw('Chọn emoji cho món');
      if(!r.n) return draw('Nhập tên món');
      if(!r.items.length) return draw('Chọn ít nhất 1 nguyên liệu');
      const dup = CFG.recipes.find(x => x.id !== r.id && keyOf(x.items) === keyOf(r.items));
      if(dup) return draw(`Trùng bộ nguyên liệu với "${dup.n}". Mỗi món cần công thức khác nhau.`);
      const need = Math.max(...r.items.map(k => ingOf(k).unlock));

      const list = src ? CFG.recipes.map(x => x.id === r.id ? r : x) : [...CFG.recipes, r];
      if(!hasDay1Food(list)) return draw('Phải có ít nhất 1 món mở ở cấp 1.');
      CFG.recipes = list; saveMenu(); mgTab = 'dish'; menuModal(); toast('Đã lưu món ✅');
    };
  };
  draw('', false);
}

function ingEditor(k){
  const src = k && CFG.ingredients[k];
  const v = src ? { c:'rau', ...src } : { e:'🧀', n:'', unlock:1, c:'rau', fry:false, batch:4 };
  const key = k || ('i' + Date.now().toString(36));
  const isTofu = key === 'tofu';
  const draw = (err = '', keep = true) => {
    const sc = $('#card').scrollTop;
    showModal(`<h2>${src ? '✏️ Sửa nguyên liệu' : '➕ Thêm nguyên liệu'}</h2>
      <label class="fl">Emoji<input class="fin" id="gE" maxlength="8" value="${esc(v.e)}"></label>${emoRow('gE')}
      <label class="fl">Tên nguyên liệu<input class="fin" id="gN" maxlength="24" value="${esc(v.n)}" placeholder="VD: Phô mai"></label>
      <input type="hidden" id="gU" value="1">
      <div class="frow"><label class="fl">Giá vốn 1 phần (đ)<input class="fin" id="gC" type="number" inputmode="numeric" min="0" step="100" value="${v.cost ?? 1000}"></label>
      <label class="fl">Để được (ngày) <small>1 = trong ngày</small><input class="fin" id="gL" type="number" inputmode="numeric" min="1" max="60" value="${v.life ?? 3}"></label></div>
      ${isTofu ? '<p class="note">Đây là nguyên liệu chính, được chiên ở chảo nên luôn có từ ngày 1.</p>' : ''}
      <div class="fl">Nằm ở tab</div>
      <div class="seg seg3">${CATS.map(([c,l]) => `<button type="button" data-cat="${c}" class="${catOf(v)===c?'on':''}">${l}</button>`).join('')}</div>
      ${isTofu ? '' : `<div class="seg"><button type="button" data-fry="0" class="${v.fry?'':'on'}">Có sẵn, bốc ra dùng</button><button type="button" data-fry="1" class="${v.fry?'on':''}">🔥 Phải chiên ở chảo</button></div>
      ${v.fry ? `<label class="fl">Mỗi mẻ chiên được (phần)<input class="fin" id="gB" type="number" inputmode="numeric" min="1" max="20" value="${v.batch || 4}"></label>` : ''}`}
      ${err ? `<div class="warn">${esc(err)}</div>` : ''}
      <button class="big" id="gSave">💾 Lưu nguyên liệu</button>
      <button class="big alt" id="gCancel">Huỷ</button>`);
    if(keep) $('#card').scrollTop = sc;
    bindEmo();
    const readI = () => {
      v.e = $('#gE').value.trim();
      v.n = $('#gN').value.trim();
      v.unlock = isTofu ? 1 : clamp(parseInt($('#gU').value, 10) || 1, 1, 99);
      const gb = $('#gB'); if(gb) v.batch = clamp(parseInt(gb.value, 10) || 4, 1, 20);
      v.cost = Math.max(0, parseInt($('#gC').value, 10) || 0); v.life = clamp(parseInt($('#gL').value, 10) || 1, 1, 60);
    };
    $('#card').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { readI(); v.c = b.dataset.cat; draw(); });
    $('#card').querySelectorAll('[data-fry]').forEach(b => b.onclick = () => { readI(); v.fry = b.dataset.fry === '1'; draw(); });
    $('#gCancel').onclick = menuModal;
    $('#gSave').onclick = () => {
      readI();
      if(!v.e) return draw('Chọn emoji');
      if(!v.n) return draw('Nhập tên nguyên liệu');
      const bad = CFG.recipes.filter(r => r.items.includes(key) && r.unlock < v.unlock);
      if(bad.length) return draw(`Các món sau bán trước ngày ${v.unlock} nhưng cần nguyên liệu này: ${bad.map(r => r.n).join(', ')}`);
      const item = { e:v.e, n:v.n, unlock:1, c:v.c || 'rau', cost:v.cost ?? 1000, life:v.life ?? 3, pack:v.pack || 10 };
      if(isTofu || v.fry){ item.fry = true; if(!isTofu) item.batch = v.batch || 4; }
      CFG.ingredients[key] = item;
      saveMenu(); mgTab = 'ing'; menuModal(); toast('Đã lưu nguyên liệu ✅');
    };
  };
  draw('', false);
}

function exportModal(){
  const code = `const PUBLISHED_MENU = ${JSON.stringify(menuData(), null, 2)}; // END_PUBLISHED_MENU`;
  showModal(`<h2>📤 Xuất menu</h2>
    <p>Menu bạn chỉnh mới chỉ lưu trên máy này. Để ai quét QR cũng thấy menu mới, chọn 1 trong 2 cách:</p>
    <p><b>Cách 1:</b> tải file <code>index.html</code> mới (đã gắn sẵn menu) rồi thay file cũ trên GitHub/Vercel.</p>
    <button class="big" id="exDl">⬇️ Tải index.html mới</button>
    <p><b>Cách 2:</b> sao chép đoạn dưới, mở <code>index.html</code> trong VS Code và thay nguyên dòng <code>const PUBLISHED_MENU = null; …</code></p>
    <textarea class="code" id="exCode" readonly>${esc(code)}</textarea>
    <button class="big alt" id="exCopy">📋 Sao chép</button>
    <button class="big alt" id="exBack">← Quay lại</button>`);
  $('#exBack').onclick = menuModal;
  $('#exCopy').onclick = async () => {
    try{ await navigator.clipboard.writeText(code); toast('Đã sao chép ✅'); }
    catch(e){
      const t = $('#exCode'); t.focus(); t.select();
      try{ document.execCommand('copy'); toast('Đã sao chép ✅'); }catch(_){ toast('Không sao chép được, hãy bôi đen và copy tay'); }
    }
  };
  $('#exDl').onclick = async () => {
    try{
      const res = await fetch(location.pathname, { cache:'no-store' });
      if(!res.ok) throw new Error('fetch');
      const srcText = await res.text();
      const re = /const PUBLISHED_MENU = [\s\S]*?; \/\/ END_PUBLISHED_MENU/;
      if(!re.test(srcText)) throw new Error('marker');
      const out = srcText.replace(re, () => code);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([out], { type:'text/html' }));
      a.download = 'index.html';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('Đã tải index.html ✅');
    }catch(e){ toast('Không tải được file gốc, hãy dùng Cách 2 (Sao chép)'); }
  };
}
