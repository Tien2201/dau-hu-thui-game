<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Đậu Hủ Thúi Nhà Họ La</title>
<meta name="apple-mobile-web-app-title" content="Đậu Hủ Thúi">
<meta name="application-name" content="Đậu Hủ Thúi">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@500;700;800&family=Noto+Serif:wght@700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0f0a;--red:#D7263D;--red2:#A61B2E;--gold:#F4B942;--cream:#FFF6E5;--ink:#2B1A12;--wood:#7A4A2A;--wood2:#5A3420;--green:#2E9B6F}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(circle at 50% 50%,rgba(244,185,66,.18) 0 5%,transparent 5.5%),
    conic-gradient(from 45deg,#22140d 0 25%,#1a0f0a 0 50%,#22140d 0 75%,#1a0f0a 0);
  background-size:56px 56px;
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,5,2,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.show{display:flex}
.card{background:var(--cream);border-radius:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 0 0 3px var(--gold),0 20px 50px rgba(0,0,0,.6)}
.card h2{font-family:"Baloo 2",sans-serif;margin:0 0 6px;color:var(--red);font-size:26px;line-height:1.1}
.card h3{margin:16px 0 6px;font-size:16px}
.card p{margin:6px 0;line-height:1.45;font-size:14.5px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #d9c3a0;font-weight:700;font-size:14.5px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin:6px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.row .ri{font-size:28px;width:34px;text-align:center;flex:0 0 34px}
.row div{flex:1;min-width:0;line-height:1.25}
.row small{display:block;color:#777;font-weight:600;font-size:12.5px}
.row button{border:none;background:var(--gold);border-radius:10px;padding:8px 10px;font-weight:800;min-width:88px;font-size:13px}
.row button:disabled{opacity:.4}
.big{display:block;width:100%;margin-top:12px;border:none;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:18px;padding:12px;box-shadow:0 3px 0 var(--red2)}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 2px 0 #ccc;font-size:16px}
.big:active{transform:translateY(2px)}
.event{background:#fff;border-radius:14px;padding:12px;font-weight:700;font-size:15px;margin:8px 0;border-left:5px solid var(--gold)}
.warn{background:#FDE3E0;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;margin:8px 0}
.new{background:#E3F4EA;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;margin:8px 0}
.title{text-align:center;padding:4px 0 6px}
.tsign{display:inline-flex;flex-direction:column;align-items:center;background:var(--ink);border:3px solid var(--gold);border-radius:8px;padding:6px 22px 7px;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.tsign span{font-family:"Baloo 2",sans-serif;font-weight:800;color:var(--gold);font-size:30px;letter-spacing:2px;line-height:1}
.tsign small{font-weight:700;color:var(--cream);font-size:12px;letter-spacing:1px;margin-top:3px}
.tline{text-align:center}
.how{margin-top:8px;background:#fff;border-radius:12px;padding:4px 12px}
.how summary{font-weight:800;cursor:pointer;padding:6px 0;color:var(--red)}
.how ol{margin:4px 0 8px;padding-left:20px;font-size:14px;line-height:1.5}
.menu-list{font-size:13.5px;line-height:1.5}

/* menu manager */
.note{font-size:13px;color:#777}
.fin,textarea{user-select:text;-webkit-user-select:text}
.tabs{display:flex;gap:6px;margin:8px 0 6px}
.tabs button{flex:1;border:none;background:#fff;border-radius:10px;padding:8px 4px;font-weight:800;font-size:13.5px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tabs button.on{background:var(--ink);color:var(--gold)}
.rb{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.row .rb button{min-width:58px;padding:6px 8px}
.row button.del{background:#FDE3E0;color:var(--red2)}
.fl{display:block;font-weight:800;font-size:13.5px;margin:10px 0 4px}
.fl small{font-weight:600;color:#888}
.fin{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;font-weight:700;padding:10px 12px;border:2px solid #e2cfae;border-radius:12px;background:#fff;color:var(--ink)}
.fin:focus{outline:none;border-color:var(--gold)}
.fin:disabled{background:#f1ece2;color:#999}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.seg button{border:2px solid #e2cfae;background:#fff;border-radius:12px;padding:8px;font-weight:800}
.seg button.on{border-color:var(--ink);background:var(--gold)}
.emos{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.emo{border:none;background:#fff;border-radius:8px;font-size:20px;padding:2px 4px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bench{min-height:46px;display:flex;flex-wrap:wrap;gap:6px;background:#fff;border:2px dashed #d9c3a0;border-radius:12px;padding:6px}
.bench .empty{color:#999;font-weight:600;font-size:13px;align-self:center;padding:0 4px}
.bchip{border:none;background:var(--ink);color:var(--gold);border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}
.pickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:#fff;border-radius:12px;padding:6px 2px;font-size:11px;font-weight:700;line-height:1.15;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pk span{font-size:22px}
.code{width:100%;height:170px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;border:2px solid #e2cfae;border-radius:12px;padding:8px;background:#fff;color:var(--ink)}
.card code{background:#f1e6d0;border-radius:6px;padding:0 4px;font-size:12.5px}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
.float{position:absolute;transform:translateX(-50%);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:20px;color:var(--gold);-webkit-text-stroke:1px var(--ink);animation:up 1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-50px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:rgba(43,26,18,.95);color:#fff;border:1.5px solid var(--gold);
  padding:6px 14px;border-radius:999px;font-weight:700;font-size:13.5px;z-index:30;opacity:0;transition:opacity .2s;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{opacity:1}
/* ================= THEME: CỔ TRANG TRUNG HOA ================= */
:root{--red:#B22222;--red2:#7A1212;--gold:#D4A84B;--gold2:#F1D58A;--cream:#F5E9D0;--ink:#1E1410;--jade:#2F6B5A;--wood:#4A2416;--wood2:#2E140C;--green:#2F6B5A;--paper:#FBF4E2;--qh:#1F4E8C}
body{background-color:#2a0a0a;
  background-image:
    repeating-linear-gradient(0deg,rgba(212,168,75,.07) 0 2px,transparent 2px 28px),
    repeating-linear-gradient(90deg,rgba(212,168,75,.07) 0 2px,transparent 2px 28px),
    radial-gradient(ellipse at 50% 0,#5e1515,#2a0a0a 70%);
  background-size:28px 28px,28px 28px,100% 100%}
.serif,.day b,.pill,.card h2,.big,.who,.oi .nm,.fhead,.closed,.float,.tabs button{font-family:"Noto Serif",Georgia,serif}

/* popup dạng cuộn trục */
.modal{background:rgba(20,5,5,.78)}
.card{background:linear-gradient(#F7ECD4,#EEDDB8);border-radius:6px;border-top:14px solid #3a1d10;border-bottom:14px solid #3a1d10;
  box-shadow:0 0 0 2px var(--gold),0 20px 50px rgba(0,0,0,.8)}
.card h2{color:var(--red2);font-weight:900}
.big{background:linear-gradient(#C62D2D,var(--red2));border:2px solid var(--gold);color:var(--gold2);box-shadow:0 3px 0 #4a0a0a;border-radius:10px}
.big.alt{background:var(--paper);color:var(--ink);border:2px solid #CDB27A;box-shadow:0 2px 0 #CDB27A}
.row{background:var(--paper);border:1px solid #E2CFA4}
.row button{background:linear-gradient(var(--gold2),var(--gold));border:1px solid #9C7A2E}
.event{background:var(--paper);border-left-color:var(--red)}
.stat{border-bottom-color:#CDB27A}
.how{background:var(--paper)}
.how summary{color:var(--red2)}
.tsign{background:linear-gradient(#2a1a12,#0f0805);border:3px solid var(--gold);border-radius:4px;box-shadow:0 0 0 3px #0f0805,0 8px 18px rgba(0,0,0,.4);padding:8px 24px 9px}
.tsign .han{font-family:"Ma Shan Zheng","KaiTi","STKaiti",serif;font-weight:400;color:var(--gold2);font-size:46px;letter-spacing:8px;line-height:1;text-shadow:0 0 10px rgba(241,213,138,.4)}
.tsign span{font-family:"Noto Serif",serif;color:var(--gold);font-size:20px;letter-spacing:3px;margin-top:4px}
.tsign small{color:#e8d9b5}
.tabs button{background:var(--paper)}
.tabs button.on{background:var(--red2);color:var(--gold2)}
.seg button.on{background:var(--gold);border-color:var(--red2)}
.bchip{background:var(--red2);color:var(--gold2)}
.pk,.emo{background:var(--paper)}
.toast{background:rgba(42,10,10,.95);border-color:var(--gold);color:var(--gold2)}
.float{color:var(--gold2);-webkit-text-stroke:1px var(--red2)}
.msay{display:flex;align-items:center;gap:10px;margin:8px 0}
.msay img{width:96px;height:auto;flex:0 0 96px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.msay p{flex:1;background:var(--paper);border:1px solid #E2CFA4;border-radius:14px;padding:10px 12px;margin:0!important;position:relative;font-weight:600;font-size:14px}
.msay p::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);border:9px solid transparent;border-right-color:#E2CFA4;border-left:0}
.mpop2{position:fixed;left:50%;top:20%;transform:translate(-50%,-10px);width:min(92vw,400px);display:flex;align-items:center;gap:6px;z-index:35;pointer-events:none;opacity:0;animation:mpin .35s ease-out forwards}
.mpop2 img{width:96px;flex:0 0 96px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.mpop2 div{flex:1;background:var(--paper);border:3px solid var(--gold);border-radius:16px;padding:10px 12px;font-weight:800;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mpop2.bad div{border-color:var(--red)}
.mpop2.out{animation:mpout .4s ease-in forwards}
@keyframes mpin{to{opacity:1;transform:translate(-50%,0)}}
@keyframes mpout{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-16px)}}
.scard button{border:none;background:linear-gradient(var(--gold2),var(--gold));border-radius:10px;padding:8px 12px;font-weight:800;align-self:center}
.scard button.fire{background:#FDE3E0;color:var(--red2)}
.lock{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:1px dashed #CDB27A}
.pbar{height:8px;background:#eee;border-radius:5px;overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--jade)}
.shtabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px}
.shtabs button{font-size:12px;padding:8px 2px}
.row small b{color:var(--ink)}
/* ===== đánh giá kiểu Google Maps ===== */
.gm{background:#fff;border-radius:14px;padding:12px;margin:8px 0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#202124}
.gmh{display:flex;gap:14px;align-items:center}
.gms{text-align:center;flex:0 0 auto}
.gms b{display:block;font-size:44px;line-height:1;font-weight:500}
.gstars{color:#FBBC04;font-family:system-ui,-apple-system,sans-serif;letter-spacing:1px}
.gms small{display:block;color:#70757a;font-size:12.5px}
.gmb{flex:1;min-width:0}
.gbar{display:grid;grid-template-columns:12px 1fr;gap:6px;align-items:center;font-size:12px;color:#444;margin:3px 0}
.gbar i{display:block;height:8px;border-radius:5px;background:#E8EAED;overflow:hidden}
.gbar i b{display:block;height:100%;background:#FBBC04;border-radius:5px}
.chips2{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:0 0 auto;border:1px solid #dadce0;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:#3c4043;font-family:inherit}
.chips2 button.on{background:#E8F0FE;border-color:#D2E3FC;color:#1967D2}
.rv{border-top:1px solid #ebebeb;padding:12px 0}
.rvh{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 36px}
.rvh b{display:block;font-size:14px;font-weight:600}
.rvh small{display:block;color:#70757a;font-size:12px}
.rvs{display:flex;gap:8px;align-items:center;margin:6px 0 2px;font-size:12.5px;color:#70757a}
.rvs .gstars{font-size:14px}
.gm .rv p{margin:4px 0;font-size:14px;line-height:1.5;white-space:pre-line;color:#202124}
.rvsub{font-size:12.5px;color:#3c4043;margin:2px 0}
.rvd{font-size:12px;color:#70757a}
.rvr{background:#F1F3F4;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px;line-height:1.45}
.rvr b{font-size:12.5px}
.rvbtn{border:1px solid #dadce0;background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:#1a73e8;margin-top:6px;font-family:inherit}
.rvopts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.rvopts button{text-align:left;border:1px solid #dadce0;background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;color:#202124}
.vipb{display:inline-block;background:#FDE293;color:#5f4300;border-radius:4px;font-size:11px;padding:0 5px;margin-left:5px;font-weight:700;vertical-align:1px}

/* ===== chuỗi trả lời đánh giá ===== */
.thr{margin-top:6px;border-left:2px solid #e0e0e0;padding-left:10px}
.tm{margin:6px 0;font-size:13px;line-height:1.45;color:#202124}
.tm b{font-size:12.5px}
.tm small{color:#70757a}
.tm.o{background:#F1F3F4;border-radius:10px;padding:6px 9px}
.tm.o b{color:#B22222}
.tm.x b{color:#5f6368}
.tm.tnew{animation:walkin .5s ease-out}
.drama{display:inline-block;background:#FDE3E0;color:#B22222;border-radius:6px;font-size:11px;font-weight:800;padding:0 6px;margin-left:6px;vertical-align:1px}
.cmp{margin-top:8px;background:#F8F9FA;border-radius:12px;padding:8px}
.tones{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.tones::-webkit-scrollbar{display:none}
.tones button{flex:0 0 auto;border:1px solid #dadce0;background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;font-family:inherit;color:#3c4043}
.tones button.on{background:#202124;color:#fff;border-color:#202124}
.tones button.r.on{background:#B22222;border-color:#B22222}
.cmpt{width:100%;min-height:70px;font:inherit;font-size:14px;border:1px solid #dadce0;border-radius:10px;padding:8px;resize:vertical;background:#fff;color:#202124;user-select:text;-webkit-user-select:text}
.cmpb{display:flex;gap:6px;margin-top:6px}
.cmpb button{border:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;font-family:inherit}
.cmpb .send{background:#1a73e8;color:#fff;margin-left:auto}
.cmpb .alt2{background:#fff;border:1px solid #dadce0;color:#3c4043}
.cmp .note{display:block;margin-top:6px;font-size:11.5px}
.nbbox{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #E2CFA4;border-radius:14px;padding:10px;margin:8px 0}
.nbbox .nbf{font-size:38px;line-height:1}
.nbbox p{margin:2px 0!important;font-size:14.5px;line-height:1.45}
.nbbox.off{background:#EEF3FB;border-color:#B9CBE6}
.big:disabled{opacity:.45}
/* ===== hiệu ứng ===== */
.pt{position:fixed;z-index:16;font-size:17px;transform:translate(-50%,-50%);animation:pt .9s ease-out forwards;pointer-events:none}
@keyframes pt{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5);opacity:0}}
.flyc{position:fixed;z-index:17;font-size:18px;transform:translate(-50%,-50%);animation:flyc .7s cubic-bezier(.45,-0.4,.7,1) forwards;pointer-events:none}
@keyframes flyc{to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.45);opacity:.4}}
#money.bump{animation:mbump .35s ease-out}
@keyframes mbump{40%{transform:scale(1.12);box-shadow:0 0 14px var(--gold2)}}
#app.shk{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.petal{position:fixed;z-index:14;font-size:15px;pointer-events:none;opacity:.85;animation:petal 6s linear forwards}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(calc(var(--drift)*.6),calc(var(--fall)*.5)) rotate(160deg)}100%{transform:translate(var(--drift),var(--fall)) rotate(320deg);opacity:0}}
.fr .bb{position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:rgba(255,220,150,.75);animation:bb 1s ease-in infinite;pointer-events:none}
.fr .bb:nth-child(1){left:22%}.fr .bb:nth-child(2){left:52%;animation-delay:-.35s}.fr .bb:nth-child(3){left:76%;animation-delay:-.7s}
@keyframes bb{0%{transform:translateY(0) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-26px) scale(1.2);opacity:0}}
.fr .stm{position:absolute;left:50%;top:-2px;width:26px;height:20px;margin-left:-13px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.55),transparent 70%);animation:stm 1.6s ease-out infinite;pointer-events:none}
@keyframes stm{0%{transform:translateY(8px) scale(.6);opacity:0}40%{opacity:1}100%{transform:translateY(-14px) scale(1.4);opacity:0}}
.fr.done{animation:glow 1s ease-in-out infinite}
/* login + rank */
.ubox{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid #E2CFA4;border-radius:14px;padding:8px 10px;margin:10px 0}
.ubox img,.lbrow img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:0 0 36px}
.ubox div{flex:1;min-width:0;line-height:1.25}
.ubox b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubox small{display:block;color:#777;font-size:12.5px}
.ubox button{border:1px solid #CDB27A;background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;flex:0 0 auto}
.big.gbtn{background:#fff;color:#222;border:2px solid #ddd;box-shadow:0 2px 0 #ccc;font-family:"Be Vietnam Pro",sans-serif;font-size:15px}
.noav{width:36px;height:36px;flex:0 0 36px;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.lbscroll{max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border:1px solid #E2CFA4;border-radius:12px;margin:8px 0}
.lbrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px dashed #CDB27A}
.lbrow:last-child{border-bottom:none}
.lbrow.me{background:#FFF1C2}
.lbrk{width:28px;flex:0 0 28px;text-align:center;font-weight:800}
.lbnm{flex:1;min-width:0;line-height:1.2}
.lbnm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.lbnm small{color:#777;font-size:12px}
.lbv{font-family:"Noto Serif",serif;color:var(--red2);font-size:14px;white-space:nowrap}
/* ================= BỐ CỤC MỚI (theo giao diện mẫu, giữ màu cổ trang) ================= */
:root{--tile1:#26332f;--tile2:#4a645d}
body.inhub #game{display:none!important}
body:not(.inhub) #hub{display:none!important}
#game,#hub{height:100%;display:flex;flex-direction:column;min-height:0}
.serif,.hday b,.hcash b,.card h2,.big,.shopcard h1,.htabs button,.serve{font-family:"Noto Serif",Georgia,serif}

/* ---- thanh trên ---- */
.hud{display:grid;grid-template-columns:auto 1fr auto 1.2fr;gap:8px;align-items:center;padding:8px 10px 6px;
  background:linear-gradient(#3a0d0d,#2a0a0a);border-bottom:2px solid rgba(212,168,75,.45);flex:0 0 auto}
.iconbtn{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);background:var(--red2);color:var(--gold2);font-size:15px;padding:0;
  display:inline-flex;align-items:center;justify-content:center}
.hday{display:flex;flex-direction:column;line-height:1.1;color:#FFF3D6;min-width:0}
.hday b{font-size:18px;white-space:nowrap}
.hday span{font-size:12.5px;color:#e8d9b5;font-weight:700;font-variant-numeric:tabular-nums}
.hcash{display:flex;flex-direction:column;align-items:center;line-height:1;color:#e8d9b5}
.hcash small{font-size:10px;letter-spacing:2px;font-weight:800}
.hcash b{font-size:21px;color:var(--gold2);text-shadow:0 2px 0 #000;white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:2px;display:inline-block}
.hstar{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;cursor:pointer;min-width:0}
.gst{color:#FBBC04;font-size:16px;letter-spacing:1px;font-family:system-ui,-apple-system,sans-serif;white-space:nowrap}
.hstar small{color:#e8d9b5;font-size:11.5px;font-weight:700;white-space:nowrap}

/* ---- mái ngói + biển ---- */
.awning{position:relative;height:24px;margin:38px 6px 0;flex:0 0 auto;border-radius:3px 3px 0 0;
  background:repeating-linear-gradient(90deg,var(--tile1) 0 9px,var(--tile2) 9px 11px,var(--tile1) 11px 18px);
  border-top:3px solid #111;border-bottom:4px solid var(--gold);box-shadow:0 6px 10px -4px rgba(0,0,0,.8)}
.awning::before,.awning::after{content:"";position:absolute;top:-12px;width:36px;height:24px;background:var(--tile1);border-top:3px solid var(--gold)}
.awning::before{left:-6px;border-radius:100% 0 0 0;transform:skewY(-20deg)}
.awning::after{right:-6px;border-radius:0 100% 0 0;transform:skewY(20deg)}
.lan{position:absolute;top:24px;font-size:20px;z-index:3;pointer-events:none;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,90,40,.7))}
.lan.l{left:16px}.lan.r{right:16px;animation-delay:-1.4s}
@keyframes sway{50%{transform:rotate(8deg)}}
.sign{position:absolute;left:50%;top:-34px;transform:translateX(-50%);z-index:4}
.slogo{display:block;width:60px;height:60px;border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 6px 14px rgba(0,0,0,.65)}

/* ---- mặt tiền: bàn khách ---- */
.street{position:relative;flex:1 1 auto;min-height:96px;margin:0 6px;padding:22px 8px 6px;overflow:hidden;
  background:linear-gradient(#F3E6C8,#E3CDA0);border-left:8px solid #8E1B1B;border-right:8px solid #8E1B1B;
  display:flex;flex-direction:column;justify-content:flex-end}
.street::after{content:"";position:absolute;inset:0;background:var(--logo) center 40%/min(46%,150px) no-repeat;opacity:.08;pointer-events:none}
.street>*{position:relative;z-index:1}
.tables{display:grid;gap:6px;align-items:end}
.tbl{border:none;background:none;padding:0 0 4px;display:flex;flex-direction:column;align-items:center;min-width:0;position:relative}
.tbl::after{content:"";display:block;width:86%;height:9px;margin-top:3px;border-radius:5px;background:linear-gradient(#9b6a43,#6b4226);box-shadow:0 3px 0 #3a2414}
.tbl .tav{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--rc,#2F9B6F) calc(var(--p,1)*360deg),rgba(0,0,0,.15) 0);padding:4px}
.tbl .tav i{font-style:normal;width:100%;height:100%;border-radius:50%;background:#FFF8EA;display:flex;align-items:center;justify-content:center;font-size:28px}
.tbl.low .tav{--rc:#C0392B}
.tbl .tn{font-size:11px;font-weight:800;color:var(--wood2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:2px}
.tbl .td{font-size:13px;line-height:1.1;min-height:15px}
.tbl.sel .tav{box-shadow:0 0 0 3px var(--gold2),0 0 14px var(--gold)}
.tbl.sel .tn{color:var(--red2)}
.tbl.vip .tav i{background:#FFF1B8}
.tbl.in{animation:walkin .35s ease-out}
.tbl.leave{animation:leave .5s ease-in forwards;pointer-events:none}
.tbl.shake{animation:shake .35s}
.tbl.empty{opacity:.45}
.tbl.empty .tav{background:none;font-size:26px}
.tbl.empty small{font-size:10.5px;font-weight:700;color:var(--wood2)}
.tbl.coin{animation:coinin .35s ease-out}
.tbl.coin .ce{font-size:40px;line-height:1;filter:drop-shadow(0 0 10px rgba(241,213,138,.9));animation:coinbob 1.1s ease-in-out infinite}
.tbl.coin b{background:linear-gradient(var(--gold2),var(--gold));color:var(--ink);border-radius:999px;padding:0 8px;font-size:12px;box-shadow:0 2px 0 #9C7A2E}
.tbl.coin small{font-size:10px;color:var(--red2);font-weight:800}
@keyframes walkin{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes leave{to{transform:translateY(24px);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes coinin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes coinbob{50%{transform:translateY(-5px)}}
.qb{position:absolute!important;top:4px;left:8px;z-index:3!important;background:rgba(43,26,18,.88);color:var(--gold2);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;max-width:70%;overflow:hidden}
.closedmsg{align-self:center;margin:auto;font-weight:800;color:var(--red2);font-family:"Noto Serif",serif}
.deco{position:absolute!important;z-index:0!important;font-size:20px;pointer-events:none;opacity:.95}
.deco.mascot{width:54px;height:auto;left:2px;bottom:16px}

/* ---- nhân viên ---- */
.crew{display:none;margin:0 6px;padding:3px 4px;gap:3px;background:linear-gradient(#3b2a22,#2a1d16);border-left:8px solid #8E1B1B;border-right:8px solid #8E1B1B;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
.crew::-webkit-scrollbar{display:none}
.crew.has{display:flex}
.worker{flex:0 0 auto;min-width:86px;max-width:130px;display:flex;align-items:center;gap:3px;background:var(--paper);border-radius:8px;padding:1px 5px;font-size:10.5px;line-height:1.15}
.worker .f{font-size:16px}
.worker .w{flex:1;min-width:0}
.worker .l,.worker .l2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.worker .l2{color:#555;font-size:9.5px}
.worker .b{height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;margin-top:1px}
.worker .b div{height:100%;width:0;background:var(--jade)}
.worker .b div.mood{background:linear-gradient(90deg,#B22222,#E08A32)}
.worker.out{opacity:.5}
.worker.slack .l2,.worker.late .l2,.worker.out .l2{color:#B22222;font-weight:700}

/* ---- đơn app ---- */
.online{display:flex;margin:0 6px;padding:4px 6px;gap:5px;align-items:center;background:linear-gradient(#2a1d16,#3b2a22);border-left:8px solid #8E1B1B;border-right:8px solid #8E1B1B;overflow-x:auto;flex:0 0 auto;scrollbar-width:none;min-height:34px}
.online::-webkit-scrollbar{display:none}
.online .ol{color:var(--gold2);font-size:10.5px;font-weight:800;line-height:1.15;flex:0 0 auto;text-align:center}
.online .oe{color:#cdbb95;font-size:12px;font-style:italic;white-space:nowrap}
.ot{flex:0 0 auto;min-width:104px;max-width:140px;border:none;border-radius:9px;background:var(--paper);padding:3px 6px;text-align:left;font-size:11px;line-height:1.2;border-left:4px solid #2E9B6F;position:relative}
.ot .on1{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ot .ob{height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;margin-top:2px}
.ot .ob div{height:100%;width:100%;background:#2E9B6F}
.ot .ob div.low{background:#B22222}
.ot.sel{box-shadow:0 0 0 2px var(--gold2);background:#FFF6D6}
.ot.byc{background:#E6F2EA}
.ot.leave{opacity:.3;transition:opacity .4s}
.ot .oc{position:absolute;top:-5px;right:-4px;background:#B22222;color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:0 5px;line-height:16px;border:1.5px solid #fff}

/* ---- phiếu gọi món ---- */
.order{margin:6px 6px 0;flex:0 0 auto;background:linear-gradient(#FFFDF6,#F6EBD3);border:2px solid var(--gold);border-radius:14px;padding:7px 10px 9px;
  display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;position:relative;min-height:64px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.order .obowl{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#E6ECF2);display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px rgba(31,78,140,.45)}
.order .otx{min-width:0}
.order .otx b{font-size:12px;color:var(--jade)}
.order .otx p{margin:1px 0 2px;font-size:14px;line-height:1.3;font-weight:600}
.order .otx p em{font-style:normal;color:var(--red);font-weight:800}
.order .ohint{font-size:15px;letter-spacing:1px;line-height:1.2}
.order .ohint span{opacity:.45}
.order .ohint span.ok{opacity:1;filter:drop-shadow(0 0 3px #2E9B6F)}
.order .ohint small{font-size:11px;letter-spacing:0;color:#777;font-weight:700;margin-left:4px}
.order .obar{position:absolute;left:12px;right:12px;bottom:3px;height:4px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden}
.order .obar i{display:block;height:100%;width:100%;background:#2E9B6F}
.order .obar i.low{background:#C0392B}
.order .oempty{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:700;color:#6b5a3a;font-size:13.5px}
.order .oempty img{width:50px}

/* ---- quầy bếp ---- */
.kitchen{margin:6px 6px 8px;flex:0 0 auto;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px),linear-gradient(#4a2416,#2a130b);
  border:2px solid var(--gold);border-radius:14px;padding:7px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.krow1{display:grid;grid-template-columns:62px repeat(3,minmax(0,1fr));gap:6px}
.stack{border:2px solid #6b5a3a;border-radius:12px;background:linear-gradient(#3b2a22,#22140d);color:#FFE9C2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:52px;position:relative;padding:0}
.stack .se{font-size:20px;line-height:1}
.stack small{font-size:10px;font-weight:800}
.cnt2{position:absolute;top:-6px;right:-5px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:0 5px;line-height:16px;border:1.5px solid var(--gold2);min-width:18px;text-align:center}
.cnt2.zero{background:#555}
.pot{height:52px;border:2px solid #6b5a3a;border-radius:24px 24px 12px 12px;position:relative;overflow:visible;
  background:radial-gradient(ellipse at 50% 25%,#7a4a2a 0 35%,#3a2010 72%),#2a1810;color:#FFE9C2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.15),0 2px 0 #000;padding:0 2px}
.pot .pe{font-size:19px;line-height:1}
.pot .pn{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pot .ps{position:absolute;left:50%;top:-8px;width:30px;height:18px;margin-left:-15px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.5),transparent 70%);animation:stm 2s ease-out infinite;pointer-events:none}
.pot:active,.stack:active{transform:translateY(2px)}
.locked{filter:grayscale(1);opacity:.45}
.lockic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;filter:none}
.krow2{display:grid;grid-template-columns:44% 1fr;gap:6px;align-items:stretch}
.fryer{background:linear-gradient(#2a1d16,#1a110c);border-radius:12px;padding:5px;border:1.5px solid #6b5a3a}
.fhead{color:#e8d9b5;font-size:10.5px;font-weight:700;margin-bottom:4px}
.fhead b{color:var(--gold2)}
.fpick{display:flex;gap:3px;margin-top:3px}
.fpick button{flex:1;min-width:0;border:1.5px solid #6b5a3a;background:#2a1d16;color:#e8d9b5;border-radius:8px;padding:2px 1px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden}
.fpick button b{color:var(--gold2)}
.fpick button.on{background:var(--gold);color:var(--ink)}
.fslots{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fr{height:38px;border-radius:10px;border:2px solid #6b5a3a;background:radial-gradient(ellipse at 50% 35%,#4d4d4d,#1c1c1c);color:#fff;font-size:10px;font-weight:700;
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0 2px}
.fr .fe{font-size:15px;line-height:1}
.fr .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:0}
.fr.frying{background:radial-gradient(ellipse at 50% 90%,#ff8a1f,#8a2c0a 55%,#2a1208)}
.fr.done{background:radial-gradient(var(--gold2),var(--gold));color:var(--ink);border-color:var(--gold2)}
.fr.burnt{background:#000}
.plate{border-radius:50%/42%;background:radial-gradient(ellipse at 50% 40%,#fff 0 55%,#E6ECF2 70%);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 6px rgba(31,78,140,.4),0 4px 10px rgba(0,0,0,.45);
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;padding:10px 14px;position:relative;min-height:96px}
.plate .empty{font-size:12px;font-weight:700;color:#7a6a4a;text-align:center;line-height:1.35}
.plate .chip{border:none;background:none;font-size:20px;padding:0 1px;line-height:1.1}
.plate .res{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--jade);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 10px;white-space:nowrap;box-shadow:0 2px 0 #0d3a2c}
.plate .res.unk{background:#888;box-shadow:none}
.plate .boxic{position:absolute;top:4px;left:10px;font-size:14px;opacity:.75}
.plate.shake{animation:shake .35s}
.krow3{display:grid;grid-template-columns:1fr 74px;gap:6px}
.serve{border:2px solid #0d3a2c;border-radius:14px;background:linear-gradient(#3a9b72,#22704f);color:#fff;font-size:19px;font-weight:900;height:46px;box-shadow:0 4px 0 #0d3a2c;letter-spacing:.5px}
.serve:active,.trash:active{transform:translateY(3px);box-shadow:0 1px 0 #0d3a2c}
.trash{border:2px solid #4a0a0a;border-radius:14px;background:linear-gradient(#C62D2D,var(--red2));color:#FFF3D6;height:46px;font-size:17px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #4a0a0a}
.trash small{font-size:10px;font-weight:800}
.station{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-height:206px;overflow-y:auto;padding:6px 2px 2px;overscroll-behavior:contain}
.ing{height:46px;border:none;border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 1px;min-width:0;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.ing .e{font-size:19px;line-height:1.05}
.ing .n{font-size:9px;font-weight:700;line-height:1.05;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;color:var(--ink)}
.ing .cnt{position:absolute;top:-5px;right:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:0 4px;line-height:15px;min-width:16px;text-align:center;border:1.5px solid #fff}
.ing .cnt.zero{background:#666}
.ing:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.45)}
.ing.c-rau{background:linear-gradient(#F4F7F9,#C9D2D9);border-radius:6px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px #9AA7B1,inset 0 6px 8px rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.45)}
.ing.c-sot{background:radial-gradient(circle at 50% 30%,#fff,#F3E1D6);border-radius:16px 16px 10px 10px;box-shadow:inset 0 4px 0 #B22222,inset 0 0 0 2px #E7CDBF,0 2px 0 rgba(0,0,0,.45)}
.ing.c-chien{background:repeating-linear-gradient(45deg,#E6C48D 0 4px,#D9B275 4px 8px);border-radius:12px;box-shadow:inset 0 0 0 2px #B8894A,0 2px 0 rgba(0,0,0,.45)}
.ing.c-chien .n{background:rgba(255,248,232,.85);border-radius:4px;padding:0 2px}
.ing.combo{grid-column:span 2;background:linear-gradient(#EAF6EC,#BFD9C4)}
.ing.combo .n{font-size:10.5px;font-weight:800}
.ing.combo .ci{font-size:10.5px;letter-spacing:-1px}
.ing.out{opacity:.5}

/* ---- hiệu ứng chảo ---- */
.fr .bb{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:rgba(255,220,150,.75);animation:bb 1s ease-in infinite;pointer-events:none}
.fr .bb:nth-child(1){left:22%}.fr .bb:nth-child(2){left:52%;animation-delay:-.35s}.fr .bb:nth-child(3){left:76%;animation-delay:-.7s}
@keyframes bb{0%{transform:translateY(0) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) scale(1.2);opacity:0}}
.fr .stm{position:absolute;left:50%;top:-2px;width:24px;height:18px;margin-left:-12px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.55),transparent 70%);animation:stm 1.6s ease-out infinite;pointer-events:none}
@keyframes stm{0%{transform:translateY(8px) scale(.6);opacity:0}40%{opacity:1}100%{transform:translateY(-14px) scale(1.4);opacity:0}}
.fr.done{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px var(--gold2)}}

/* ---- màn chuẩn bị (hub) ---- */
.hscroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 16px;overscroll-behavior:contain}
.shopcard{position:relative;overflow:hidden;border-radius:18px;padding:14px 14px 18px;color:#FFF3D6;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 26px,transparent 26px 52px),linear-gradient(#C62D2D,#7A1212);
  box-shadow:0 0 0 2px var(--gold),0 10px 24px rgba(0,0,0,.5)}
.shopcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:radial-gradient(circle at 10px 12px,#2a0a0a 9px,transparent 9.5px) 0 0/20px 12px}
.shopcard .sch{display:flex;gap:10px;align-items:center}
.shopcard .slg{width:60px;height:60px;border-radius:50%;box-shadow:0 0 0 2px var(--gold2);flex:0 0 60px}
.shopcard h1{margin:0;font-size:22px;line-height:1.15;color:#FFF3D6;text-shadow:0 2px 0 #4a0a0a}
.shopcard .lv{font-size:13px;font-weight:800;color:var(--gold2)}
.xpbar{height:8px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden;margin:4px 0 2px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#F1D58A,#D4A84B)}
.shopcard .xpt{font-size:11.5px;color:#f3d9b0;font-weight:700}
.shopcard .chap{margin-top:8px;padding:7px 9px;background:rgba(0,0,0,.22);border-radius:10px;font-size:12.5px;line-height:1.35;max-width:78%}
.shopcard .chap b{color:var(--gold2)}

/* ========================= KHO: TỒN KHO THEO LÔ, CÓ HẠN DÙNG ========================= */
const itemDef = k => k === 'hop' ? CFG.box : CFG.ingredients[k];
const lifeOf = k => {
  const d = itemDef(k); let l = d ? (d.life ?? 3) : 3;
  if(l === 0 || !S || !S.upg) return l;
  if(CFG.soups.includes(k)) return l + (S.upg.pot || 0);
  const fz = S.upg.fridge || 0;
  if(fz && k !== 'hop') l += (d && d.fry) ? (fz >= 2 ? 2 : 0) : [0, 2, 4][fz];
  return l;
};
const costOf = k => { const d = itemDef(k); return d ? (d.cost || 0) : 0; };
const packOf = k => { const d = itemDef(k); return d ? (d.pack || 10) : 10; };
function invAddTo(s, k, n, dayOverride){
  if(n <= 0) return;
  const day = dayOverride || s.day;
  const life = lifeOf(k);
  const d = life === 0 ? 99999 : day + Math.max(1, life) - 1;
  s.inv[k] = s.inv[k] || [];
  const lot = s.inv[k].find(l => l.d === d);
  if(lot) lot.q += n; else { s.inv[k].push({ q:n, d }); s.inv[k].sort((a,b) => a.d - b.d); }
}
const invAdd = (k, n) => invAddTo(S, k, n);
const invOf = k => (S.inv[k] || []).reduce((a,l) => a + l.q, 0);
function invTake(k, n = 1){
  if(invOf(k) < n) return false;
  const lots = S.inv[k];
  while(n > 0 && lots.length){
    const take = Math.min(n, lots[0].q);
    lots[0].q -= take; n -= take;
    if(lots[0].q <= 0) lots.shift();
  }
  return true;
}
function invGiveBack(k, n = 1){                     // trả lại khi bỏ ra khỏi khay: tính như hàng hết hạn tối nay
  S.inv[k] = S.inv[k] || [];
  const lot = S.inv[k].find(l => l.d === S.day);
  if(lot) lot.q += n; else { S.inv[k].push({ q:n, d:S.day }); S.inv[k].sort((a,b) => a.d - b.d); }
}
const expTonight = k => (S.inv[k] || []).filter(l => l.d <= S.day).reduce((a,l) => a + l.q, 0);
function invExpire(){                               // gọi khi đóng quán ngày S.day
  const lost = [];
  for(const k of Object.keys(S.inv)){
    let q = 0;
    S.inv[k] = S.inv[k].filter(l => { if(l.d <= S.day){ q += l.q; return false; } return true; });
    if(q > 0) lost.push({ k, q, v:q * costOf(k) });
  }
  return lost;
}

function led(t, v, kind){
  if(!v) return;
  const L = S.led[S.day] = S.led[S.day] || [];
  const same = L.find(e => e.t === t);
  if(same) same.v += v; else L.push({ t, v, kind });
  S.profit = (S.profit || 0) + v;
  const keep = Object.keys(S.led).map(Number).sort((a,b) => b - a).slice(0, 10);
  for(const d of Object.keys(S.led)) if(!keep.includes(+d)) delete S.led[d];
}

function levelOf(xp){ let l = 1; CFG.levels.forEach((t,i) => { if(xp >= t) l = i + 1; }); return l; }
const levelTitle = l => CFG.levelTitles[Math.min(l - 1, CFG.levelTitles.length - 1)];
const xpNext = () => CFG.levels[S.level] ?? null;
function addXP(n){
  if(!n) return;
  S.xp += n;
  if(R && R.stats) R.stats.xp = (R.stats.xp || 0) + n;
  const lv = levelOf(S.xp);
  if(lv > S.level){
    const old = S.level; S.level = lv;
    const newDishes = CFG.recipes.filter(r => r.unlock > old && r.unlock <= lv);
    S.newDish = [...(S.newDish || []), ...newDishes.map(r => r.id)];
    const newDecor = CFG.decor.filter(d => d.lv > old && d.lv <= lv);
    const msg = `Lên cấp ${lv} · ${levelTitle(lv)}!` + (newDishes.length ? ` Mở món: ${newDishes.map(r => r.n).join(', ')}. Cách làm sẽ hiện khi đóng quán.` : '') + (newDecor.length ? ' Có đồ trang trí mới.' : '');
    mascotPop(msg + ' 🎉', '', 'm1', 3600);
    burst($('#money'), ['🎉','✨','⭐','🎊'], 18, 90);
    renderStation(); renderSoups();
  }
}
function chapter(){ return CFG.chapters[Math.min(S.ch, CFG.chapters.length - 1)]; }
function chProgress(c = chapter()){
  if(c.type === 'sold') return { v:S.sold, t:c.target };
  if(c.type === 'online') return { v:S.onTotal, t:c.target };
  if(c.type === 'earned') return { v:S.earned, t:c.target };
  if(c.type === 'rating') return { v:Math.min(rcTotal(), c.target), t:c.target, extra: rcTotal() >= c.target && rcAvg() < c.min ? `Điểm hiện ${rcAvg().toFixed(1).replace('.', ',')}★, cần từ ${c.min}★` : '' };
  return { v:1, t:1 };
}
function chDone(c = chapter()){
  if(c.type === 'end') return false;
  const p = chProgress(c);
  if(c.type === 'rating') return rcTotal() >= c.target && rcAvg() >= c.min;
  return p.v >= p.t;
}
function checkChapter(){

  S.money += c.reward; led(`Thưởng chương: ${c.n}`, c.reward, 'bonus');

}

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const PROG = [                                               // Rê thứ ngũ cung, nghe "cổ phong" chill
  { b:38, pad:[57,60,64,65] }, { b:46, pad:[57,62,65,69] },
  { b:43, pad:[58,62,65,69] }, { b:45, pad:[57,60,64,67] },
];
const PENTA = [62,65,67,69,72,74,77,79];
function audioCtx(){ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function musicStart(){
  if(!MUSIC.on || MUSIC.timer) return;
  try{
    const c = audioCtx();
    if(c.state === 'suspended') c.resume();
    if(!MUSIC.master){
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      const dl = c.createDelay(); dl.delayTime.value = BEAT8 * 3;
      const fb = c.createGain(); fb.gain.value = .28;
      const wet = c.createGain(); wet.gain.value = .25;
      MUSIC.master = c.createGain(); MUSIC.master.gain.value = 0;
      MUSIC.master.connect(lp); lp.connect(c.destination);
      MUSIC.master.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(lp);
      const buf = c.createBuffer(1, c.sampleRate * .2, c.sampleRate), d = buf.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      MUSIC.noise = buf;
    }
    MUSIC.master.gain.cancelScheduledValues(c.currentTime);
    MUSIC.master.gain.setTargetAtTime(.45 * VOL.music, c.currentTime, 1.2);
    MUSIC.next = c.currentTime + .15;
    MUSIC.timer = setInterval(() => {
      while(MUSIC.next < c.currentTime + .3){ musicStep(MUSIC.step, MUSIC.next); MUSIC.next += BEAT8; MUSIC.step++; }
    }, 60);
  }catch(e){}
}

function tone(type, f, t, dur, vol, att = .01){
  const c = ac, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(MUSIC.master); o.start(t); o.stop(t + dur + .05);
  return o;
}
function musicStep(step, t){
  const c = ac, inBar = step % 8, bar = Math.floor(step / 8), ch = PROG[Math.floor(bar / 2) % PROG.length];
  if(step % 16 === 0){                                        // pad mềm, đổi hợp âm mỗi 2 ô nhịp
    ch.pad.forEach(m => { tone('sine', mtof(m), t, BEAT8 * 17, .022, 1.4); tone('triangle', mtof(m) * 1.004, t, BEAT8 * 17, .012, 1.8); });
  }
  if(inBar === 0 || inBar === 4) tone('sine', mtof(ch.b), t, BEAT8 * 3.5, .16, .02);   // bass
  if(inBar === 0 || (inBar === 5 && Math.random() < .5)){                              // trống kick nhẹ
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.0001, t + .28);
    o.connect(g).connect(MUSIC.master); o.start(t); o.stop(t + .3);
  }
  if(inBar % 2 === 1){                                         // hi-hat lo-fi
    const n = c.createBufferSource(), hp = c.createBiquadFilter(), g = c.createGain();
    n.buffer = MUSIC.noise; hp.type = 'highpass'; hp.frequency.value = 7000;
    g.gain.setValueAtTime(inBar === 3 || inBar === 7 ? .035 : .02, t); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
    n.connect(hp).connect(g).connect(MUSIC.master); n.start(t); n.stop(t + .08);
  }
  if(inBar === 6 && Math.random() < .45) tone('sine', 1250, t, .09, .05, .002);        // tiếng mõ gỗ
  if(Math.random() < (inBar % 2 ? .22 : .42)){                                         // giai điệu kiểu đàn tranh
    MUSIC.mel = clamp(MUSIC.mel + pick([-2,-1,-1,0,1,1,2]), 0, PENTA.length - 1);

    if(Math.random() < .2){ o.frequency.setValueAtTime(f * .944, t); o.frequency.linearRampToValueAtTime(f, t + .08); }  // luyến nốt
  }
}

const ico = k => ICO[k] ? `<svg class="ico" viewBox="0 0 64 64" aria-hidden="true">${ICO[k]}</svg>` : esc((itemDef(k) || {}).e || '❓');
const shortOf = k => { const v = itemDef(k); return (v && v.s) || SHORT[k] || (v ? v.n : k); };
const fmtK = n => { const a = Math.abs(n), s = n < 0 ? '-' : ''; if(a >= 1e9) return s + (a/1e9).toFixed(3).replace(/\.?0+$/,'').replace('.', ',') + ' tỷ'; return a >= 1e6 ? s + (a/1e6).toFixed(2).replace(/\.?0+$/,'').replace('.', ',') + 'tr' : s + (Math.round(a/100)/10).toString().replace('.', ',') + 'k'; };
const needOf = r => { const n = {}; r.items.forEach(k => n[k] = (n[k] || 0) + 1); return n; };

/* ---- Khẩu vị riêng của khách: không hành, không cay, thêm tỏi… ---- */
const MODS = [
  { id:'nohanh', no:['hanh'], t:'không hành', tag:'🚫 hành' },
  { id:'nocay', no:['otuoi','dauot_tt','dauot_pt','sotsate'], t:'không ăn cay', tag:'🚫 cay', skip:['sate'] },
  { id:'nocantau', no:['cantau'], t:'không ăn cần tàu', tag:'🚫 cần tàu' },
  { id:'nochua', no:['bapcai','cucaihong','cucaingam'], t:'không lấy đồ chua', tag:'🚫 đồ chua' },
  { id:'notoi', no:['toiphi'], t:'không tỏi phi', tag:'🚫 tỏi' },
  { id:'moretoi', add:'toiphi', t:'thêm tỏi phi', tag:'➕ tỏi phi' },
  { id:'moreot', add:'otuoi', t:'thêm ớt cay', tag:'➕ ớt' },
  { id:'morecu', add:'cucaihong', t:'thêm củ cải hồng', tag:'➕ củ cải' },
  { id:'morerau', add:'raoque', t:'thêm rau quế', tag:'➕ rau quế' },
];
const modOf = x => x && x.mod ? MODS.find(m => m.id === x.mod) : null;
function specOf(x){                                    // danh sách nguyên liệu thật của 1 phần (đã tính dặn riêng)
  const r = getR(x.id), m = modOf(x);
  let items = [...r.items];
  if(m && m.no) items = items.filter(k => !m.no.includes(k));
  if(m && m.add) items.push(m.add);
  return items;
}
const specKey = x => keyOf(specOf(x));
const modTxt = x => { const m = modOf(x); return m ? m.t : ''; };
function rollMod(item){
  if(Math.random() >= Math.min(.32, .14 + S.day * .015)) return item;
  const r = getR(item.id);
  const ok = MODS.filter(m => !(m.skip || []).includes(r.id) && (m.no ? m.no.some(k => r.items.includes(k)) && r.items.filter(k => !m.no.includes(k)).length >= 3 : r.items.includes(m.add)));
  if(ok.length) item.mod = pick(ok).id;
  return item;
}
const needOfList = arr => { const n = {}; arr.forEach(k => n[k] = (n[k] || 0) + 1); return n; };
function canMake(r){                                   // đủ hàng trong kho (tính cả đồ sống chưa chiên)
  if(invOf('hop') < 1) return false;
  const n = needOf(r);
  for(const k in n){ if(isFry(k) ? stockOf(k) + invOf(k) < n[k] : invOf(k) < n[k]) return false; }
  return true;
}
function trayRecipe(){
  if(!R || !R.tray.length) return null;
  const k = keyOf(R.tray);
  return unlocked().find(r => keyOf(r.items) === k) || null;
}
function trayMatch(){                                  // khớp với phần nào đang chờ (tính cả dặn riêng)
  if(!R || !R.tray.length) return null;
  const k = keyOf(R.tray);
  for(const c of liveTargets()) for(const x of c.items) if(!x.done && specKey(x) === k) return x;
  return null;
}
const liveTargets = () => [...R.cust.filter(c => c && !c.coin && !c.leaving), ...(R.online || []).filter(o => !o.leaving)];
const liveCust = liveTargets;
function target(){
  let t = R.sel && liveTargets().find(c => c.uid === R.sel && c.items.some(x => !x.done));
  if(!t){
    const ls = liveTargets().filter(c => c.items.some(x => !x.done)).sort((a,b) => (a.online - b.online) || (a.t0 - b.t0));
    t = ls[0] || null; R.sel = t ? t.uid : null;
  }
  return t;
}

/* ========================= HIỂN THỊ: MÀN BÁN HÀNG ========================= */
function renderHud(){
  $('#dayLbl').textContent = 'Ngày ' + S.day;
  $('#money').textContent = fmtK(S.money);
  const n = rcTotal(), a = n ? rcAvg() : 0;
  $('#starIcons').textContent = starStr(n ? a : 0);
  $('#starTxt').textContent = `${n ? a.toFixed(1).replace('.', ',') : '–'} · ${n} đánh giá`;
  const hm = $('#hubMoney'); if(hm) hm.textContent = fmtK(S.money);
}
function renderClock(){
  if(!R || !R.running){ $('#clock').textContent = 'Chuẩn bị'; return; }
  if(R.t >= CFG.dayLength){ $('#clock').textContent = 'Đóng cửa'; return; }
  const h = CFG.openHour + (CFG.closeHour - CFG.openHour) * (R.t / CFG.dayLength);
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 10) * 10;

function sceneHtml(){ return `<svg class="scbg" viewBox="0 0 360 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${SCENES[sceneOf()] || ''}</svg>`; }
function decorHtml(){
  const pos = { denlong:'top:0;left:28%', caudoi:'top:26px;left:4px', mai:'right:4px;bottom:18px', tranh:'top:2px;right:24%', chuong:'top:20px;right:8px', cachep:'top:0;left:52%' };
  return S.decor.owned.map(id => {
    if(id === 'tieunhi') return `<img class="deco mascot" src="${IMG.m1}" alt="">`;
    const d = CFG.decor.find(x => x.id === id);
    return d ? `<span class="deco" style="${pos[id] || 'top:0;left:0'}">${d.e}</span>` : '';
  }).join('');
}
function renderStreet(){
  const st = $('#street');
  const n = R.cust.length;
  const live = R.cust.some(c => c);
  if(R.running && R.t >= CFG.dayLength && !live && !R.queue.length){
    st.innerHTML = `<div class="closedmsg">🌙 Hết giờ bán, dọn quán thôi…</div>${decorHtml()}`; return;
  }
  const tables = R.cust.map((c,i) => {
    if(!c) return incOn('roof') && R.inc.roof.i === i ? `<div class="tbl empty leak"><span class="tav">💧</span><small>Dột mái</small></div>` : `<div class="tbl empty"><span class="tav">🪑</span><small>Bàn trống</small></div>`;
    if(c.coin) return `<button class="tbl coin" data-coin="${i}"><span class="ce">💰</span><b>${fmtK(c.amt)}</b><small>Chạm thu</small></button>`;
    const cls = ['tbl'];
    if(!c.shown){ cls.push('in'); c.shown = true; }
    if(c.leaving) cls.push('leave');
    if(c.vip) cls.push('vip');
    if(R.sel === c.uid) cls.push('sel');
    if(c.hkh) cls.push('hkh');
    if(c.running) return `<button class="tbl hkh run" data-run="${i}"><span class="tav"><i>🏃</i></span><small class="tn">Bắt ổng lại!</small><span class="td">💨💨</span></button>`;
    return `<button class="${cls.join(' ')}" data-i="${i}" data-uid="${c.uid}"><span class="tav"><i>${c.face}</i></span>
      <small class="tn">${esc(c.vip ? 'Quan lớn' : (c.title ? c.title + ' ' : '') + c.name)}</small>
      <span class="td">${c.items.map(x => x.done ? '✅' : x.claimed ? '🏃' : esc(getR(x.id).e)).join('')}</span></button>`;
  }).join('');
  if(!R.walkHtml || R.walkDay !== S.day){ R.walkHtml = walkersHtml(); R.walkDay = S.day; }
  applyScene();
  st.innerHTML = sceneHtml() + R.walkHtml + (R.queue.length ? `<div class="qline">${R.queue.map((q,i) => `<span style="animation-delay:${(i * .15).toFixed(2)}s">${q.face}</span>`).join('')}<b>xếp hàng ${R.queue.length}</b></div>` : '')
    + decorHtml() + `<div class="tables" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${tables}</div>`;
  renderQStats();
  updateBars();
}
function renderOnline(){
  const el = $('#online');
  if(!R) return;
  if(!onlineOpen()){ el.style.display = 'none'; return; }
  el.style.display = '';
  if(!R.online || !R.online.length){
    el.innerHTML = `<span class="ol">📱<br>Đơn app</span><span class="oe">${R.running ? (R.ev && R.ev.id === 'rain' ? 'Chưa có đơn nào. Trời mưa đơn về nhiều hơn.' : 'Chưa có đơn nào. Đánh giá càng cao đơn càng nhiều.') : 'Đơn app sẽ về khi mở cửa.'}</span>`;
    return;
  }
  el.innerHTML = '<span class="ol">📱<br>Đơn app</span>' + R.online.map(o => {
    const left = o.items.filter(x => !x.done), cur = left[0] || o.items[0], r = getR(cur.id);
    const cls = ['ot'];
    if(o.leaving) cls.push('leave');
    if(cur.claimed) cls.push('byc');
    if(R.sel === o.uid) cls.push('sel');
    return `<button class="${cls.join(' ')}" data-oid="${o.uid}">${left.length > 1 ? `<span class="oc">×${left.length}</span>` : ''}
      <div class="on1">${o.app.e} #${o.uid} ${esc(r.e)} ${esc(r.n)}</div><div class="ob"><div></div></div></button>`;
  }).join('');
  updateBars();
}
function renderOrder(){

  const it = t.items.find(x => !x.done) || t.items[0], r = getR(it.id);

  let line = t.online ? `1 phần ${r.n}${it.mod ? ` (ghi chú: ${modTxt(it)})` : ''}${t.items.length > 1 ? `, ${t.items.length} món tất cả` : ''}, làm xong giao shipper nha!` : t.line;
  let html = esc(line);

  const cnt = {}; (R.tray || []).forEach(k => cnt[k] = (cnt[k] || 0) + 1);
  const hint = specOf(it).map(k => { const ok = cnt[k] > 0; if(ok) cnt[k]--; return `<span class="${ok ? 'ok' : ''}" title="${esc(itemDef(k).n)}">${ico(k)}</span>`; }).join('')

function pay(i){
  const c = R.cust[i];
  if(c.hkh === 'quyt' && !c.running){ c.hkh = 'quytRun'; return hkhRun(i); }
  if(c.running) return;
  const el = document.querySelector(`.tbl[data-uid="${c.uid}"]`);
  const base = c.items.reduce((s,x) => s + priceOf(getR(x.id)), 0);
  const ratio = clamp(c.pat / c.patMax, 0, 1);
  let tip = Math.round(base * 0.2 * ratio / 1000) * 1000;
  if(c.waited) tip += Math.round(base * .06 * c.waited / 1000) * 1000;   // được phục vụ bưng tận bàn
  if(c.tea) tip += 2000;
  if((S.upg.pay || 0) >= 2) tip += Math.round(base * .1 / 1000) * 1000;
  if(c.vip) tip *= 2;
  if(c.bonus) tip += c.bonus;
  if(c.free){ c.cash = 0; R.stats.served++; c.leaving = true; c.face = '😌'; if(R.sel === c.uid) R.sel = null; toast(`${HKH_NAME} ăn xong đi về (không trả tiền)`); renderStreet(); renderOrder(); removeLater(i, c); return; }
  if(c.hkh === 'review' && c.bad){ c.leaving = true; c.face = '😏'; const i2 = i; setTimeout(() => { const a = randAuthor(); pushReview({ id:'r' + Date.now().toString(36) + Math.floor(Math.random()*1e5), day:curDay(), stars:1, text:'Quán dở tệ, đậu thúi như cống, chủ quán còn lên mặt. 1 sao cũng là nhiều!', dish:null, sub:null, name:HKH_NAME, meta:'Local Guide · 3 bài đánh giá (toàn 1 sao)', col:'#4a148c' }, true); toast('😏 Hoài Kim Huynh vừa đăng review 1★'); }, 900); }
  const t = activeStaff('thungan');
  if(t){
    const tr = TRAITS[t.s.trait];
    tip += Math.round(base * 0.04 * t.s.skill / 1000) * 1000;
    if(tr.clumsy && Math.random() < tr.clumsy){
      const lost = pick([5000, 10000, 20000]);
      S.money -= lost; R.stats.lost += lost; led('Thu ngân thối nhầm', -lost);
      setMsg(t, `🤕 Thối nhầm ${fmt(lost)}!`);
    } else setMsg(t, `Tính tiền ${fmt(base + tip)}`);
  }
  R.stats.served++; R.stats.revenue += base; R.stats.tips += tip; S.totalServed++;
  if(ratio > .55) misHit('fast');
  c.leaving = true; c.face = c.vip ? '🤩' : '😋';
  c.cash = base + tip;
  burst(el, c.vip ? ['👑','✨','🎉','⭐'] : ['✨','⭐','💫','😋'], c.vip ? 14 : 8);
  SFX.done();
  if(c.vip || Math.random() < .3) addReview({ kind:'paid', cu:c, dish:getR(c.items[0].id), ratio, vip:c.vip });
  if(c.vip) toast('Quan lớn ăn xong gật gù, ban thưởng hậu hĩnh! 👑');
  if(R.sel === c.uid) R.sel = null;
  renderStreet(); renderOrder(); renderHud(); removeLater(i, c);
}

const prepDur = k => (CFG.soups.includes(k) ? 10 * ((S.upg.pot || 0) >= 2 ? .5 : 1) : k === 'hop' ? 3 : isFry(k) ? 6 : catOf(itemDef(k)) === 'sot' ? 4 : 5) * [1, .6, .35][S.upg.prep || 0];
const prepVerb = k => CFG.soups.includes(k) ? 'Nấu' : isFry(k) ? 'Sơ chế' : catOf(itemDef(k)) === 'rau' ? 'Sơ chế' : 'Lấy';
function startPrep(k, auto){
  if(!R || !R.running) return false;
  R.prep = R.prep || {};
  const v = itemDef(k);
  if(R.prep[k]){ if(!auto) toast(`⏳ ${prepVerb(k)} ${v.n.toLowerCase()}… còn ${Math.ceil(R.prep[k].dur - R.prep[k].t)}s`); return false; }
  const q = packOf(k), cost = Math.round(q * costOf(k));
  if(S.money < cost){ if(!auto){ toast(`Két không đủ ${fmtK(cost)} để ${prepVerb(k).toLowerCase()} ${v.n.toLowerCase()}`); SFX.bad(); } return false; }
  S.money -= cost;
  led(`${prepVerb(k)} thêm ${v.n.toLowerCase()} (trong ca)`, -cost, 'buy');
  R.prep[k] = { t:0, dur: prepDur(k), q };
  if(!auto){ toast(`${v.e} ${prepVerb(k)} thêm ${q} phần ${v.n.toLowerCase()} · ${fmtK(cost)}`); SFX.tap(); }
  renderHud(); renderKitchen();
  return true;
}
function prepTick(dt){
  R.prep = R.prep || {};
  let done = false;
  for(const [k,p] of Object.entries(R.prep)){
    p.t += dt;
    if(p.t >= p.dur){
      invAdd(k, p.q); delete R.prep[k]; done = true;
      const v = itemDef(k);
      const el = document.querySelector(`[data-k="${k}"]`) || document.querySelector(`[data-b="${k}"]`) || (k === 'hop' ? $('#stackBtn') : null);
      if(el){ floatAt(el, `+${p.q} ${v.e}`); burst(el, ['✨'], 4, 30); }
      SFX.done();
    }
  }
  // phụ bếp trong ca: thấy nguyên liệu sắp hết là tự nấu / sơ chế / lấy thêm
  const pb = R.crew && R.crew.find(w => w.st === 'on' && w.s.role === 'bep');
  if(pb){
    R.pbT = (R.pbT || 0) - dt;
    if(R.pbT <= 0){
      R.pbT = 1.2 / spdOf(pb.s);
      const low = k => invOf(k) <= (k === 'hop' ? 3 : isFry(k) ? 0 : 2);
      const need = ['hop', ...CFG.soups, ...usedSet()].filter((k,i,a) => a.indexOf(k) === i && itemDef(k) && (k === 'hop' || usedSet().has(k)) && low(k) && !(R.prep && R.prep[k]));
      if(need.length && startPrep(need[0], true)){ const k = need[0]; setMsg(pb, `${prepVerb(k)} thêm ${shortOf(k)}`); toast(`🧑‍🍳 ${pb.s.name} đang ${prepVerb(k).toLowerCase()} thêm ${itemDef(k).n.toLowerCase()}`); }
    }
  }
  if(done) renderKitchen();
}
function prepHtml(k){
  const p = R && R.prep && R.prep[k];
  if(p) return `<i class="prep" data-pk="${k}" style="--p:${(p.t / p.dur).toFixed(3)}"><b>${Math.ceil(p.dur - p.t)}</b></i>`;
  return '';
}
function updatePrep(){
  if(!R || !R.prep) return;
  document.querySelectorAll('.prep[data-pk]').forEach(el => {
    const p = R.prep[el.dataset.pk]; if(!p) return;
    el.style.setProperty('--p', clamp(p.t / p.dur, 0, 1).toFixed(3));
    const b = el.querySelector('b'), s = String(Math.ceil(p.dur - p.t));
    if(b && b.textContent !== s) b.textContent = s;
  });
}

  if(invOf(k) <= 0){ startPrep(k); return; }

  b.classList.add('pressing');
}
function squeezeEnd(){
  if(!squeeze) return;
  const s = squeeze; squeeze = null;
  document.querySelectorAll('.bottle.pressing').forEach(x => { x.classList.remove('pressing'); const h = x.querySelector('.hold'); if(h) h.style.setProperty('--p', 0); });
  if(s.t < HOLD_T) toast('🫳 Giữ chai lâu hơn chút cho sốt ra nha!');
}
function squeezeTick(dt){
  if(!squeeze) return;

  const el = document.querySelector(`.bottle[data-b="${squeeze.k}"]`);
  const h = el && el.querySelector('.hold');

/* ========================= ĐỘ DƠ CỦA QUÁN ========================= */
const DIRT_STEP = 12;
const dirtLv = () => { const d = (R && R.dirt) || 0; return d >= 75 ? 3 : d >= 50 ? 2 : d >= 25 ? 1 : 0; };
const DIRT_N = ['Sạch bóng ✨', 'Hơi bừa', 'Dơ rồi 😖', 'Dơ kinh khủng 🪰'];
function addDirt(n){
  if(!R || !R.running) return;
  const before = dirtLv();
  R.dirt = clamp((R.dirt || 0) + n * [1, .65, .4][S.upg.sink || 0], 0, 100);
  syncSpots();
  const lv = dirtLv();
  if(lv > before && lv >= 2 && !R.crew.some(w => w.st === 'on' && w.s.role === 'vesinh'))
    toast(lv === 3 ? '🪰 Quán dơ kinh khủng! Khách sắp chê rồi, chạm vết dơ để lau gấp!' : '🧽 Bếp bắt đầu dơ, chạm vào vết dơ để lau nha!');
}
function syncSpots(){
  R.spots = R.spots || [];
  const want = Math.min(10, Math.floor((R.dirt || 0) / DIRT_STEP));
  while(R.spots.length < want){
    const area = Math.random() < .65 ? 'k' : 's';
    R.spots.push({ id:++uidSeq, area, x:rnd(6, 88), y:area === 'k' ? rnd(8, 88) : rnd(30, 80), r:rnd(0, 360), sz:rnd(.8, 1.3), fly:Math.random() < .25 });
  }
  while(R.spots.length > want) R.spots.pop();
  renderDirt();
}
function renderDirt(){
  ['k','s'].forEach(a => {
    const el = $(a === 'k' ? '#dirtK' : '#dirtS'); if(!el) return;
    const sp = (R && R.running && R.spots || []).filter(x => x.area === a);
    el.innerHTML = sp.map(x => `<i class="stain${x.fly ? ' fly' : ''}" data-sp="${x.id}" style="left:${x.x}%;top:${x.y}%;--r:${x.r}deg;--s:${x.sz}"></i>`).join('');
  });
  const b = $('#dirtBadge');
  if(b){ const lv = dirtLv(); b.textContent = R && R.running ? `🧽 ${DIRT_N[lv]}` : ''; b.className = 'dbadge l' + lv; }
}
function cleanSpot(id, who){
  if(!R || !R.spots) return false;
  const i = R.spots.findIndex(x => x.id === id); if(i < 0) return false;
  const sp = R.spots[i];
  const el = document.querySelector(`.stain[data-sp="${id}"]`);
  if(el){ burst(el, ['✨','🫧'], 4, 26); }
  R.spots.splice(i, 1);
  R.dirt = Math.max(0, (R.dirt || 0) - DIRT_STEP);
  if(!who){ SFX.tap(); misHit && misHit('clean'); }
  renderDirt();
  return true;
}
function cleanerTick(w, dt){
  w.cd -= dt * spdOf(w.s);
  if(w.cd > 0) return;
  w.cd = 2.4;
  if(R.spots && R.spots.length){
    const sp = R.spots[R.spots.length - 1];
    cleanSpot(sp.id, w);
    setMsg(w, sp.area === 'k' ? '🧽 Lau bếp' : '🧹 Chùi bàn');
  } else { R.dirt = Math.max(0, (R.dirt || 0) - 2); setMsg(w, R.t < CFG.dayLength ? '🧹 Quét nhà' : '🧹 Dọn quán'); }
}
/* ========================= QUẦY BẾP ========================= */
const canAct = () => R && R.running && !R.paused;
function ensureBox(){
  if(R.box) return true;
  if(!invTake('hop', 1)){ startPrep('hop'); return false; }
  R.box = true;
  return true;
}
function takeBox(){
  if(!canAct()) return;
  if(R.box){ toast('Trên khay đã có hộp rồi'); return; }
  if(ensureBox()){ SFX.tap(); renderTray(); renderSoups(); }
}
function addIng(k){
  if(!canAct()) return;
  const v = itemDef(k);
  if(!usedSet().has(k)){ toast(`🔒 ${v.n} mở khi quán lên cấp`); return; }
  if(R.tray.length >= 12){ toast('Hộp đầy rồi!'); return; }
  if(isFry(k)){
    if(stockOf(k) <= 0){ R.fryPick = k; renderFryer(); toast(`Hết ${v.n} chín! Chạm chảo để chiên 🔥`); SFX.bad(); return; }
    if(!ensureBox()) return;
    S.stock[k]--;
  } else {
    if(invOf(k) <= 0){ startPrep(k); return; }
    if(!ensureBox()) return;
    invTake(k, 1);
  }
  R.tray.push(k);
  SFX.tap();
  renderKitchen(); renderOrder();
}
function addCombo(id){
  if(!canAct()) return;
  const c = (CFG.combos || []).find(x => x.id === id);
  if(!c) return;
  if(R.tray.length + c.items.length > 12){ toast('Hộp đầy rồi!'); return; }
  const miss = c.items.filter(k => invOf(k) <= 0);
  if(miss.length){ miss.forEach(k => startPrep(k)); return; }
  if(!ensureBox()) return;
  c.items.forEach(k => invTake(k, 1));
  R.tray.push(...c.items);
  SFX.tap();
  renderKitchen(); renderOrder();
}
function removeChip(idx){
  if(!canAct()) return;
  const k = R.tray.splice(idx, 1)[0];
  if(isFry(k)) S.stock[k] = stockOf(k) + 1; else invGiveBack(k, 1);
  renderKitchen(); renderOrder();
}
function trash(){
  if(!canAct() || (!R.box && !R.tray.length)) return;
  const lost = R.tray.length;
  R.tray = []; R.box = false;
  toast(lost ? `Đã đổ khay (mất ${lost} nguyên liệu và 1 hộp)` : 'Đã bỏ hộp');
  renderKitchen(); renderOrder();
}
function markDone(cu, it){
  it.done = true; it.claimed = null;
  addDirt(cu.online ? 2 : 3.5);
  S.sold = (S.sold || 0) + 1; R.stats.sold++;
  addXP(10); misHit('sell', 1, it.id); misHit('sellAll');
  SFX.tap();
  if(cu.items.every(x => x.done)) finishCust(cu);
  else { renderStreet(); renderOnline(); }
  renderOrder();
}
function deliver(){
  if(!canAct()) return;
  if(!R.box || !R.tray.length){ toast('Khay đang trống, ráp món trước nhé'); return; }
  const tk = keyOf(R.tray), base = trayRecipe();
  const plate = $('#tray');
  const exact = x => !x.done && specKey(x) === tk;
  const loose = x => !x.done && base && x.id === base.id;        // đúng món nhưng quên lời dặn
  const pickIn = (c, f) => c.items.find(x => f(x) && !x.claimed) || c.items.find(f);
  const t = target();
  let cu = null, it = null, wrongMod = false;
  for(const f of [exact, loose]){
    if(t && (it = pickIn(t, f))){ cu = t; break; }
    const ls = liveTargets().filter(c => c.items.some(f)).sort((a,b) => a.pat/a.patMax - b.pat/b.patMax);
    if(ls.length){ cu = ls[0]; it = pickIn(cu, f); break; }
  }
  if(cu && !exact(it)) wrongMod = true;
  if(!cu){
    if(!base){ plate.classList.remove('shake'); void plate.offsetWidth; plate.classList.add('shake'); SFX.bad(); toast('Chưa đúng công thức món nào, xem gợi ý trên phiếu 🤔'); return; }
    toast(`Không có khách nào gọi ${base.n} kiểu này`); SFX.bad(); if(t){ t.mist++; t.pat = Math.max(1, t.pat - 3); } return;
  }
  const r = getR(it.id);
  S.made = S.made || {}; S.made[it.id] = (S.made[it.id] || 0) + 1;
  if(wrongMod){
    cu.mist++; cu.modMiss = modTxt(it) || 'đúng ý'; cu.pat = Math.max(1, cu.pat - 4);
    toast(`😠 ${cu.online ? 'Khách app' : (cu.title || 'Khách')} dặn "${modTxt(it) || 'làm đúng ý'}" mà!`);
    SFX.bad();
  }
  if(it.claimed){
    const ii = cu.items.indexOf(it);
    const w = R.crew.find(w => w.job && w.job.cu === cu && w.job.ii === ii);
    if(w){ refundJob(w); setMsg(w, 'Chủ quán làm rồi, đổi việc'); }
  }
  burst(plate, ['✨','♨️'], 6, 40);
  R.tray = []; R.box = false;
  renderKitchen();
  const wf = waiterFree();
  if(wf){
    it.claimed = wf.s.name;
    wf.job = { cu, ii:cu.items.indexOf(it), use:{}, box:false, carry:true }; wf.prog = 0;
    setMsg(wf, `🏃 Bưng ${r.n} ${cu.online ? 'cho shipper' : 'ra bàn'}`);
    SFX.tap(); renderStreet(); renderOnline(); renderOrder();
    return;
  }
  markDone(cu, it);
}
function startFry(f, k){
  if(fryBlocked(R.fry.indexOf(f))) return false;
  const n = Math.min(batchOf(k), invOf(k));
  if(n <= 0) return false;
  invTake(k, n);
  f.st = 'frying'; f.n = n; f.k = k; f.t = 0;
  addDirt(1.5);
  if(R && R.stats) R.stats.batches = (R.stats.batches || 0) + 1;
  return true;
}
function collectFry(f, n){
  S.stock[f.k] = stockOf(f.k) + (n ?? f.n);
  f.st = 'empty'; f.n = 0;
}
function tapFryer(i){
  if(!canAct()) return;
  const f = R.fry[i];
  const bl = fryBlocked(i);
  if(bl && (f.st === 'empty' || f.st === 'frying')){ toast(`${bl}, chảo này chưa dùng được!`); SFX.bad(); return; }
  if(f.st === 'empty'){
    const k = R.fryPick;
    if(!startFry(f, k)){ startPrep(k); return; }
    SFX.fry();
  } else if(f.st === 'done'){
    const fel = document.querySelector(`.fr[data-f="${i}"]`);
    floatAt(fel, `+${f.n} ${itemDef(f.k).e}`); burst(fel, ['✨','♨️'], 5, 35);
    collectFry(f); SFX.done();
  } else if(f.st === 'burnt'){
    f.st = 'empty'; f.n = 0; SFX.tap();
  } else return;
  renderFryer(); renderStation();
}

/* ========================= NHÂN VIÊN LÀM VIỆC ========================= */
const spdOf = s => TRAITS[s.trait].spd * (0.8 + 0.2*s.skill);
function activeStaff(role){ return R && R.crew ? R.crew.find(w => w.s.role === role && w.st === 'on') : null; }
function setMsg(w, m){ if(w.msg !== m){ w.msg = m; renderCrew(); } }
function renderCrew(){
  const el = $('#crew');
  if(!R || !R.crew || !R.crew.length){ el.classList.remove('has'); el.innerHTML = ''; return; }
  el.classList.add('has');
  el.innerHTML = R.crew.map((w,i) => {
    const role = CFG.roles[w.s.role], tr = TRAITS[w.s.trait];
    return `<div class="worker ${w.st}" data-w="${i}"><span class="f">${w.s.face}</span><div class="w">
      <div class="l"><b>${esc(w.s.name)}</b> ${role.e}${tr.e}</div><div class="l2">${esc(w.msg || '')}</div>
      <div class="b"><div class="${tr.hot ? 'mood' : ''}"></div></div></div></div>`;
  }).join('');
  updateBars();
}
function refundJob(w){
  if(!w.job) return;
  for(const k in w.job.use){ if(isFry(k)) S.stock[k] = stockOf(k) + w.job.use[k]; else invGiveBack(k, w.job.use[k]); }
  if(w.job.box) invGiveBack('hop', 1);
  const it = w.job.cu.items[w.job.ii];
  if(it) it.claimed = null;
  w.job = null; w.prog = 0;
}
function cookNeed(){
  const need = {};
  liveTargets().forEach(cu => cu.items.forEach(x => { if(!x.done && !x.claimed) getR(x.id).items.forEach(k => { if(isFry(k)) need[k] = (need[k] || 0) + 1; }); }));
  const supply = k => stockOf(k) + R.fry.reduce((a,f) => a + ((f.st === 'frying' || f.st === 'done') && f.k === k ? f.n : 0), 0);
  let best = null, gap = 0;
  for(const k of fryables()){
    if(invOf(k) <= 0) continue;
    const g = (need[k] || 0) + (k === 'tofu' ? 2 : 0) - supply(k);
    if(g > gap){ gap = g; best = k; }
  }
  return best;
}
function cookTick(w, dt){
  w.cd -= dt * spdOf(w.s);
  if(w.cd > 0) return;
  w.cd = 1.6;
  const tr = TRAITS[w.s.trait];
  const d = R.fry.find(f => f.st === 'done');
  if(d){
    if(tr.clumsy && Math.random() < tr.clumsy){
      const kept = Math.floor(d.n / 2);
      setMsg(w, `🤕 Làm rơi ${d.n - kept} phần ${itemDef(d.k).e}!`); R.stats.drops++; addDirt(6);
      collectFry(d, kept);
    } else { setMsg(w, `Nhấc rổ ${itemDef(d.k).e}`); collectFry(d); }
    renderFryer(); renderStation(); return;
  }
  const b = R.fry.find(f => f.st === 'burnt');
  if(b){ b.st = 'empty'; b.n = 0; setMsg(w, 'Dọn chảo cháy'); renderFryer(); return; }
  const e = R.fry.find(f => f.st === 'empty');
  if(!e){ setMsg(w, 'Canh chảo…'); return; }
  const k = cookNeed();
  if(!k){ setMsg(w, fryables().every(x => invOf(x) <= 0) ? 'Hết đồ sống rồi!' : 'Đủ đồ chiên, nghỉ tay'); return; }
  if(startFry(e, k)){ setMsg(w, `Chiên ${itemDef(k).e} ${shortOf(k)}`); renderFryer(); }
}
function waiterTick(w, dt){
  const tr = TRAITS[w.s.trait];
  if(w.job){
    const j = w.job, cu = j.cu;
    const alive = cu.online ? R.online.includes(cu) : R.cust.includes(cu);
    const it = alive && !cu.leaving ? cu.items[j.ii] : null;
    if(!it || it.done){ refundJob(w); setMsg(w, 'Khách đi rồi…'); return; }
    w.prog += dt * spdOf(w.s) / 1.4;
    if(w.prog < 1) return;
    w.job = null; w.prog = 0;
    if(tr.clumsy && Math.random() < tr.clumsy * .5){
      it.claimed = null;
      cu.mist++; cu.pat = Math.max(1, cu.pat - 2); R.stats.drops++; addDirt(6);
      setMsg(w, '🤕 Vấp té đổ cả phần!'); toast(`🤕 ${w.s.name} làm đổ món, làm lại phần đó nha!`); SFX.bad(); renderStreet(); renderOnline(); renderOrder(); return;
    }
    cu.waited = (cu.waited || 0) + 1;
    cu.pat = Math.min(cu.patMax, cu.pat + cu.patMax * .08);
    setMsg(w, `${cu.online ? 'Đưa shipper' : 'Đã bưng'} ${getR(it.id).n}`);
    markDone(cu, it);
    return;
  }
  w.cd -= dt * spdOf(w.s);
  if(w.cd > 0) return;
  w.cd = 5;
  const thirsty = R.cust.filter(c => c && !c.coin && !c.leaving && !c.tea && c.pat / c.patMax < .7).sort((a,b) => a.pat / a.patMax - b.pat / b.patMax)[0];
  if(thirsty){
    thirsty.tea = true; thirsty.pat = Math.min(thirsty.patMax, thirsty.pat + 6 + 2 * w.s.skill);
    setMsg(w, `🍵 Rót trà đá cho ${thirsty.vip ? 'quan lớn' : thirsty.title.toLowerCase() + ' ' + thirsty.name}`);
    const el = document.querySelector(`.tbl[data-uid="${thirsty.uid}"]`); if(el) floatAt(el, '🍵');
    return;
  }
  setMsg(w, R.t < CFG.dayLength ? 'Lau bàn, chờ bưng món' : 'Dọn dẹp');
}
function waiterFree(){ return R.crew && R.crew.find(w => w.st === 'on' && w.s.role === 'phucvu' && !w.job); }
function cashierTick(w, dt){
  w.cd -= dt * spdOf(w.s);
  if(w.cd > 0) return;
  w.cd = 3.2;
  const i = R.cust.findIndex(c => c && c.coin);
  if(i < 0) return;
  const amt = R.cust[i].amt;
  collectCoin(i, w);
  setMsg(w, `💰 Thu ${fmtK(amt)}`);
}
function staffTick(dt){
  if(!R.crew.length) return;
  const crowd = R.cust.filter(x => x && !x.leaving).length;
  const low = R.cust.some(x => x && !x.coin && !x.leaving && x.pat / x.patMax < .3);
  R.crew.forEach(w => {
    const tr = TRAITS[w.s.trait];
    if(w.st === 'out') return;
    if(w.st === 'late'){ w.t -= dt; if(w.t <= 0){ w.st = 'on'; setMsg(w, '⏰ Xin lỗi, kẹt xe!'); } return; }
    if(w.st === 'slack'){ w.t -= dt; if(w.t <= 0){ w.st = 'on'; setMsg(w, 'Quay lại làm'); } return; }
    if(tr.slack && R.t < CFG.dayLength && !w.job && Math.random() < dt * 0.035){ w.st = 'slack'; w.t = rnd(4, 7); setMsg(w, '📱 Lướt điện thoại…'); return; }
    if(tr.hot){
      w.mood = Math.min(100, w.mood + dt * (crowd >= seats() ? -5 : low ? -2.5 : 3));
      if(w.mood <= 0){
        refundJob(w); w.st = 'out'; setMsg(w, '😤 Bỏ về!');
        R.stats.walkouts.push(w.s.name);
        mascotPop(`${w.s.name} (${CFG.roles[w.s.role].n}) nổi nóng, cởi tạp dề bỏ về giữa ca! 😤`, 'bad');
        SFX.bad(); return;
      }
    }
    if(w.s.role === 'bep') cookTick(w, dt);
    else if(w.s.role === 'phucvu') waiterTick(w, dt);
    else if(w.s.role === 'thungan') cashierTick(w, dt);
    else if(w.s.role === 'vesinh') cleanerTick(w, dt);
  });
}

/* ========================= DỰ BÁO NGÀY MAI ========================= */
function forecastFor(day, evId){
  const ev = EVENTS.find(e => e.id === evId) || EVENTS[0];
  const lv = S.level, base = Math.max(2.5, clamp(13 - lv * .6 - (S.upg.sign || 0) * .8, 4, 14) / demand()) * (3 / seats()) * (ev.spawn || 1);
  const walk = CFG.dayLength / base;
  const cap = seats() * CFG.dayLength / 38;                         // mỗi bàn tối đa ~1 lượt / 38 giây
  const k = Math.round(Math.min(walk, cap + walk * .15));
  const onl = day >= CFG.onlineFromDay ? Math.round(CFG.dayLength / (clamp(34 - (S.rep - 3) * 12, 9, 60) * (ev.online || 1)) * .8) : 0;
  const risk = day < 3 ? 0 : evId === 'storm' ? 95 : evId === 'rain' ? 60 : 38;
  return { day, ev:evId, lo:Math.max(1, Math.round(k * .8)), hi:Math.round(k * 1.2) + 1, onl, risk };
}
function makeForecast(){ const e = rollEvent(S.day); S.fc = forecastFor(S.day, e.id); return S.fc; }

function update(dt){
  R.t += dt;

  if(open){
    R.spawnT -= dt * (incOn('flood') ? .35 : 1);
    if(R.spawnT <= 0){
      const i = R.cust.findIndex((c,j) => !c && !(incOn('roof') && R.inc.roof.i === j));
      if(i >= 0 && !R.queue.length){ R.cust[i] = makeCustomer(); R.stats.arrive++; renderStreet(); renderOrder(); SFX.bell(); }
      else if(R.queue.length < queueMax()){ R.queue.push({ t:R.t, face:pick(FACES) }); R.stats.arrive++; renderStreet(); }
      else R.stats.turned++;
      R.spawnT = nextSpawn();
    }
  }
  if(R.queue.length){
    const i = R.cust.findIndex((c,j) => !c && !(incOn('roof') && R.inc.roof.i === j));
    if(i >= 0){ R.queue.shift(); R.cust[i] = makeCustomer(); R.cust[i].t0 -= 5; renderStreet(); renderOrder(); SFX.bell(); }
    else if(R.t - R.queue[0].t > 40){
      R.queue.shift(); R.stats.queueLeft++;
      if(Math.random() < .07){ const d = pickDish(); addReview({ kind:'queue', cu:{ t0:R.t - 40, mist:0, items:[{ id:d.id }] }, dish:d, ratio:0 }); }
      renderStreet();
    }
  }
  if(S.upg.pay){ const wait = S.upg.pay >= 2 ? 2 : 5; R.cust.forEach((c,i) => { if(c && c.coin && R.t - (c.t || 0) > wait) collectCoin(i); }); }
  R.cust.forEach((c,i) => {
    if(!c || c.coin || c.leaving) return;
    c.pat -= dt * (dirtLv() === 3 ? 1.12 : 1) * ((incOn('power') || incOn('ac')) && (R.ev.id === 'hot' || S.upg.ac) ? 1.35 : incOn('power') ? 1.15 : 1);
    if(c.pat <= 0) angry(i);
  });
  if(open && onlineOpen()){
    R.onT -= dt;
    if(R.onT <= 0){
      if(R.online.filter(o => !o.leaving).length < onlineCap()){
        const o = makeOnline(); R.online.push(o); renderOnline(); renderOrder(); SFX.bell();
        toast(`${o.app.e} Có đơn app mới #${o.uid}!`);

    }
  }
  R.online.forEach(o => { if(o.leaving) return; o.pat -= dt; if(o.pat <= 0) cancelOnline(o); });
  R.fry.forEach((f,fi) => {
    if(f.st === 'frying'){
      if(fryBlocked(fi)) return;
      f.t += dt;
      if(f.t >= fryTime()){ f.st = 'done'; f.t = 0; SFX.done(); renderFryer(); }
    } else if(f.st === 'done'){

  if(R.t < CFG.dayLength) dramaTick(dt);

  hkhTick(); if(R.paused) return;
  renderInc();
  petals(dt);
  if(open){
    R.nbT -= dt;
    if(R.nbT <= 0){ R.nbT = rnd(18, 30); nbCheck(); if(R.paused) return; }
  }
  updateBars(); renderClock();
  if(!open && !R.closedShown){ R.closedShown = true; renderStreet(); renderOrder(); toast('🌙 Hết giờ! Phục vụ nốt khách còn lại'); }
  if(!open && !R.ended && !R.online.length && !R.queue.length && R.cust.every(c => !c || c.coin)){
    if(R.cust.some(c => c && c.coin)){ R.autoT = R.autoT || R.t; if(R.t - R.autoT > 3) collectAll(); }
    else endDay();
  }
}

function pickEvent(){
  if(S.fc && S.fc.day === S.day){ const e = EVENTS.find(x => x.id === S.fc.ev); if(e) return e; }
  return rollEvent(S.day);
}
function rollEvent(day){
  if(day === 1) return EVENTS[0];
  const pool = EVENTS.filter(e => !e.min || day >= e.min);
  let tot = pool.reduce((s,e) => s + e.w, 0), x = Math.random()*tot;
  for(const e of pool){ x -= e.w; if(x <= 0) return e; }
  return pool[0];
}

function autoFill(){
  const rs = unlocked();
  const expect = Math.round(16 + S.level * 4 + (S.upg.tables || 0) * 4 + (S.staff.length ? 6 : 0) + (onlineOpen() ? onlineCap() * 2 : 0));
  const occ = {};
  rs.forEach(r => r.items.forEach(k => occ[k] = (occ[k] || 0) + 1));
  cart = {};
  const want = (k, tgt) => {
    const have = invOf(k) - (lifeOf(k) === 1 ? 0 : expTonight(k) * 0);
    let need = Math.max(0, Math.ceil(tgt) - have);
    if(need > 0){ const p = packOf(k); need = Math.ceil(need / p) * p; cart[k] = need; }
  };
  for(const k in occ) want(k, expect * occ[k] / rs.length * 1.1);
  want('hop', expect * 1.1);
  if(!Object.keys(cart).length) toast('Kho đã đủ hàng cho hôm nay 👍');
}

  if(S.money < total){ toast('Két không đủ tiền nhập hết giỏ hàng'); SFX.bad(); return; }
  const f = 1 - discToday() / 100;
  for(const [k,q] of Object.entries(cart)){
    invAdd(k, q);
    led(k === 'hop' ? 'Nhập hộp + đũa' : CFG.soups.includes(k) ? `Nấu ${itemDef(k).n.toLowerCase()}` : `Nhập ${itemDef(k).n.toLowerCase()}`, -Math.round(q * costOf(k) * f), 'buy');
  }
  S.money -= total;
  cart = {};
  SFX.pay(); save(); renderHud(); renderHub(true);
  toast(`Đã nhập hàng ${fmtK(total)} ✅`);
}
